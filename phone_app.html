const ALBUM_REMOTE_BASE='https://birdimage.kdns.fr/PicGo/watanare/';
const ALBUM_REMOTE_ROOT='https://birdimage.kdns.fr/PicGo/';
const ALBUM_MANIFEST_URL=ALBUM_REMOTE_BASE+'manifest.json';
const ALBUM_CACHE_KEY='wn:album-manifest:v2';
const ALBUM_TIMEOUT_MS=5000, ALBUM_MAX_ITEMS=500;
const ALBUM_INFO={source:'none',revision:'',error:'',loading:false,checkedAt:0};
let ALBUM=null, ALBUM_LOAD=null, ALBUM_REFRESH=null, VIEW={list:[],i:0};
function albumErrorText(error){
  return String(error&&error.message||error||'相册清单读取失败').replace(/\s+/g,' ').trim().slice(0,180);
}
function albumHttpsUrl(value,base='',restrictBase=''){
  const text=String(value||'').trim(); if(!text) return '';
  let url;
  try{ url=base ? new URL(text,base) : new URL(text); }catch(_){ return ''; }
  if(url.protocol!=='https:' || url.username || url.password) return '';
  if(restrictBase){
    let root; try{ root=new URL(restrictBase); }catch(_){ return ''; }
    if(url.origin!==root.origin || !url.pathname.startsWith(root.pathname)) return '';
  }
  url.hash=''; return url.href;
}
function safeAlbumKey(value){
  const key=String(value||'').trim();
  return !!key && key.length<=80 && !['__proto__','prototype','constructor'].includes(key);
}
function albumManifestCandidates(name,aliases){
  if(typeof roleNameCandidates==='function') return roleNameCandidates(name,aliases);
  const raw=String(name||'').trim(),out=raw?[raw]:[];
  if(!obj(aliases)||!raw) return out;
  if(own(aliases,raw)&&String(aliases[raw]||'').trim()) out.push(String(aliases[raw]).trim());
  Object.entries(aliases).forEach(([alias,target])=>{if(String(target||'').trim()===raw)out.push(String(alias).trim());});
  return [...new Set(out)];
}
function normalizeAlbumManifest(raw,{remote=false}={}){
  if(!obj(raw)) throw new Error('相册清单不是对象');
  const revision=typeof raw.revision==='string'?raw.revision.trim():'';
  if(remote && (raw.schema!==2 || !/^\d{4}-\d{2}-\d{2}-\d{2}$/.test(revision)))
    throw new Error('远端相册清单版本无效');
  const base=raw.base ? albumHttpsUrl(raw.base):'';
  if(remote && base!==ALBUM_REMOTE_BASE) throw new Error('远端相册根地址不匹配');
  if(!obj(raw.头像)) throw new Error('相册清单缺少头像表');
  const restrict=remote?ALBUM_REMOTE_ROOT:'';
  const normalized={base,头像:{},头像别名:{}};
  if(remote){ normalized.schema=2; normalized.revision=revision; }
  for(const [name,srcValue] of Object.entries(raw.头像)){
    if(!safeAlbumKey(name)){ if(remote) throw new Error('远端头像角色名无效'); else continue; }
    const src=albumHttpsUrl(srcValue,base,restrict);
    if(!src){ if(remote) throw new Error('远端头像链接无效：'+name); else continue; }
    normalized.头像[name]=src;
  }
  if(raw.头像别名!=null&&!obj(raw.头像别名)) throw new Error('相册头像别名表无效');
  for(const [alias,targetValue] of Object.entries(obj(raw.头像别名)?raw.头像别名:{})){
    const target=String(targetValue||'').trim();
    if(!safeAlbumKey(alias)||!safeAlbumKey(target)||alias===target||!own(normalized.头像,target)){
      if(remote) throw new Error('远端头像别名无效：'+alias); else continue;
    }
    normalized.头像别名[alias]=target;
  }
  let total=0;
  for(const [name,value] of Object.entries(raw)){
    if(['schema','revision','base','头像','头像别名','manifest'].includes(name) || !Array.isArray(value)) continue;
    if(!safeAlbumKey(name)){ if(remote) throw new Error('远端相册分册名无效'); else continue; }
    if(value.length>ALBUM_MAX_ITEMS) throw new Error('单个相册分册图片过多');
    const items=[];
    for(const item of value){
      if(!obj(item)){ if(remote) throw new Error('远端相册条目无效'); else continue; }
      const src=albumHttpsUrl(item.src,base,restrict);
      if(!src){ if(remote) throw new Error('远端相册图片链接无效：'+name); else continue; }
      const next={src,title:typeof item.title==='string'?item.title.slice(0,120):'',
        hint:typeof item.hint==='string'?item.hint.slice(0,240):''};
      const itemId=typeof item.id==='string'?item.id.trim():'';
      if(itemId && /^[a-z][a-z0-9-]{0,119}$/.test(itemId)) next.id=itemId;
      else if(remote) throw new Error('远端相册图片 ID 无效：'+name);
      if(own(item,'unlock')){
        if(!obj(item.unlock)){ if(remote) throw new Error('远端相册解锁条件无效'); else continue; }
        next.unlock=item.unlock;
      }
      items.push(next); total++;
      if(total>ALBUM_MAX_ITEMS) throw new Error('相册图片总数过多');
    }
    normalized[name]=items;
  }
  if(remote){
    const avatarNames=Object.keys(normalized.头像);
    if(!avatarNames.length || !Array.isArray(normalized.剧情)) throw new Error('远端相册缺少必要分册');
    for(const [name,value] of Object.entries(normalized)){
      if(name!=='剧情'&&Array.isArray(value)&&!albumManifestCandidates(name,normalized.头像别名).some(candidate=>own(normalized.头像,candidate)))
        throw new Error('远端相册分册缺少同名头像：'+name);
    }
  }
  return normalized;
}
async function fetchRemoteAlbum(){

      redirect:'error',referrerPolicy:'no-referrer',headers:{Accept:'application/json'},signal:controller.signal});
    if(!response.ok) throw new Error('图床返回 '+response.status);
    const text=await response.text();
    let parsed; try{ parsed=JSON.parse(text); }catch(_){ throw new Error('远端相册清单不是有效 JSON'); }
    return normalizeAlbumManifest(parsed,{remote:true});

async function loadAlbum(force=false){

    if(!ALBUM) await loadAlbum(false);

  }
  if(ALBUM) return ALBUM;
  if(ALBUM_LOAD) return ALBUM_LOAD;
  ALBUM_LOAD=(async()=>{
    const cached=readCachedAlbum();
    if(cached){
      ALBUM_INFO.source='cache'; ALBUM_INFO.revision=cached.revision||''; ALBUM_INFO.error='';
      setTimeout(()=>{ refreshRemoteAlbum().catch(()=>{}); },0);
      return mergeCardAvatarFallback(cached);

    ALBUM_INFO.source=albumHasContent(card)?'card':'empty'; ALBUM_INFO.revision=''; ALBUM_INFO.error='';
    setTimeout(()=>{ refreshRemoteAlbum().catch(()=>{}); },0);
    return card;
  })();

  finally{ ALBUM_LOAD=null; }

function albumConditionMatches(condition){
  if(!obj(condition) || typeof condition.path!=='string' || !condition.path.trim()) return false;
  const knownOps=['exists','gte','lte','eq','contains','monthIn'];
  if(Object.keys(condition).some(key=>key!=='path'&&!knownOps.includes(key))) return false;
  const ops=knownOps.filter(op=>own(condition,op)); if(ops.length!==1) return false;
  const op=ops[0], expected=condition[op], hit=albumReadPath(condition.path);
  if(op==='exists') return typeof expected==='boolean' && (expected?hit.found:!hit.found);
  if(!hit.found) return false;
  const actual=hit.value;
  if(op==='monthIn'){
    if(!Array.isArray(expected)||!expected.length||expected.some(value=>
      !Number.isInteger(value)||value<1||value>12)||new Set(expected).size!==expected.length) return false;
    const match=String(actual||'').match(/(?:^|\D)(\d{1,2})月/);
    return !!match && expected.includes(Number(match[1]));
  }
  if(op==='gte'||op==='lte'){
    const numeric=value=>typeof value==='number'||(typeof value==='string'&&value.trim())?Number(value):NaN;
    const left=numeric(actual), right=numeric(expected);
    if(!Number.isFinite(left)||!Number.isFinite(right)) return false;
    return op==='gte'?left>=right:left<=right;
  }
  const scalar=value=>value==null||['string','number','boolean'].includes(typeof value);
  if(!scalar(actual)||!scalar(expected)) return false;
  if(op==='eq') return String(actual)===String(expected);
  return String(actual==null?'':actual).includes(String(expected==null?'':expected));
}
function albumReadPath(path){
  const raw=String(path||'').trim(),direct=readPath(S.stat,raw);
  if(direct.found) return direct;
  const match=/^角色\.([^\.]+)\.(.+)$/u.exec(raw);
  if(!match||typeof roleVariableKey!=='function') return direct;
  const key=roleVariableKey(match[1]);
  return key&&key!==match[1]?readPath(S.stat,'角色.'+key+'.'+match[2]):direct;
}
function albumUnlockMatches(unlock,depth=0){
  if(!obj(unlock)||depth>6) return false;
  const modes=['all','any'].filter(mode=>own(unlock,mode));
  if(modes.length){
    if(modes.length!==1 || Object.keys(unlock).length!==1 || !Array.isArray(unlock[modes[0]]) || !unlock[modes[0]].length) return false;
    return modes[0]==='all'
      ? unlock.all.every(condition=>albumUnlockMatches(condition,depth+1))
      : unlock.any.some(condition=>albumUnlockMatches(condition,depth+1));
  }
  return albumConditionMatches(unlock);
}
function albumItemId(item){
  const id=obj(item)&&typeof item.id==='string'?item.id.trim():'';
  return /^[a-z][a-z0-9-]{0,119}$/.test(id)?id:'';
}
function albumItemRemembered(item){
  const id=albumItemId(item);
  return !!id && obj(S.store) && obj(S.store.albumUnlocked) && S.store.albumUnlocked[id]===true;
}
function albumRoleAtMax(folder){
  if(typeof folder!=='string'||!folder) return false;
  const key=typeof roleVariableKey==='function'?roleVariableKey(folder):folder;
  if(!key) return false;
  const hit=readPath(S.stat,'角色.'+key+'.情感倾向');
  const value=hit.found?Number(hit.value):NaN;
  return Number.isFinite(value)&&value>=200;
}
function cgConditionUnlocked(item){
  if(!obj(item)) return false;
  if(!own(item,'unlock')) return true;
  return albumUnlockMatches(item.unlock);
}
function cgUnlocked(item,folder=''){
  return albumItemRemembered(item) || albumRoleAtMax(folder) || cgConditionUnlocked(item);
}
function albumUnlockLeaves(unlock,out=[]){
  if(!obj(unlock)) return out;
  const modes=['all','any'].filter(mode=>own(unlock,mode));
  if(modes.length===1 && Object.keys(unlock).length===1 && Array.isArray(unlock[modes[0]])){
    unlock[modes[0]].forEach(item=>albumUnlockLeaves(item,out));
  }else out.push(unlock);
  return out;
}
function albumProgressText(item,folder){
  const labels={情感倾向:'情感',信任程度:'信任',亲密程度:'亲密',性吸引力:'吸引'};
  const parts=[];
  for(const condition of albumUnlockLeaves(item&&item.unlock)){
    if(!obj(condition)||typeof condition.path!=='string') continue;
     const hit=albumReadPath(condition.path), field=condition.path.split('.').pop();
    if(own(condition,'gte')&&own(labels,field)){
      const current=hit.found&&Number.isFinite(Number(hit.value))?Math.floor(Number(hit.value)):0;
      parts.push(labels[field]+' '+current+'/'+condition.gte);
    }else if(own(condition,'eq')&&field==='联系方式'&&condition.eq===true){
      parts.push(hit.found&&hit.value===true?'已交换联系方式':'尚未交换联系方式');
    }else if(own(condition,'monthIn')){
      const match=String(hit.found?hit.value:'').match(/(?:^|\D)(\d{1,2})月/);
      const current=match?Number(match[1])+'月':'日期未定';
      parts.push('当前 '+current+'，需 '+condition.monthIn.join('、')+'月');
    }
  }
  if(!parts.length && folder && albumRoleAtMax(folder)) return '情感倾向达到 200，已触发全部解锁';
  return [...new Set(parts)].slice(0,4).join(' · ');
}
let ALBUM_UNLOCK_QUEUE=Promise.resolve();
let ALBUM_CONTEXT_EPOCH=0, ALBUM_REPAIR_BUSY=false;
function dlcAlbumRepairEntries(man){
  const entries=[];
  for(const [name,slug] of [['真昼','mahiru'],['塞西莉亚','cecilia']]){
    const items=man&&man[name];
    if(!Array.isArray(items)||items.length!==21) return null;
    for(const item of items){
      const id=albumItemId(item), conditions=item&&item.unlock&&item.unlock.all;
      if(!id.startsWith(slug+'-')||!Array.isArray(conditions)||!conditions.length) return null;
      if(id!==slug+'-standing-001'&&!conditions.some(c=>obj(c)&&
        ['情感倾向','信任程度','亲密程度'].some(field=>c.path==='角色.'+name+'.'+field)&&Number(c.gte)>0)) return null;
      entries.push({name,item,id});
    }
  }
  return new Set(entries.map(e=>e.id)).size===42?entries:null;
}
WN.recheckDlcAlbums=async function(){

      }catch(error){
        if(!written&&sameChat()&&store.albumUnlocked===next) store.albumUnlocked=before;

      }

  }catch(error){ if(sameChat()) toast('相册重新判定：'+error.message); }

    }
  }
};
function syncAlbumUnlocks(manifest){
  const epoch=ALBUM_CONTEXT_EPOCH, store=S.store;
  const run=async()=>{
    if(!obj(store)||S.store!==store||epoch!==ALBUM_CONTEXT_EPOCH) return false;
    const man=manifest||await loadAlbum(), ids=[];
    if(S.store!==store||epoch!==ALBUM_CONTEXT_EPOCH) return false;
    for(const [folder,items] of Object.entries(man||{})){
      if(folder==='base'||folder==='头像'||!Array.isArray(items)) continue;
      for(const item of items){
        const id=albumItemId(item);
        if(!id||albumItemRemembered(item)) continue;
        if(albumRoleAtMax(folder)||cgConditionUnlocked(item)) ids.push(id);
      }
    }
    if(!ids.length) return false;
    try{
      await mutStore(st=>{
        st.albumUnlocked=obj(st.albumUnlocked)?st.albumUnlocked:Object.create(null);
        ids.forEach(id=>{ st.albumUnlocked[id]=true; });
      });
      return true;
    }catch(error){
      /* 写入失败时仍按实时条件显示，后续刷新会再次尝试永久保存。 */
      console.warn('[WN] album unlock persist',error);
      return false;
    }
  };
  ALBUM_UNLOCK_QUEUE=ALBUM_UNLOCK_QUEUE.then(run,run);
  return ALBUM_UNLOCK_QUEUE;
}

/* ---------- 日程与约定提醒 ---------- */
function scheduleBuildParts(year,month,day){
  year=Number(year); month=Number(month); day=Number(day);
  if(!Number.isInteger(year)||year<1||!Number.isInteger(month)||month<1||month>12||!Number.isInteger(day)||day<1) return null;
  const d=new Date(Date.UTC(year,month-1,day));
  if(d.getUTCFullYear()!==year||d.getUTCMonth()!==month-1||d.getUTCDate()!==day) return null;
  return {year,month,day};
}
function scheduleDateTokenMatches(value){
  const text=String(value||'').trim(), out=[];
  const re=/(?:(\d{4})\s*(?:年|[\/.\-]))?\s*(\d{1,2})\s*(?:月|[\/.\-])\s*(\d{1,2})\s*日?/gu;
  let m;
  while((m=re.exec(text))){
    out.push({year:m[1]?Number(m[1]):0,month:Number(m[2]),day:Number(m[3]),explicitYear:!!m[1]});
    if(!m[0]) re.lastIndex++;
  }
  return out;
}
function scheduleDateParts(value){
  const token=scheduleDateTokenMatches(value).find(item=>item.explicitYear);
  return token?scheduleBuildParts(token.year,token.month,token.day):null;
}
function scheduleDateKey(parts){ return parts?`${parts.year}-${String(parts.month).padStart(2,'0')}-${String(parts.day).padStart(2,'0')}`:''; }
function schedulePartsFromKey(key){
  const m=String(key||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?scheduleBuildParts(Number(m[1]),Number(m[2]),Number(m[3])):null;
}
function scheduleDayIndex(parts){ return parts?Math.floor(Date.UTC(parts.year,parts.month-1,parts.day)/86400000):NaN; }
function scheduleShiftDays(parts,delta){
  if(!parts) return null;
  const d=new Date(Date.UTC(parts.year,parts.month-1,parts.day+Number(delta||0)));
  return scheduleBuildParts(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
}
function scheduleDaysInMonth(year,month){ return new Date(Date.UTC(year,month,0)).getUTCDate(); }
function scheduleNowParts(){
  const world=S.stat.世界||{};
  return scheduleDateParts(world.日期||'');
}
function scheduleResolveToken(token,now,anchor,preferFuture=false){
  if(!token) return null;
  if(token.explicitYear) return scheduleBuildParts(token.year,token.month,token.day);
  const base=anchor||now; if(!base) return null;
  let result=scheduleBuildParts(base.year,token.month,token.day); if(!result) return null;
  if(anchor){
    if(scheduleDayIndex(result)<scheduleDayIndex(anchor)) result=scheduleBuildParts(base.year+1,token.month,token.day);
    return result;
  }
  if(now&&preferFuture&&scheduleDayIndex(result)<scheduleDayIndex(now)) result=scheduleBuildParts(base.year+1,token.month,token.day);
  return result;
}
function scheduleRangeParts(text,now,preferFuture=false){
  const sameMonth=String(text||'').match(/(?:(\d{4})\s*年\s*)?(\d{1,2})\s*月\s*(\d{1,2})\s*日?\s*(?:至|到|—|–|~|～|-)\s*(?:(\d{4})\s*年\s*)?(?:(\d{1,2})\s*月\s*)?(\d{1,2})\s*日?/u);
  if(sameMonth){
    const start=scheduleResolveToken({year:sameMonth[1]?Number(sameMonth[1]):0,month:Number(sameMonth[2]),day:Number(sameMonth[3]),explicitYear:!!sameMonth[1]},now,null,preferFuture);
    if(!start) return null;
    const endYear=sameMonth[4]?Number(sameMonth[4]):start.year;
    const endMonth=sameMonth[5]?Number(sameMonth[5]):start.month;
    let end=scheduleBuildParts(endYear,endMonth,Number(sameMonth[6]));
    if(!end) return null;
    if(!sameMonth[4] && scheduleDayIndex(end)<scheduleDayIndex(start)) end=scheduleBuildParts(start.year+1,endMonth,Number(sameMonth[6]));
    return end?{start,end}:null;
  }
  const tokens=scheduleDateTokenMatches(text); if(!tokens.length) return null;
  const start=scheduleResolveToken(tokens[0],now,null,preferFuture); if(!start) return null;
  let end=start;
  if(tokens.length>1) end=scheduleResolveToken(tokens[1],now,start);
  if(!end) return null;
  if(scheduleDayIndex(end)<scheduleDayIndex(start)) return {start:end,end:start};
  return {start,end};
}
function scheduleDeadline(deadline,status=''){
  const text=String(deadline||'').trim(); if(!text||/^(无|暂无|待定|未定)$/u.test(text)) return null;
  const now=scheduleNowParts(); let range=null;
  const relativeRange=text.match(/^(今天|今日|本日)\s*(?:至|到|—|–|~|～|-)\s*(明天|后天)$/u);
  if(relativeRange&&now){
    const offset=relativeRange[2]==='后天'?2:1;
    range={start:now,end:scheduleShiftDays(now,offset)};
  }else if(/^(今天|今日|本日)/u.test(text)&&now){ range={start:now,end:now};
  }else if(/^明天/u.test(text)&&now){ const d=scheduleShiftDays(now,1); range={start:d,end:d};
  }else if(/^后天/u.test(text)&&now){ const d=scheduleShiftDays(now,2); range={start:d,end:d};
  }else range=scheduleRangeParts(text,now,status==='进行中');
  if(!range||!range.start||!range.end) return null;
  const currentIndex=scheduleDayIndex(now), startIndex=scheduleDayIndex(range.start), endIndex=scheduleDayIndex(range.end);
  const diff=Number.isFinite(currentIndex)?endIndex-currentIndex:NaN;
  const time=(text.match(/(?:^|\s)(\d{1,2})\s*[:：]\s*(\d{2})/)||[]);
  const timeText=time.length?`${String(Number(time[1])).padStart(2,'0')}:${time[2]}`:'';
  return {parts:range.end,key:scheduleDateKey(range.end),start:range.start,end:range.end,
    startKey:scheduleDateKey(range.start),endKey:scheduleDateKey(range.end),startIndex,endIndex,diff,time:timeText,label:text};
}
function scheduleRows(){
  const pacts=get(S.stat,'世界.约定',{}); if(!obj(pacts)) return [];
  const now=scheduleNowParts(), nowIndex=scheduleDayIndex(now);
  return Object.entries(pacts).filter(([,p])=>obj(p)).map(([name,p])=>{
    const status=String(p.状态||'悬置'), due=scheduleDeadline(p.期限,status); let state='done';
    if(status==='进行中'){
      if(!due) state='open';
      else if(!Number.isFinite(due.diff)) state='future';
      else if(due.diff<0) state='overdue';
      else if(due.diff===0) state='today';
      else if(Number.isFinite(nowIndex)&&due.startIndex<=nowIndex&&nowIndex<due.endIndex) state='ongoing';
      else if(due.diff===1) state='soon';
      else state='future';
    }
    const label=state==='today'?'今天到期':state==='soon'?'明天到期':state==='overdue'?'已逾期':state==='ongoing'?'进行中':status;
    return {name,p,status,due,state,label};
  }).sort((a,b)=>{
    const order={ongoing:0,today:1,overdue:2,soon:3,future:4,open:5,done:6};
    const ad=a.due&&Number.isFinite(a.due.diff)?a.due.diff:9999, bd=b.due&&Number.isFinite(b.due.diff)?b.due.diff:9999;
    return (order[a.state]??9)-(order[b.state]??9)||ad-bd||a.name.localeCompare(b.name,'zh-CN');
  });
}
function scheduleRowsForDay(rows,key){
  const parts=schedulePartsFromKey(key), index=scheduleDayIndex(parts); if(!Number.isFinite(index)) return [];
  return rows.filter(row=>row.due&&row.due.startIndex<=index&&index<=row.due.endIndex);
}
const SCHEDULE_JP_HOLIDAY_CACHE=new Map();
function scheduleNthMonday(year,month,nth){
  const first=new Date(Date.UTC(year,month-1,1));
  return 1+((1-first.getUTCDay()+7)%7)+(nth-1)*7;
}
function scheduleEquinoxDay(year,spring){
  if(year<1980||year>2099) return 0;
  const base=spring?20.8431:23.2488;
  return Math.floor(base+0.242194*(year-1980)-Math.floor((year-1980)/4));
}
function scheduleJapanHolidays(year){
  year=Math.trunc(Number(year));
  if(SCHEDULE_JP_HOLIDAY_CACHE.has(year)) return SCHEDULE_JP_HOLIDAY_CACHE.get(year);
  const holidays=new Map();
  SCHEDULE_JP_HOLIDAY_CACHE.set(year,holidays);
  if(year<2000||year>2099) return holidays;
  const putParts=(parts,name)=>{ const key=scheduleDateKey(parts); if(key) holidays.set(key,name); };
  const put=(month,day,name)=>putParts(scheduleBuildParts(year,month,day),name);
  put(1,1,'元旦');
  put(1,scheduleNthMonday(year,1,2),'成人节');
  put(2,11,'建国纪念日');
  if(year>=2020) put(2,23,'天皇诞辰');
  else if(year<=2018) put(12,23,'天皇诞辰');
  put(3,scheduleEquinoxDay(year,true),'春分日');
  put(4,29,year>=2007?'昭和日':'绿之日');
  put(5,3,'宪法纪念日');
  if(year>=2007) put(5,4,'绿之日');
  put(5,5,'儿童节');
  if(year===2020) put(7,23,'海之日');
  else if(year===2021) put(7,22,'海之日');
  else put(7,year>=2003?scheduleNthMonday(year,7,3):20,'海之日');
  if(year>=2016){
    if(year===2020) put(8,10,'山之日');
    else if(year===2021) put(8,8,'山之日');
    else put(8,11,'山之日');
  }
  put(9,year>=2003?scheduleNthMonday(year,9,3):15,'敬老节');
  put(9,scheduleEquinoxDay(year,false),'秋分日');
  if(year===2020) put(7,24,'体育节');
  else if(year===2021) put(7,23,'体育节');
  else put(10,scheduleNthMonday(year,10,2),'体育节');
  put(11,3,'文化节');
  put(11,23,'劳动感谢节');
  if(year===2019){
    put(5,1,'天皇即位日');
    put(10,22,'即位礼正殿之仪');
  }
  for(const key of [...holidays.keys()].sort()){
    const parts=schedulePartsFromKey(key), middle=scheduleShiftDays(parts,1), after=scheduleShiftDays(parts,2);
    if(!middle||!after||new Date(Date.UTC(middle.year,middle.month-1,middle.day)).getUTCDay()===0) continue;
    const middleKey=scheduleDateKey(middle), afterKey=scheduleDateKey(after);
    if(!holidays.has(middleKey)&&holidays.has(afterKey)) holidays.set(middleKey,'国民假日');
  }
  for(const key of [...holidays.keys()].sort()){
    const parts=schedulePartsFromKey(key);
    if(!parts||new Date(Date.UTC(parts.year,parts.month-1,parts.day)).getUTCDay()!==0) continue;
    let next=scheduleShiftDays(parts,1);
    while(next&&holidays.has(scheduleDateKey(next))) next=scheduleShiftDays(next,1);
    if(next) holidays.set(scheduleDateKey(next),'振替休日');
  }
  return holidays;
}
function scheduleHolidayName(parts){
  return parts?(scheduleJapanHolidays(parts.year).get(scheduleDateKey(parts))||''):'';
}
function scheduleEventTone(name){
  let hash=0;
  for(const ch of String(name||'')) hash=(hash*31+ch.codePointAt(0))%9973;
  return `t${hash%5}`;
}
function scheduleMonthCells(year,month){
  const first=new Date(Date.UTC(year,month-1,1)), offset=first.getUTCDay();
  const base=new Date(Date.UTC(year,month-1,1-offset));
  const weeks=Math.ceil((offset+scheduleDaysInMonth(year,month))/7);
  return Array.from({length:weeks*7},(_,i)=>{ const d=new Date(base.getTime()+i*86400000); return scheduleBuildParts(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); });
}
/* 羁绊足迹：角色.羁绊 里 "M/D 事件" 格式的条目落成月历标记；解析不了的跳过，不写回 */
function bondFootprints(){
  const out=[];
  charList().forEach(([name,c])=>{
    const txt=String(c&&c.羁绊||'');
    if(!txt) return;
    txt.split(/[；;]+/).forEach(seg=>{
      const m=/^\s*(\d{1,2})\s*[\/月.\-]\s*(\d{1,2})\s*[日号]?\s*(.{0,40})/.exec(seg);
      if(!m) return;
      const month=+m[1], day=+m[2];
      if(month<1||month>12||day<1||day>31) return;
      out.push({name, month, day, text:String(m[3]||'').trim()});
    });
  });
  return out;
}
function dayBonds(parts){
  if(!parts) return [];
  return bondFootprints().filter(b=>b.month===parts.month&&b.day===parts.day);
}
function scheduleWeekHtml(cells,weekIndex,rows,todayKey,selectedKey){
  const week=cells.slice(weekIndex*7,weekIndex*7+7), weekStart=scheduleDayIndex(week[0]), weekEnd=scheduleDayIndex(week[6]);
  const dayHtml=week.map((parts,col)=>{
    const key=scheduleDateKey(parts), outside=parts.month!==SCHEDULE_VIEW.month, holiday=scheduleHolidayName(parts);
    const dayRows=scheduleRowsForDay(rows,key), classes=['sched-day'], bonds=dayBonds(parts);
    if(outside) classes.push('outside'); if(col===0) classes.push('sunday'); if(col===6) classes.push('saturday');
    if(holiday) classes.push('holiday');
    if(key===todayKey) classes.push('current'); if(key===selectedKey) classes.push('selected');
    const names=dayRows.slice(0,3).map(row=>row.name).join('、');
    const aria=`${parts.year}年${parts.month}月${parts.day}日${holiday?'，'+holiday:''}${names?'，'+names:''}${bonds.map(b=>'，'+b.name+'：'+(b.text||'羁绊足迹')).join('')}`;
    const holidayHtml=holiday?`<span class="hd" title="${esc(holiday)}">${esc(holiday)}</span>`:'';
    return `<button type="button" class="${classes.join(' ')}" aria-label="${esc(aria)}" onclick="WN.scheduleSelect('${key}')"><span class="n num">${parts.day}</span>${holidayHtml}${bonds.length?'<span class="bond-mark" aria-hidden="true"></span>':''}</button>`;
  }).join('');
  const candidates=rows.filter(row=>row.due&&row.due.startIndex<=weekEnd&&row.due.endIndex>=weekStart)
    .map(row=>({row,start:Math.max(row.due.startIndex,weekStart),end:Math.min(row.due.endIndex,weekEnd)}))
    .sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start)||a.row.name.localeCompare(b.row.name,'zh-CN'));
  const laneEnds=[-Infinity,-Infinity], visible=[], hidden=[];
  for(const item of candidates){
    const lane=laneEnds.findIndex(end=>item.start>end);
    if(lane<0){ hidden.push(item); continue; }
    laneEnds[lane]=item.end; visible.push({...item,lane});
  }
  const eventHtml=visible.map(item=>{
    const row=item.row, left=item.start-weekStart+1, right=item.end-weekStart+2;
    const classes=['sched-event',scheduleEventTone(row.name),row.state];
    if(row.due.startIndex<weekStart) classes.push('cont-left'); if(row.due.endIndex>weekEnd) classes.push('cont-right');
    return `<span class="${classes.join(' ')}" style="grid-column:${left}/${right};grid-row:${item.lane+1}" aria-hidden="true"></span>`;
  }).join('');
  return `<section class="sched-week"><div class="sched-days">${dayHtml}</div><div class="sched-events">${eventHtml}</div>${hidden.length?`<span class="sched-week-more">+${hidden.length}</span>`:''}</section>`;
}
const SCHEDULE_VIEW={year:0,month:0,selected:'',today:''};
function scheduleSyncView(now){
  const key=scheduleDateKey(now); if(!key) return;
  if(!SCHEDULE_VIEW.year||!SCHEDULE_VIEW.month){ SCHEDULE_VIEW.year=now.year; SCHEDULE_VIEW.month=now.month; SCHEDULE_VIEW.selected=key; }
  else if(SCHEDULE_VIEW.today===SCHEDULE_VIEW.selected){ SCHEDULE_VIEW.year=now.year; SCHEDULE_VIEW.month=now.month; SCHEDULE_VIEW.selected=key; }
  SCHEDULE_VIEW.today=key;
}
WN.scheduleShift=function(delta){
  const now=scheduleNowParts(); if(!now&&!SCHEDULE_VIEW.year){ toast('当前剧情日期无法识别'); return; }
  if(!SCHEDULE_VIEW.year) scheduleSyncView(now);
  const selected=schedulePartsFromKey(SCHEDULE_VIEW.selected), d=new Date(Date.UTC(SCHEDULE_VIEW.year,SCHEDULE_VIEW.month-1+Number(delta||0),1));
  SCHEDULE_VIEW.year=d.getUTCFullYear(); SCHEDULE_VIEW.month=d.getUTCMonth()+1;
  const day=Math.min(selected?selected.day:1,scheduleDaysInMonth(SCHEDULE_VIEW.year,SCHEDULE_VIEW.month));
  SCHEDULE_VIEW.selected=scheduleDateKey(scheduleBuildParts(SCHEDULE_VIEW.year,SCHEDULE_VIEW.month,day));
  renderSchedule(false);
};
WN.scheduleToday=function(){
  const now=scheduleNowParts(); if(!now){ toast('当前剧情日期无法识别'); return; }
  SCHEDULE_VIEW.year=now.year; SCHEDULE_VIEW.month=now.month; SCHEDULE_VIEW.selected=scheduleDateKey(now); SCHEDULE_VIEW.today=SCHEDULE_VIEW.selected;
  renderSchedule(false);
};
WN.scheduleSelect=function(key){
  const parts=schedulePartsFromKey(key); if(!parts) return;

  renderSchedule(false);

function scheduleCalendarHtml(world,rows,now){

function scheduleDetailHtml(rows,key,now){
  const parts=schedulePartsFromKey(key), picked=scheduleRowsForDay(rows,key), index=scheduleDayIndex(parts), weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function renderSchedule(navigate=true){

  const active=rows.filter(x=>x.state!=='done'), done=rows.filter(x=>x.state==='done'), undated=active.filter(x=>!x.due);

let scheduleSyncBusy=false;
async function syncScheduleReminders(){
  if(scheduleSyncBusy||!S.store) return;
  const rows=scheduleRows().filter(row=>row.status==='进行中' && (row.state==='today'||row.state==='soon'||row.state==='overdue'));
  const nowP=scheduleNowParts();
  const todayBonds=nowP?dayBonds(nowP):[];
  if(!rows.length&&!todayBonds.length) return;
  scheduleSyncBusy=true;
  try{
    const fresh=[], freshBonds=[];
    await mutStore(st=>{
      st.schedule=obj(st.schedule)?st.schedule:{seen:Object.create(null)};
      st.schedule.seen=obj(st.schedule.seen)?st.schedule.seen:Object.create(null);
      for(const row of rows){
        const sig=[row.name,row.p.期限,row.p.状态,S.stat.世界&&S.stat.世界.日期,row.state].map(String).join('|');
        if(own(st.schedule.seen,sig)) continue;
        st.schedule.seen[sig]=1; fresh.push(row);
      }
      for(const b of todayBonds){
        const sig=['bond',nowP.year,b.name,b.month,b.day].map(String).join('|');
        if(own(st.schedule.seen,sig)) continue;
        st.schedule.seen[sig]=1; freshBonds.push(b);
      }
    });
    for(const row of fresh){
      const when=row.state==='overdue'?'已逾期':row.state==='today'?'今天到期':'明天到期';
      await pushNote('schedule',`${row.name} · ${when}`,String(row.p.内容||'').slice(0,70),{key:row.name});
    }
    for(const b of freshBonds){
      await pushNote('schedule','羁绊足迹 · '+b.name,String(b.text||'今天记下了新的一页').slice(0,70),{});
    }
  }catch(e){ console.warn('[WN] schedule reminder',e); }
  finally{ scheduleSyncBusy=false; }
}

    <span class="pull-orb" aria-hidden="true">
      <svg class="pull-arrow" viewBox="0 0 24 24"><path d="M12 5v12m-5-5 5 5 5-5"/></svg><span class="pull-spinner"></span>
    </span><span class="pull-label">${busy?'正在刷新':'下拉刷新'}</span></div>`;
}
function setCampusPull(offset,ready,id='campus-pull',busy=campusBusy){
  const el=$id(id); if(!el||busy) return;
  const y=clamp(Number(offset)||0,0,88);
  const progress=Math.min(1,y/62);
  el.style.transform=`translateY(${y}px)`; el.style.marginBottom=`${y}px`; el.style.opacity=String(Math.min(1,y/28));
  el.style.setProperty('--pull-angle',`${Math.round(progress*180)}deg`);
  el.style.setProperty('--pull-scale',String(.82+progress*.18));
  el.classList.toggle('ready',!!ready);
  const label=el.querySelector('.pull-label'); if(label) label.textContent=ready?'松开刷新':'下拉刷新';
}
function bindCampusPull(box,options){
  if(!box||box.dataset.wnPullBound) return;
  box.dataset.wnPullBound='1';
  const o=options||{active:()=>true,busy:()=>campusBusy,set:setCampusPull,run:()=>WN.pullRefreshCampus()};
  let pull=null;
  box.addEventListener('touchstart',e=>{
    if(!o.active()||o.busy()||box.scrollTop>0||e.touches.length!==1){ pull=null; return; }
    const t=e.touches[0]; pull={x:t.clientX,y:t.clientY,mode:'pending',offset:0};
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!pull||!o.active()||o.busy()||e.touches.length!==1){ pull=null; o.set(0,false); return; }
    const t=e.touches[0], dx=t.clientX-pull.x, dy=t.clientY-pull.y;
    if(pull.mode==='pending'){
      if(Math.hypot(dx,dy)<8) return;
      if(dy<=0||Math.abs(dx)>=Math.abs(dy)*.9){ pull=null; o.set(0,false); return; }
      pull.mode='pull';
    }
    if(pull.mode!=='pull'||box.scrollTop>0) return;
    e.preventDefault();
    pull.offset=Math.min(88,Math.max(0,dy)*.55); o.set(pull.offset,pull.offset>=62);
  },{passive:false});
  const finish=()=>{
    if(!pull) return;
    const ready=pull.mode==='pull'&&pull.offset>=62&&o.active()&&!o.busy(); pull=null; o.set(0,false);
    if(ready) o.run();
  };
  box.addEventListener('touchend',finish,{passive:true});
  box.addEventListener('touchcancel',()=>{pull=null;o.set(0,false);},{passive:true});
}

      if(seeds.length){ const used=new Set(seeds.map(s=>s.话题));
        st.seeds=(st.seeds||[]).filter(s=>!used.has(s.话题)); }   /* 成功才消费种子 */
      /* 刷完不自动标已读：玩家得看到新内容提醒 */
    });
    if(addedPosts||addedMedia){
      const bits=[];
      if(addedPosts) bits.push(addedPosts+' 帖');
      if(addedMedia) bits.push(addedMedia+' 条动态');
      const onTarget=viewingScreen('scr-campus')&&campusTab===targetTab;
      if(onTarget) markCampusRead();
      else await pushNote('campus','广场刷新完成',
        '新增 '+bits.join('、')+(firstTitle?'：'+firstTitle:''),
        {tab:targetTab});
      toast('刷新完成：新增 '+bits.join('、'));
    } else toast('本次没有拉到新内容');
  }catch(e){ toast('刷新失败：'+(e&&e.message||'API错误')); }
  finally{ campusBusy=false; paintCampus(); refreshBadges(); }
}

/* ---------- 世界书控制器 ---------- */
const WB_SYSTEM_CATEGORY='通用与系统';
const WB_SUB_ORDER=['角色','剧情','家庭','地点','规则','世界观','未分类'];
function wbCategories(){
  const counts=new Map();
  for(const entry of (S.wb&&Array.isArray(S.wb.entries)?S.wb.entries:[])){
    const category=wbCategoryOf(entry);
    counts.set(category,(counts.get(category)||0)+1);
  }
  return [
    ...phoneWorldbookWorkEntries().map(([work])=>phoneWorkLabel(work)||work),
    WB_SYSTEM_CATEGORY,
  ].filter(category=>counts.has(category));
}
const WB_PROTECTED=new Set((Array.isArray(PHONE_WORK_CATALOG.worldbookPolicies)?PHONE_WORK_CATALOG.worldbookPolicies:[])
  .filter(policy=>policy&&policy.protected===true)
  .map(policy=>String(policy.comment||'').trim()).filter(Boolean));
const WB_DEFAULT_OFF_SUFFIXES=(Array.isArray(PHONE_WORK_CATALOG.defaultOffSuffixes)?PHONE_WORK_CATALOG.defaultOffSuffixes:[])
  .map(value=>String(value||'').trim()).filter(Boolean);
const WB_DEFAULT_OFF_SUFFIX_RE=new RegExp('[（(](?:'+WB_DEFAULT_OFF_SUFFIXES.map(value=>value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')[^）)]*[）)]\\s*$','u');
function wbRoleTokens(){
  const out=[];
  for(const [,meta] of phoneWorkEntries()){
    const aliases=meta&&meta.characterAliases;
    if(!obj(aliases)) continue;
    Object.entries(aliases).forEach(([canonical,values])=>{
      [canonical,...(Array.isArray(values)?values:[values])].forEach(value=>{
        const token=String(value||'').trim(); if(token.length>=2) out.push(token);
      });
    });
  }
  return [...new Set(out)].sort((a,b)=>b.length-a.length);
}
function wbCategoryOf(entry){
  const name=String(entry&&entry.name||'');
  for(const [work,meta] of phoneWorkEntries()){
    if(meta&&meta.worldbookPrefix&&name.includes(String(meta.worldbookPrefix))) return phoneWorkLabel(work)||work;
  }
  return WB_SYSTEM_CATEGORY;
}
function wbBaseName(entry){
  let name=String(entry&&entry.name||'').trim().replace(/^\[mvu_(?:plot|update)\]/,'');
  for(const prefix of [...phoneWorkEntries().map(([,meta])=>String(meta&&meta.worldbookPrefix||'')),String(PHONE_WORK_CATALOG.sharedWorldbookPrefix||'[RULE]')]){
    if(prefix&&name.startsWith(prefix)){name=name.slice(prefix.length);break;}
  }
  return name.replace(WB_DEFAULT_OFF_SUFFIX_RE,'').trim();
}
function wbSubCategoryOf(entry){
  const base=wbBaseName(entry);
  if(/^\[(?:剧情细纲|剧情年表|细纲使用说明|前史|日常补篇|特典分支|剧场版补充|剧场版后日谈)\]/.test(base)) return '剧情';
  if(/^\[人设\]|语料|^角色速览|角色经历/.test(base)) return '角色';
  if(/^家庭/.test(base)) return '家庭';
  if(/^(?:地点|地图)/.test(base)) return '地点';
  if(/^规则/.test(base)) return '规则';
  if(/世界观|故事基调|叙事|关系介入|百合破坏/.test(base)) return '世界观';
  if(wbRoleTokens().some(token=>base.includes(token))) return '角色';
  return '未分类';
}
function wbIsWorkCategory(category){
  return phoneWorldbookWorkEntries().some(([work])=>(phoneWorkLabel(work)||work)===category);
}
function wbDefaultOff(entry){return WB_DEFAULT_OFF_SUFFIX_RE.test(String(entry&&entry.name||'').trim());}
function wbProtected(entry){
  const full=String(entry&&entry.name||'').trim();
  return WB_PROTECTED.has(wbBaseName(entry))||WB_PROTECTED.has(full);
}
function wbStrategyLabel(entry){
  return ({constant:'常驻',selective:'关键词',vectorized:'向量'})[entry&&entry.strategy]||'条目';
}
function normalizeWorldbookState(data){
  const entries=[];
  for(const raw of (data&&Array.isArray(data.entries)?data.entries:[])){
    if(!obj(raw)||!Number.isFinite(Number(raw.uid))) continue;
    entries.push({uid:Number(raw.uid),name:String(raw.name||'未命名条目').slice(0,300),enabled:raw.enabled===true,
      content:String(raw.content||''),strategy:String(raw.strategy||''),keys:Array.isArray(raw.keys)?raw.keys.map(String).slice(0,80):[],
      probability:clamp(num(raw.probability),0,100)});
  }
  return {name:String(data&&data.name||''),entries};
}
function wbMatches(entry,category){
  const wb=S.wb;
  if(category&&wbCategoryOf(entry)!==category) return false;
  if(wb.filter==='enabled'&&!entry.enabled) return false;
  if(wb.filter==='disabled'&&entry.enabled) return false;
  const q=String(wb.query||'').trim().toLocaleLowerCase();
  if(!q) return true;
  return [entry.name,(entry.keys||[]).join(' '),entry.content].join('\n').toLocaleLowerCase().includes(q);
}
function wbWorkState(category){
  const hit=phoneWorldbookWorkEntries().find(([work])=>(phoneWorkLabel(work)||work)===category);
  if(!hit) return null;
  const [work,meta]=hit, prefix=String(meta&&meta.worldbookPrefix||'');
  const entries=S.wb.entries.filter(entry=>prefix&&entry.name.includes(prefix));
  const base=entries.filter(entry=>!wbDefaultOff(entry)),on=base.filter(entry=>entry.enabled).length;
  const totalOn=entries.filter(entry=>entry.enabled).length,independent=entries.length-base.length;
  return {work:phoneWorkId(work),label:phoneWorkLabel(work)||work,base:base.length,on,total:entries.length,totalOn,
    independent,independentOn:totalOn-on,all:base.length>0&&on===base.length};
}
function wbWorkSummary(work){
  return work.independent?`基础 ${work.on}/${work.base} · 独立 ${work.independentOn}/${work.independent}`:`已开启 ${work.totalOn}/${work.total}`;
}
function wbWorkButton(work){
  const busy=S.wb.loading||!!S.wbWorkBusy||S.wbBusy.size>0;
  const status=work.all?'基础全部开启':work.on?'基础部分开启':'基础关闭';
  const action=work.all?`关闭${work.label}全部世界书`:`开启${work.label}基础世界书`;
  return `<button type="button" class="wb-work-toggle" ${keyAttrs('wb-work-toggle',work.work)}
    data-wn-enable="${work.all?'0':'1'}" data-wn-base-count="${work.base}" ${busy||!work.base?'disabled':''}
    role="switch" aria-checked="${work.all?'true':'false'}" aria-busy="${S.wbWorkBusy===work.work?'true':'false'}"
    aria-label="${esc(action+'；当前'+status)}"><span class="wb-switch ${work.all?'on':''}" aria-hidden="true"></span></button>`;
}
function wbCategoryRow(name){
  const work=wbWorkState(name),entries=S.wb.entries.filter(entry=>wbCategoryOf(entry)===name);
  const summary=work?wbWorkSummary(work):`已开启 ${entries.filter(entry=>entry.enabled).length}/${entries.length}`;
  return `<div class="wb-cat"><button class="go" ${keyAttrs('wb-category',name)}>
    <span><span class="nm">${esc(name)}</span><span class="sub num">${esc(summary)}</span></span>
    <span class="wb-chevron" aria-hidden="true">›</span></button>${work?wbWorkButton(work):''}</div>`;
}
function wbCurrentWorkHtml(category){
  const work=wbWorkState(category); if(!work) return '';
  return `<div class="wb-current-work"><span class="copy"><b>作品开关</b>
    <span class="sub num">${esc(wbWorkSummary(work))}</span></span>${wbWorkButton(work)}</div>`;
}
function wbToolsHtml(){
  const wb=S.wb;
  return `<div class="wb-tools"><input class="wb-search" type="search" value="${esc(wb.query)}" placeholder="搜索全部条目" aria-label="搜索全部世界书条目" oninput="WN.wbSearch(this.value)">
    <div class="wb-seg" aria-label="条目状态筛选">
      <button class="${wb.filter==='all'?'on':''}" onclick="WN.wbFilter('all')">全部</button>
      <button class="${wb.filter==='enabled'?'on':''}" onclick="WN.wbFilter('enabled')">已开启</button>
      <button class="${wb.filter==='disabled'?'on':''}" onclick="WN.wbFilter('disabled')">已关闭</button>
    </div></div>`;
}
function wbEntryRow(entry,showCategory){
  const category=wbCategoryOf(entry), locked=wbProtected(entry), busy=S.wb.loading||!!S.wbWorkBusy||S.wbBusy.has(entry.uid);
  return `<div class="wb-entry">
    <button class="go" ${keyAttrs('wb-entry',String(entry.uid))}><span class="nm">${esc(entry.name)}</span>
      <span class="sub">${showCategory?esc(category)+' · ':''}${esc(wbStrategyLabel(entry))}${entry.keys.length?' · '+entry.keys.length+' 个关键词':''}</span></button>
    ${locked?'<span class="wb-lock">受保护</span>':`<button class="wb-switch ${entry.enabled?'on':''}" ${busy?'disabled':''}
      ${keyAttrs('wb-toggle',String(entry.uid))} data-wn-enable="${entry.enabled?'0':'1'}" role="switch" aria-checked="${entry.enabled?'true':'false'}"
      aria-label="${entry.enabled?'关闭':'开启'}${esc(entry.name)}"></button>`}
  </div>`;
}
function activeWorldbookCategory(){
  const active=$id(S.stack[S.stack.length-1]);
  if(!active||active.dataset.wnView!=='wb-category') return null;
  const category=keyFromToken(active.dataset.wnCategory); return category===undefined?null:category;
}
function paintWorldbookResults(category,root){
  const active=root||$id(S.stack[S.stack.length-1]);
  const box=active&&active.querySelector('[data-wb-results]'); if(!box) return;
  const wb=S.wb;
  const paint=markup=>{
    const top=box.scrollTop,focused=document.activeElement;
    const action=focused&&box.contains(focused)&&focused.dataset.wnAction,key=action&&focused.dataset.wnKey;
    box.innerHTML=markup; box.scrollTop=top;
    if(action){
      const next=Array.from(box.querySelectorAll('[data-wn-action]')).find(el=>el.dataset.wnAction===action&&el.dataset.wnKey===key);
      if(next&&!next.disabled) next.focus({preventScroll:true});
    }
  };
  if(wb.loading&&!wb.loaded){ paint('<div class="empty">正在读取当前角色的主世界书…</div>'); return; }
  if(wb.error){ paint(`<div class="empty">${esc(wb.error)}<br><button class="refresh" onclick="WN.wbReload()">重新读取</button></div>`); return; }
  if(!wb.loaded){ paint('<div class="empty">尚未读取世界书</div>'); return; }
  const searchMode=!!String(wb.query||'').trim()||wb.filter!=='all';
  if(!category&&!searchMode){
    const categories=wbCategories();
    paint(categories.length?categories.map(wbCategoryRow).join(''):'<div class="empty">当前主世界书没有可浏览的分类</div>');
    return;
  }
  const scope=String(wb.query||'').trim()?null:category;
  const control=scope?wbCurrentWorkHtml(scope):'';
  const entries=wb.entries.filter(entry=>wbMatches(entry,scope));
  if(!entries.length){ paint(control+'<div class="empty">没有符合条件的条目</div>'); return; }
  if(scope&&wbIsWorkCategory(scope)){
    paint(control+wbGroupedWorldbookRows(entries));
  }else{
    paint(entries.map(entry=>wbEntryRow(entry,!scope)).join(''));
  }
}
function wbGroupedWorldbookRows(entries){
  const groups=new Map(WB_SUB_ORDER.map(name=>[name,[]]));
  for(const entry of entries){
    const sub=wbSubCategoryOf(entry);
    const list=groups.get(sub);
    if(list) list.push(entry);
    else groups.set(sub,[entry]);
  }
  let html='';
  for(const [sub,list] of groups){
    if(!list.length) continue;
    const enabled=list.filter(entry=>entry.enabled).length;
    html+=`<div class="wb-group"><div class="wb-group-h"><span>${esc(sub)}</span><span class="num">${enabled} / ${list.length}</span></div>${list.map(entry=>wbEntryRow(entry,false)).join('')}</div>`;
  }
  return html;
}
function buildWorldbookSurface(el,title,category){
  const oldBody=el.querySelector('[data-wb-results]'),top=oldBody?oldBody.scrollTop:0;
  const oldSearch=el.querySelector('.wb-search'),searchFocused=oldSearch&&document.activeElement===oldSearch;
  el.dataset.wnView=category?'wb-category':'wb-home';
  if(category) el.dataset.wnCategory=keyToken(category); else delete el.dataset.wnCategory;
  el.innerHTML=apphead(title,S.wb.name||'主世界书',`<button class="wb-reload" onclick="WN.wbReload()"
    aria-label="重新读取当前主世界书" title="重新读取当前主世界书的条目与开关状态"><span aria-hidden="true">↻</span><span class="wb-reload-label">重读</span></button>`)
    +wbToolsHtml()+'<div class="body" data-wb-results></div>';
  paintWorldbookResults(category||null,el);
  el.querySelector('[data-wb-results]').scrollTop=top;
  if(searchFocused) el.querySelector('.wb-search').focus({preventScroll:true});
}
function setWorldbookReloadBusy(busy){

    button.disabled=!!busy||!!S.wbWorkBusy||S.wbBusy.size>0; button.setAttribute('aria-busy',String(!!busy));

function syncWorldbookBusy(){

  document.querySelectorAll('[data-wn-action="wb-work-toggle"]').forEach(button=>{
    button.disabled=S.wb.loading||!!S.wbWorkBusy||S.wbBusy.size>0||!Number(button.dataset.wnBaseCount);

  });
  document.querySelectorAll('[data-wn-action="wb-toggle"]').forEach(button=>{
    button.disabled=S.wb.loading||!!S.wbWorkBusy||S.wbBusy.has(Number(keyFromToken(button.dataset.wnKey)));
  });
}
function refreshWorldbookSurfaces(opener){
  const screen=opener&&opener.closest('[data-wn-view]'),focused=document.activeElement;
  const restore=screen&&screen.id===S.stack[S.stack.length-1]
    &&(!focused||focused===opener||focused===document.body||focused===document.documentElement||!focused.isConnected);
  document.querySelectorAll('[data-wn-view="wb-home"],[data-wn-view="wb-category"]').forEach(el=>{
    const category=el.dataset.wnView==='wb-category'?keyFromToken(el.dataset.wnCategory):null;
    const subtitle=el.querySelector('.apphead .sub'); if(subtitle) subtitle.textContent=S.wb.name||'主世界书';
    const search=el.querySelector('.wb-search'); if(search&&search.value!==S.wb.query) search.value=S.wb.query;
    el.querySelectorAll('.wb-seg button').forEach((button,i)=>button.classList.toggle('on',
      (i===0&&S.wb.filter==='all')||(i===1&&S.wb.filter==='enabled')||(i===2&&S.wb.filter==='disabled')));
    paintWorldbookResults(category||null,el);
  });
  const active=$id(S.stack[S.stack.length-1]);
  if(active&&active.dataset.wnView==='wb-detail'){
    const top=active.querySelector('.body').scrollTop;
    WN.wbEntry(Number(active.dataset.wnUid)); active.querySelector('.body').scrollTop=top;
  }
  syncWorldbookBusy();
  if(!restore) return;
  const current=$id(screen.id),next=current&&Array.from(current.querySelectorAll('[data-wn-action]'))
    .find(el=>el.dataset.wnAction===opener.dataset.wnAction&&el.dataset.wnKey===opener.dataset.wnKey);
  if(next&&!next.disabled) next.focus({preventScroll:true});
}
async function renderWorldbook(navigate=true){
  const el=ensureScr('scr-worldbook'); buildWorldbookSurface(el,'世界书',null);
  if(navigate) WN.go('scr-worldbook');
  if(!S.wb.loaded&&!S.wb.loading) await WN.wbReload();

WN.wbReload=async function(){
  if(S.wb.loading||S.wbWorkBusy||S.wbBusy.size) return;
  if(!S.B||typeof S.B.getWorldbookState!=='function'){
    S.wb.error='当前手机外壳不支持世界书控制器'; S.wb.loaded=false; paintWorldbookResults(activeWorldbookCategory()); return;
  }
  const requestState=S.wb;
  S.wb.loading=true; S.wb.error=''; syncWorldbookBusy();
  if(!S.wb.loaded) paintWorldbookResults(activeWorldbookCategory());
  try{
    const data=normalizeWorldbookState(await S.B.getWorldbookState());
    if(S.wb!==requestState) return;
    S.wb.name=data.name; S.wb.entries=data.entries; S.wb.loaded=true;
  }catch(e){ if(S.wb===requestState){S.wb.error=String(e&&e.message||e||'世界书读取失败').slice(0,240); S.wb.loaded=false;} }
  finally{
    if(S.wb===requestState){ S.wb.loading=false; refreshWorldbookSurfaces(); }
  }
};
WN.wbSearch=function(value){ S.wb.query=String(value||'').slice(0,120); paintWorldbookResults(activeWorldbookCategory()); };
WN.wbFilter=function(value){
  S.wb.filter=['enabled','disabled'].includes(value)?value:'all';
  const active=$id(S.stack[S.stack.length-1]);
  if(active) active.querySelectorAll('.wb-seg button').forEach((button,i)=>button.classList.toggle('on',
    (i===0&&S.wb.filter==='all')||(i===1&&S.wb.filter==='enabled')||(i===2&&S.wb.filter==='disabled')));
  paintWorldbookResults(activeWorldbookCategory());
};
WN.wbCategory=function(category){
  if(!wbCategories().includes(category)) return;
  S.wb.category=category; S.wb.query='';
  const id='scr-wb-'+keyToken(category), el=ensureScr(id); buildWorldbookSurface(el,category,category); WN.go(id);
};
WN.wbEntry=function(uid){
  const entry=S.wb.entries.find(item=>item.uid===Number(uid)); if(!entry) return;

        <span>${entry.enabled?'已开启':'已关闭'}</span>${locked?'<span class="wb-lock">受保护，只读</span>':
          `<button class="wb-switch ${entry.enabled?'on':''}" ${busy?'disabled':''} ${keyAttrs('wb-toggle',String(entry.uid))}
            data-wn-enable="${entry.enabled?'0':'1'}" role="switch" aria-checked="${entry.enabled?'true':'false'}"
            aria-label="${entry.enabled?'关闭':'开启'}${esc(entry.name)}"></button>`}</div>
      ${entry.keys.length?`<div class="wb-meta">关键词：${esc(entry.keys.join('、'))}</div>`:''}
      <pre class="wb-content">${esc(entry.content||'（空条目）')}</pre></div></div>`;
  });
  WN.go(id);
};
WN.wbToggle=async function(uid,enable,opener){
  uid=Number(uid); const entry=S.wb.entries.find(item=>item.uid===uid);
  if(!entry||wbProtected(entry)||S.wb.loading||S.wbWorkBusy||S.wbBusy.has(uid)) return;
  const want=enable===true,requestState=S.wb;
  if(!want){
    const ok=await askConfirm('关闭世界书条目',`关闭「${entry.name}」后，所有使用主世界书「${S.wb.name}」的聊天都会受到影响。`,'关闭',opener);
    if(!ok) return;
  }
  if(S.wb!==requestState||S.wb.loading||S.wbWorkBusy||S.wbBusy.has(uid)) return;
  if(!S.B||typeof S.B.setWorldbookEntryEnabled!=='function'){ toast('当前手机外壳不支持世界书写入'); return; }
  S.wbBusy.add(uid); syncWorldbookBusy();
  try{
    const data=normalizeWorldbookState(await S.B.setWorldbookEntryEnabled(uid,want));
    if(S.wb!==requestState) return;
    S.wb.name=data.name; S.wb.entries=data.entries; S.wb.loaded=true; S.wb.error='';
    toast(want?'条目已开启':'条目已关闭');
  }catch(e){ if(S.wb===requestState) toast('世界书更新失败：'+String(e&&e.message||e||'写入错误')); }
  finally{
    if(S.wb===requestState){
      S.wbBusy.delete(uid);
      refreshWorldbookSurfaces(opener);
    }
  }
};
WN.wbWorkToggle=async function(work,enable,opener){
  if(S.wbWorkBusy||S.wb.loading||S.wbBusy.size) return; const hit=phoneWorkMeta(work),label=hit&&(phoneWorkLabel(hit.name)||hit.name); if(!hit||!label||!phoneWorkHasPublishedContent(hit.meta)){toast(`${label||'该作品'}尚未发布世界书内容`);return;}

  if(!want){const ok=await askConfirm('关闭作品世界书',`将关闭「${label}」的全部世界书条目，所有使用主世界书「${S.wb.name}」的聊天都会受到影响。`,'全部关闭',opener);if(!ok)return;}
  if(S.wb!==requestState||S.wbWorkBusy||S.wb.loading||S.wbBusy.size) return;
  if(!S.B||typeof S.B.setWorldbookWorkEnabled!=='function'){toast('当前手机外壳不支持作品世界书批量开关');return;}
  S.wbWorkBusy=work; syncWorldbookBusy();
  try{
    const data=normalizeWorldbookState(await S.B.setWorldbookWorkEnabled(work,want));
    if(S.wb!==requestState) return;
    S.wb.name=data.name;S.wb.entries=data.entries;S.wb.loaded=true;S.wb.error='';
    toast(want?`${label}世界书已恢复默认开启条目`:`${label}世界书已全部关闭`);
  }catch(e){if(S.wb===requestState)toast('作品世界书更新失败：'+String(e&&e.message||e||'写入错误'));}
  finally{if(S.wb===requestState){S.wbWorkBusy='';refreshWorldbookSurfaces(opener);}}
};

        <div class="guide-quick"><span><b>点开</b>选择 App</span><span><b>修改</b>先点铅笔</span><span><b>返回</b>用底部横条</span></div>
      </section>
      <div class="guide-tip"><b>推荐：</b>第一次使用先到设置确认正文对话语言，再到酒馆的角色正则里手动选择对应美化；“通讯摘要注入”和“自动记忆整理”建议保持开启。</div>
      <div class="guide-list">
        <details class="guide-sec" open><summary>打开、关闭与移动</summary><div class="guide-copy">
          <p>点未展开的小手机即可打开；酒馆魔杖菜单里也有“手机”。拖动它可以换位置，贴到屏幕边缘时最多能藏起一半。</p>
          <p>底部横条回主屏，右上角关闭手机。若窗口或小手机被拖远，到<b>设置 → 回到居中位置</b>复位。</p>
          <p>回信、动态评论、日程提醒和广场刷新完成后都会出现通知，打开对应内容后自动消失。</p>
        </div></details>
        <details class="guide-sec"><summary>LIME 聊天与动态</summary><div class="guide-copy">
          <p>动态页点“刷新”可选填想看谁、想看什么，留空也能生成；顶部下拉直接刷新。一次调用生成最多3条角色动态与少量评论，旧帖保留，不受自动来信开关影响。话题只影响选题，不会直接改变关系或剧情。</p>
          <p>连续发送的消息会先合并约 5 秒再交给对方；输入框保持选中时会多留最多 30 秒，离开输入框就恢复正常等待。对方可以回一条、多条，也可以暂时不回。</p>
          <p>图片可从设备或已解锁相册选择。点消息旁“···”可引用；右滑可删单条消息，聊天页垃圾桶会删除整个对话和这段对话的长期备忘。</p>
          <p>动态必须带文字，最多配 9 张图。角色会根据自己实际看到的内容决定是否评论；动态也可右滑删除。</p>
        </div></details>
        <details class="guide-sec"><summary>通讯录与变量修改</summary><div class="guide-copy">
          <p>通讯录显示当前追踪的角色。点联系人可看关系、四项数值、近况与重要经历；取得联系方式后可直接进入 LIME。</p>
          <p>联系人头像右下角的铅笔可上传本机头像。角色头像与玩家头像共用自由裁切器，会显示在通讯录、详情、LIME、动态和正文对话中；恢复默认后重新使用相册清单头像或姓名占位。它不会替换相册 CG。</p>
          <p>改错内容时，先点顶部铅笔，再点被标出的字段。<b>清空</b>只恢复该字段，<b>删除</b>只用于整张角色变量或整条约定，执行前都会确认。</p>
          <p>“来源作品”只记录角色出处，可填写注册表规范作品名、原创或其他作品名；它不会因作品开关而隐藏角色或禁用聊天、地图、相册与动态。修改角色名会一起迁移该角色的聊天、备忘和本机头像，但不能覆盖已有同名角色。删除角色变量不会顺带删掉已有聊天、相册资源或本机头像。</p>
        </div></details>
        <details class="guide-sec"><summary>地图与位置</summary><div class="guide-copy">
          <p>地图分为地区、地点和内部地图三层。缩小到底可看全图；带小箭头的地点可直接展开内部图，返回时保留上一级视图。</p>
          <p>点击地图顶部的放大镜搜索二级地点，可输入名称、别名或“地区＋地点”；选中结果会在地图中定位，取消搜索保留原来的视图。</p>
          <p>一级显示角色所在地区，二级显示所在场所；点头像或人数可看完整名单。三级名单放在图面下方的空白区，只说明哪些角色位于整个场所，不推断站在哪个房间。</p>
          <p>地图按角色的“地点”和“具体地点”显示；即使不在当前镜头，只要位置可靠仍会显示。浏览、缩放和点选地图不会移动角色或推进时间。</p>
        </div></details>
        <details class="guide-sec"><summary>相册与日程</summary><div class="guide-copy">
          <p><b>相册</b>会显示已经遇见角色的分册。锁定图片内会直接写解锁条件和当前进度；条件达成后永久解锁，角色情感倾向达到 200 时整册解锁。</p>
          <p>手机会自动检查相册清单；需要立刻确认新图片时，到<b>设置 → 相册资源</b>点“检查更新”。</p>
          <p><b>日程</b>按剧情日期显示约定和日本法定假日。点右上角<b>新增约定</b>可填写名称、内容、相关者、期限与状态；点某天查看当天事项。已有约定可在编辑模式下修改或删除。</p>
        </div></details>
        <details class="guide-sec"><summary>广场、手账与世界书</summary><div class="guide-copy">
          <p>广场分为论坛和媒体两个标签。下拉页面会直接刷新当前标签；右上角和页面底部的刷新按钮可以先填写这次想看的话题。</p>
          <p><b>手账</b>只显示当前已启用作品，并按注册表读取对应的篇章、偏移与后续推演；未选择或已关闭的作品默认隐藏，已启用但尚无作品线时显示“未建立”。“已注册”不等于“本版本可选”：注册表中标记为尚未发布的入口作品只保留变量兼容槽，不能从开场页选择，也不会自动注入专属论坛、媒体、地图、世界书或正式剧情内容；这不限制玩家在已有剧情中建立任意来源角色。<b>世界书</b>可查看并真实开关当前主世界书条目；作品开关重新开启时只恢复默认开启的基础条目，选开、勿开、二选一和建议关闭条目仍由各自控制。尚未发布世界书内容的入口作品不会显示空的分类或批量开关。关闭条目会影响所有共用这本世界书的聊天，受保护条目只能查看。</p>
        </div></details>
        <details class="guide-sec"><summary>设置怎么选</summary><div class="guide-copy">
          <p><b>我的头像</b>可从设备上传，上传后会同时显示在手机名片、动态和正文中的玩家对话旁；图片只保存在当前浏览器，点“恢复”即可改回名字占位。</p>
          <p><b>角色本机头像</b>保存在浏览器 IndexedDB，不进入角色变量或世界书。通常容量远高于压缩头像所需，但清除站点数据、无痕会话或浏览器回收存储仍可能移除；丢失时会自动回退默认头像。</p>
          <p><b>正文对话语言设置</b>默认中文；切到中日双语后，从下一次正文回复起，角色对话会同时生成日文与中文。旁白不受影响，固定开场白始终只保留中文。</p>
          <p><b>对话美化不会跟着手机自动切换。</b>请到酒馆的角色正则里，在“中文·深色 / 中文·浅色 / 中日双语·深色 / 中日双语·浅色”中手动启用一条，其余三条关闭。手机的深浅主题只影响手机界面。</p>
          <p><b>通讯摘要注入</b>建议开启，让正文记得手机里发生过的往来；<b>自动记忆整理</b>也建议开启，长时间聊天时更不容易忘记旧消息。</p>
          <p><b>正文预设参考</b>只让手机参考当前正文预设的通用表达，不会修改预设。<b>自动来信与动态</b>会增加角色主动活动，想要更热闹时再开；开启后约定到期当天，相关且关系够近的角色可能主动来信；关系数值升段时她也可能察觉并开口；天气或地点刚变化时偶尔有人发一条呼应的动态；深夜时段来信更频繁。所有后台活动合计每剧情轮最多静默调用一次模型，前台手动操作不占这个额度。</p>
          <p><b>手机界面更新</b>会在每次正常进入或刷新酒馆页面后静默检查一次，不会反复打扰。想立即确认时点旁边的<b>手动检查</b>；发现新版后会在安全时机应用。</p>
          <p>没有单独接口时，<b>手机专用 API</b>保持关闭即可；若开启，填好地址、密钥和模型后先测试连接，温度不确定时保持 0.80。</p>
          <p>不想显示悬浮小手机时，开启<b>仅用魔杖菜单打开</b>。清空手机数据会删除聊天、动态、论坛和媒体内容，操作前请确认不再需要；已经解锁的相册图片不会重新上锁。</p>
        </div></details>
      </div></div>`;
  });
  if(navigate) WN.go('scr-help');
}

/* ---------- 设置 ---------- */
function remotePhoneNote(){
  const r=S.remote||{};
  if(!r.url) return '自动更新地址不可用，当前使用卡内界面';
  const ver=r.version||'当前版本';
  if(r.status==='checking') return '后台检查中…';
  if(r.status==='update-ready' && r.candidateVersion && r.candidateVersion!==r.version) return `发现远程 ${esc(r.candidateVersion)}，将在安全时应用`;
  if(r.source==='remote' && r.status==='ready') return `当前使用远程 ${esc(ver)}`;
  if(r.source==='cache') return `当前使用已验证缓存 ${esc(ver)}`;
  if(r.source==='embedded' && r.status==='ready') return `卡内界面 ${esc(ver)} 已是最新`;
  if(r.status==='error') return `检查失败，仍使用${r.source==='embedded'?'卡内':'当前'}界面`;
  if(r.status==='fallback') return `远程不可用，使用卡内 ${esc(ver)}`;
  return '等待后台检查';
}
function remotePhoneDetails(){
  const r=S.remote||{};
  if(!r.error) return '';
  return `；${esc(String(r.error).slice(0,90))}`;
}
async function syncRemotePhoneState(){
  try{ if(S.B && typeof S.B.getPhoneRemoteState==='function') S.remote=await S.B.getPhoneRemoteState(); }
  catch(_){ }
}
function paintRemotePhoneControls(){
  const note=$id('phone-remote-note'), button=$id('phone-remote-btn');
  if(note) note.innerHTML=remotePhoneNote()+remotePhoneDetails();
  if(button){
    const checking=S.remote&&S.remote.status==='checking';
    button.disabled=checking||!S.B||typeof S.B.checkPhoneRemote!=='function';
    button.setAttribute('aria-busy',checking?'true':'false');
    button.textContent=checking?'检查中':'手动检查';
  }
}
function normalizeDialogueLanguageState(data){
  const mode=data&&['zh','bilingual'].includes(data.mode)?data.mode:'';
  const entries=Array.isArray(data&&data.entries)?data.entries.filter(obj).map(entry=>({
    mode:String(entry.mode||''),uid:Number(entry.uid),name:String(entry.name||''),enabled:entry.enabled===true,
  })):[];
  return {mode,valid:data&&data.valid===true&&!!mode,loaded:true,loading:false,busy:false,error:'',
    name:String(data&&data.name||''),entries};
}
function dialogueLanguageNote(){
  const dl=S.dialogueLang;
  if(!S.B||typeof S.B.getDialogueLanguage!=='function'||typeof S.B.setDialogueLanguage!=='function')
    return '当前手机外壳不支持切换';
  if(dl.loading) return '正在读取当前主世界书…';
  if(dl.error) return dl.error;
  if(!dl.loaded) return '读取当前主世界书后显示';
  if(!dl.valid) return '正文对话格式状态异常，选择一种即可修复';
  return dl.mode==='bilingual'?'当前：中日双语对话':'当前：中文对话';
}
function paintDialogueLanguageControls(){
  const dl=S.dialogueLang, note=$id('dialogue-lang-note');
  if(note) note.textContent=dialogueLanguageNote();
  document.querySelectorAll('[data-dialogue-lang]').forEach(button=>{
    const mode=button.dataset.dialogueLang;
    button.classList.toggle('on',dl.valid&&dl.mode===mode);
    button.disabled=dl.loading||dl.busy||!S.B||typeof S.B.setDialogueLanguage!=='function';
    button.setAttribute('aria-pressed',String(dl.valid&&dl.mode===mode));
  });
}
async function syncDialogueLanguageState(force=false){
  const dl=S.dialogueLang;
  if(dl.loading||(!force&&dl.loaded)) return;
  if(!S.B||typeof S.B.getDialogueLanguage!=='function'){
    dl.loaded=true; dl.error='当前手机外壳不支持切换'; paintDialogueLanguageControls(); return;
  }
  dl.loading=true; dl.error=''; paintDialogueLanguageControls();
  try{ S.dialogueLang=normalizeDialogueLanguageState(await S.B.getDialogueLanguage()); }
  catch(e){ dl.loaded=true; dl.loading=false; dl.valid=false; dl.error='读取失败：'+String(e&&e.message||e||'未知错误').slice(0,100); }
  paintDialogueLanguageControls();
}

function enabledSmsRole(name){

async function moveSms(messageId){
  try{
    const r = await S.B.scanSms(messageId); /* 正常生成只读本轮楼层；无参数时扫描恢复窗口 */
    const list = Array.isArray(r) ? r : (r && r.sms) || [];
    const seeds = (!Array.isArray(r) && r && Array.isArray(r.seeds)) ? r.seeds : [];
    const groups = (!Array.isArray(r) && r && Array.isArray(r.groups)) ? r.groups : [];
    const win = (!Array.isArray(r) && r && r.window && Array.isArray(r.window.hashes)) ? r.window : null;
    /* 幽灵检测：已搬运、来源楼层仍在扫描窗口内、却不在当前时间线清单里 → 被 swipe/删楼撤回 */
    const isGhost = m => m && m.hash && typeof m.srcMid==='number'
      && win && m.srcMid>=win.from && m.srcMid<=win.to && win.hashes.indexOf(m.hash)<0;
    let hasGhost=false;
    if(win && S.store) Object.values(get(S.store,'line.threads',{})).some(th=>
      (th.msgs||[]).some(m=>{ if(isGhost(m)){ hasGhost=true; } return hasGhost; }));
    if(!list.length && !seeds.length && !groups.length && !hasGhost) return;
    const currentTD=nowTD();
    const {d}=currentTD;
    let added=0, purged=0;
    const arrivals=[];
    await mutStore(st=>{
      if(hasGhost) Object.entries(st.line.threads).forEach(([id,th])=>{
        const before=(th.msgs||[]).length;
        const removed=[];
        th.msgs=(th.msgs||[]).filter(m=>{
          if(isGhost(m)){ delete st.smsSeen[m.hash]; purged++; removed.push(num(m.seq)); return false; }
          return true;
        });
        if(th.msgs.length!==before){
          th.lastRead=Math.min(th.lastRead||0, th.msgs.filter(m=>m.dir!=='out').length);
          if(removed.length) invalidateContactMemo(st,id,Math.min(...removed));
        }
      });
      groups.forEach(g=>{                       /* <wn_group> 剧情内建群 */
        if(!g || !g.name || (g.hash && st.smsSeen[g.hash])) return;
        const members=enabledSmsMembers(g.members);
        if(!members.length) return;
        if(g.hash) st.smsSeen[g.hash]=1;
        const id=groupThreadId(g.name);
        if(!threadOf(id,st)){
          const th={type:'group',name:g.name,members:members.slice(0,8),msgs:[],lastRead:0};
          th.msgs.push({seq:++st.seq, sys:1, text:'你被拉进了群聊「'+g.name+'」', t:g.t||currentTD.t, d:g.d||d});
          st.line.threads[id]=th; added++;
        }
      });
      list.forEach(m=>{
        const outgoing=m&&m.from==='user', dir=outgoing?'out':'in';
        const peer=enabledSmsRole(outgoing?m.to:m&&m.from); if(!peer) return;
        if(st.smsSeen[m.hash]) return;
        st.smsSeen[m.hash]=1;
        const th=threadOf(peer,st)||(st.line.threads[peer]={type:'dm',name:peer,members:[peer],msgs:[],lastRead:0});
        canonicalDmIdentity(th,peer);
        /* 防回声：同线程近20条仅比较同方向，不吞掉双方相同的回复。 */
        if((th.msgs||[]).slice(-20).some(x=>(x.dir==='out')===outgoing && !x.sys && x.text===m.text)) return;
        th.msgs.push({seq:++st.seq, dir, from:outgoing?'me':peer, text:m.text, t:m.t||currentTD.t, d:m.d||d,
          srcMid:(typeof m.srcMid==='number'?m.srcMid:undefined), hash:m.hash}); added++;
        /* 正文去信是已发送记录，不计未读、不提醒自己，也不排队生成角色回复。 */
        if(!outgoing) arrivals.push({from:peer, text:String(m.text||'')});
      });
      seeds.forEach(sd=>{
        if(sd && sd.hash && st.smsSeen[sd.hash]) return;
        if(sd && sd.hash) st.smsSeen[sd.hash]=1;
        st.seeds.push({话题:String(sd.话题||sd.topic||'').slice(0,40)});
      });
    });
    if(added||purged){ refreshBadges(); const cur=$id(S.stack[S.stack.length-1]);
      if(cur && cur.dataset.wnView==='thread'){
        const id=keyFromToken(cur.dataset.wnKey); if(id!==undefined) paintBubs(id);
      } }
    /* 剧情里发过来的新消息：不在该会话页面时提醒一次 */
    const byWho=new Map();
    arrivals.forEach(a=>{ const cur=byWho.get(a.from)||{n:0,last:''};
      byWho.set(a.from,{n:cur.n+1,last:a.text}); });
    for(const [who,info] of byWho){
      if(viewingThread(who)) continue;
      await pushNote('lime', who+' 发来'+(info.n>1?info.n+' 条消息':'消息'),
        info.last.slice(0,60), {key:who});
    }
  }catch(e){ console.warn('[WN] moveSms', e); }
}
/* ---------- 后台调度官：每剧情轮最多放行一个后台任务，即最多一次静默模型调用 ---------- */
let lastBgTurn=null;
function pickWeighted(list, n){
  const pool=list.slice(); const out=[];
  while(pool.length && out.length<n){
    const tot=pool.reduce((a,x)=>a+x.w,0);
    let r=Math.random()*tot, idx=0;
    for(let i=0;i<pool.length;i++){ r-=pool[i].w; if(r<=0){ idx=i; break; } }
    out.push(pool[idx].v); pool.splice(idx,1);
  }
  return out;
}

/* 约定晨信：约定到期当天，相关且够亲近的角色可能主动来信 */
const ML_AXIS_GATE=80; /* 情感倾向或信任程度达到「稳定好感/日常可信」段才可能主动来信 */
function morningLetterRows(){
  return scheduleRows().filter(row=>row.status==='进行中'&&row.state==='today');
}
function morningLetterKey(row,dateKey){ return 'ml:'+row.name+':'+dateKey; }
function morningLetterCandidates(row){
  const raw=String(row&&row.p&&row.p.相关者||'');
  let names=[];
  if(/全员|大家|所有人/.test(raw)){
    names=charList().filter(([,c])=>c&&c.联系方式===true).map(([n])=>n);
  }else{
    names=raw.split(/[×xX＊*、，,\/·\s]+/).map(s=>s.trim()).filter(Boolean);
  }
  const seen=new Set(), out=[];
  for(const name of names){
    const key=roleVariableKey(name)||String(name).trim();
    if(!key||seen.has(key)) continue; seen.add(key);
    const c=characterOf(key); if(!c||c.联系方式!==true) continue;
    const peak=Math.max(num(c.情感倾向),num(c.信任程度));
    if(peak<ML_AXIS_GATE) continue;
    out.push({name:key,present:c.在场===true,peak});
  }
  /* 不在场的优先（在场的人剧情里当面说），同等条件关系更深者优先 */
  out.sort((a,b)=>(a.present?1:0)-(b.present?1:0)||b.peak-a.peak);
  return out;
}
/* 机缘来信共用发送核心：晨信与升段来信只换机缘文案，同一条提示词骨架与注入路径 */
async function sendOccasionLetter(opts){

    +`只生成角色真正发送进聊天框的文字，不写旁白、动作、括号心理、界面提示或未发送的想法。`
    +`回复应体现角色的性格和表达习惯；以已经发生的剧情、此前聊天和角色当前处境为基础。`
    +`内心独白是角色尚未说出口的真实想法，只用于判断她是否愿意主动开口以及措辞分寸，不要直接照抄。`
    +`使用自然的手机聊天表达，短句、停顿、省略都可以，不要把句子补得过分完整。`;
  const userP=[ctxBlock({}),
    `【时间语义】当前世界时间：${now.d||'日期未明'} ${now.t||'时刻未明'}。`,
    opts.occasionBlock,
    '【候选人现状】\n'+names.map(n=>n+'：'+statDigestFor(n)).join('\n'),
    opts.directive+`输出 JSON：{"from":"候选人之一","text":"消息"} 或 {}。`+JSON_ONLY
  ].filter(Boolean).join('\n');
  const raw=await llm([{role:'system',content:sysP},{role:'user',content:userP}]);
  const j=pickJSON(raw);
  if(j===null||j===undefined) throw new Error('机缘来信返回无法解析');
  /* 模型选择沉默、人选越界或文本为空：都按「本轮无信」落账 */

/* 关系升段来信：四轴段位向上跨档时，角色本人可能察觉并主动提起；只贺升段，降段沉默 */
function bandTier(v){ v=num(v); return v>=190?5:v>=160?4:v>=120?3:v>=80?2:v>=40?1:0; }
function bandCrossings(){
  const seen=get(S.store,'bgSeen.bands',{})||{};
  const crossings=[];
  charList().forEach(([name,c])=>{
    if(!c||c.联系方式!==true) return;
    const prev=obj(seen[name])?seen[name]:null;
    if(!prev) return; /* 初见只建档不补发 */
    RELATION_AXES.forEach(axis=>{
      const to=bandTier(c[axis.field]), from=Math.floor(num(prev[axis.field]));
      if(to>from) crossings.push({name, field:axis.field, from, to, stage:axis.band(num(c[axis.field]))});
    });
  });
  return crossings;
}
async function bandLetterRun(ctx,crossings){
  const byChar=new Map();
  crossings.forEach(x=>{ const rec=byChar.get(x.name)||{name:x.name,axes:[]}; rec.axes.push(x); byChar.set(x.name,rec); });
  const groups=[...byChar.values()];
  groups.sort((a,b)=>Math.max(...b.axes.map(x=>x.to))-Math.max(...a.axes.map(x=>x.to)));
  const cands=groups.map(g=>({name:g.name,axes:g.axes}));
  const markDone=async()=>{ await mutStore(st=>{
    st.bgDone=obj(st.bgDone)?st.bgDone:Object.create(null);
    crossings.forEach(x=>{ st.bgDone['band:'+x.name+':'+x.field+':'+x.to]=String(ctx.turnId==null?ctx.dateKey:ctx.turnId); });
  }); };
  const me=meName();
  await sendOccasionLetter({ctx, cands,
    occasionBlock:`【关系升段】${me} 与以下角色的关系刚刚迈过新的阶段：\n`
      +cands.map(g=>`${g.name}：${g.axes.map(x=>`「${x.field}」进入「${x.stage}」`).join('、')}`).join('\n'),
    directive:`从候选人中选出最可能察觉并主动提起这一变化的一位，以她的口吻发一条简短消息（不超过 80 字；可以是试探、感慨或装作随口一提）。`
      +`关系数值与段位名是后台依据，不要直接念出来；只有她确实会主动开口时才发，否则输出 {}。`,
    markDone});
}

/* 深夜时段：来信概率上浮，提示词附深夜心境 */
function isLateNight(){
  const t=String(get(S.stat,'世界.时间','')||'');
  const m=/(\d{1,2})\s*[:：]\s*\d{2}/.exec(t);
  if(m){ const h=Number(m[1]); return h>=23||h<5; }
  return /深夜|凌晨|半夜|午夜/.test(t);
}

/* 天气/地点联动动态：环境刚变化时，有人可能发一条呼应的动态 */
function ambienceChanges(){
  const seen=get(S.store,'bgSeen',{})||{};
  const weather=String(get(S.stat,'世界.天气','')||'').trim(), place=String(get(S.stat,'世界.地点','')||'').trim();
  const out={weather:'',place:''};
  const w0=String(seen.weather||'').trim(), p0=String(seen.place||'').trim();
  if(w0&&weather&&weather!==w0) out.weather=weather;
  if(p0&&place&&place!==p0) out.place=place;
  return out;
}
async function runAmbience(ctx,amb){
  const done=ctx.done||{};
  const bits=[];
  if(amb.weather&&!done['amb-w:'+ctx.dateKey]) bits.push(`天气转为「${amb.weather}」`);
  if(amb.place&&!done['amb-p:'+ctx.dateKey]) bits.push(`地点换到「${amb.place}」`);
  const markDone=async()=>{ await mutStore(st=>{
    st.bgDone=obj(st.bgDone)?st.bgDone:Object.create(null);
    if(amb.weather) st.bgDone['amb-w:'+ctx.dateKey]=String(ctx.turnId==null?ctx.dateKey:ctx.turnId);
    if(amb.place) st.bgDone['amb-p:'+ctx.dateKey]=String(ctx.turnId==null?ctx.dateKey:ctx.turnId); }); };
  const picks=pickWeighted(autoMomentCandidates().map(([n,c])=>({v:n,w:autoSocialWeight(c)})),1);
  if(!bits.length||!picks.length){ await markDone(); return; }
  await autoCharMoment(picks[0],bits.join('，'));
  await markDone();
}
/* 快照跟进：被消化或不该发（开关关闭）的变化入库；输在仲裁里的变化留到下一轮 */
async function bgSeenSync(opts){
  const o=opts||{};
  await mutStore(st=>{
    st.bgSeen=obj(st.bgSeen)?st.bgSeen:{weather:'',place:'',bands:Object.create(null)};
    if(!o.keepWeather) st.bgSeen.weather=String(get(S.stat,'世界.天气','')||'').slice(0,80);
    if(!o.keepPlace) st.bgSeen.place=String(get(S.stat,'世界.地点','')||'').slice(0,120);
    const skip=new Set((o.skipBands||[]).map(x=>x.name+'.'+x.field));
    const bands=obj(st.bgSeen.bands)?st.bgSeen.bands:Object.create(null); st.bgSeen.bands=bands;
    charList().forEach(([name,c])=>{
      if(!c) return;
      const rec=obj(bands[name])?bands[name]:(bands[name]=Object.create(null));
      RELATION_AXES.forEach(axis=>{ if(!skip.has(name+'.'+axis.field)) rec[axis.field]=bandTier(c[axis.field]); });
    });
  });
}

async function bgTurn(turnId){
  if(S.demo||!S.store||!S.stat) return;
  if(turnId!=null&&turnId===lastBgTurn) return;
  lastBgTurn=turnId;
  const dateKey=scheduleDateKey(scheduleNowParts());
  const done=get(S.store,'bgDone',{})||{};
  const ctx={turnId,dateKey,done,mlRow:null};
  if(S.cfg.autoMsg&&dateKey){
    ctx.mlRow=morningLetterRows().find(row=>!done[morningLetterKey(row,dateKey)])||null;
  }
  const crossings=bandCrossings().filter(x=>!done['band:'+x.name+':'+x.field+':'+x.to]);
  const amb=ambienceChanges(), late=isLateNight();
  const jobs=[
    {id:'ml', ready:()=>!!ctx.mlRow, run:()=>morningLetterRun(ctx)},
    {id:'band', ready:()=>S.cfg.autoMsg&&crossings.length>0, run:()=>bandLetterRun(ctx,crossings)},
    {id:'memo', ready:()=>S.pendingMemoW!=null&&S.cfg.memoOn!==false&&!memoBusy,
      run:async()=>{ const w=S.pendingMemoW; S.pendingMemoW=null; await summarizeMemo(w,false,false); }},
    {id:'lime', ready:()=>S.cfg.autoMsg&&Math.random()<(late?0.45:0.3)&&autoLimeCandidates().length>0,
      run:()=>runAutoLime(late)},
    {id:'moment', ready:()=>S.cfg.autoMsg&&Math.random()<0.25&&autoMomentCandidates().length>0,
      run:runAutoMoment},
    {id:'amb', ready:()=>S.cfg.autoMsg&&autoMomentCandidates().length>0
        &&((amb.weather&&!done['amb-w:'+dateKey])||(amb.place&&!done['amb-p:'+dateKey])),
      run:()=>runAmbience(ctx,amb)},
  ];
  let ran=null;
  for(const job of jobs){
    let ready=false;
    try{ ready=await job.ready(); }catch(e){ console.warn('[WN] bgReady',job.id,e); }
    if(!ready) continue;
    ran=job.id;
    try{ await job.run(); }catch(e){ console.warn('[WN] bgRun',job.id,e); }
    break; /* 一轮只放行一个后台任务；失败不原地重试，等下一轮 */
  }
  try{
    await bgSeenSync({
      skipBands:(ran==='band'||!S.cfg.autoMsg)?[]:crossings,
      keepWeather:!!(S.cfg.autoMsg&&ran!=='amb'&&amb.weather&&!done['amb-w:'+dateKey]),
      keepPlace:!!(S.cfg.autoMsg&&ran!=='amb'&&amb.place&&!done['amb-p:'+dateKey]),
    });
  }catch(e){ console.warn('[WN] bgSeen',e); }
  /* 聊天剧场·环境档：本轮没有后台任务时，正在看的私聊里对方偶尔"打了字又删掉" */
  if(S.cfg.autoMsg&&!ran){
    const cur=$id(S.stack[S.stack.length-1]);
    if(cur&&cur.dataset.wnView==='thread'&&Math.random()<0.12){
      const tid=keyFromToken(cur.dataset.wnKey);
      const th=tid!==undefined?threadOf(tid):null;
      if(th&&th.type!=='group'&&characterOf(tid)&&characterOf(tid).联系方式===true) fakeTypingSignal(tid);
    }
  }
}

function momentTextKey(text){ return String(text||'').normalize('NFKC').replace(/[\s\p{P}\p{S}]+/gu,'').toLowerCase(); }
function normalizeMomentBatch(data,people,recent){
  if(!obj(data)||!Array.isArray(data.posts)||data.posts.length>3) throw new Error('动态返回格式不正确');
  const allowed=new Map(people.map(p=>[p.name,p])), seen=new Set(), out=[];
  const duplicates=new Set(recent.map(m=>JSON.stringify([m.who,momentTextKey(m.text)])));
  for(const row of data.posts){
    if(!obj(row)||typeof row.who!=='string'||!allowed.has(row.who)||typeof row.text!=='string'||!row.text.trim())
      throw new Error('动态包含无效角色或正文');
    if(row.comments!=null&&!Array.isArray(row.comments)) throw new Error('动态评论格式不正确');
    const text=row.text.trim().slice(0,120), key=JSON.stringify([row.who,momentTextKey(text)]);
    if(seen.has(row.who)||duplicates.has(key)) continue;
    const person=allowed.get(row.who), index=row.image;
    const picked=Number.isInteger(index)&&index>0?person.images[index-1]:null;
    const comments=(row.comments||[]).filter(c=>obj(c)&&allowed.has(c.from)&&c.from!==row.who&&typeof c.text==='string'&&c.text.trim()).slice(0,2)
      .map(c=>({from:c.from,text:c.text.trim().slice(0,60)}));
    out.push({who:row.who,text,images:picked?[{kind:'album',src:picked.src,title:picked.title}]:[],comments,rolePost:true,commentFailed:false});
    seen.add(row.who); duplicates.add(key);
  }
  return out;
}

let memoBusy=false;
async function trackTurn(turnId){
  let watermark=null;
  await mutStore(st=>{
    if(turnId==null||st.lastTurn===turnId) return;
    st.lastTurn=turnId; st.digestTurns=(st.digestTurns||0)+1;
    const prev=st.prevTurnSeq||0; st.prevTurnSeq=st.seq;
    let rawLen=0;
    Object.values(st.line.threads||{}).forEach(th=>(th.msgs||[]).forEach(m=>{
      if(!m.sys&&(m.seq||0)>(st.digestCut||0)) rawLen+=chatPromptText(m).length+20; }));
    (st.moments||[]).forEach(mo=>{ if((mo.id||0)>(st.digestCut||0))
      rawLen+=String(mo.text||'').length+(mo.comments||[]).reduce((a,c)=>a+String(c.text||'').length,0)+20; });
    if((st.digestTurns>=20||rawLen>10000)&&prev>(st.digestCut||0)) watermark=prev;
  });
  if(watermark!=null) S.pendingMemoW=watermark; /* 整理交后台调度官择轮执行，不再当场发起 */
}
function collectMemoItems(cut,w){
  const items=[];
  Object.entries(threadTable(S.store)).forEach(([id,th])=>{
    (th.msgs||[]).forEach(m=>{
      if(m.sys||(m.seq||0)<=cut||(m.seq||0)>w) return;
      const group=th.type==='group', who=m.dir==='out'?meName():(m.from||id);
      const to=group?('群「'+(th.name||id)+'」'):(m.dir==='out'?(th.name||id):meName());
      items.push({seq:m.seq,t:`[${m.d||''} ${m.t||''}] ${who}→${to}：${chatPromptText(m).slice(0,120)}`});
    });
  });
  (get(S.store,'moments',[])).forEach(mo=>{
    if((mo.id||0)<=cut||(mo.id||0)>w) return;
    items.push({seq:mo.id,t:`[${mo.d||''} ${mo.t||''}] ${mo.who||meName()} 发动态：${String(mo.text||'').slice(0,100)}${(mo.comments||[]).length?('（'+mo.comments.map(c=>c.from).join('、')+'有评论）'):''}`});
  });
  items.sort((a,b)=>a.seq-b.seq); return items;
}
function collectThreadMemoTargets(w,rebuild){
  const out=[];
  for(const [id,th] of Object.entries(threadTable(S.store))){
    const stored=obj(S.store.contactMemos)&&obj(S.store.contactMemos[id])?S.store.contactMemos[id]:null;
    const dirty=obj(S.store.memoDirty)&&S.store.memoDirty[id]===true;
    const from=(rebuild||dirty)?0:num(stored&&stored.through);
    const msgs=(th.msgs||[]).filter(m=>!m.sys&&num(m.seq)>from&&num(m.seq)<=w);
    if(!msgs.length&&!dirty) continue;
    const through=(th.msgs||[]).filter(m=>!m.sys&&num(m.seq)<=w).reduce((n,m)=>Math.max(n,num(m.seq)),0);
    if(!through) continue;
    out.push({id,name:String(th.name||id),type:th.type==='group'?'group':'dm',through,
      previous:(rebuild||dirty)?'':String(stored&&stored.text||'').trim(),
      lines:msgs.map(m=>`[${m.d||''} ${m.t||''}] ${m.dir==='out'?meName():(m.from||th.name||id)}：${chatPromptText(m).slice(0,140)}`)});
  }
  return out;
}
function parseMemoResult(raw,targets){
  const j=pickJSON(raw); if(!obj(j)||!Array.isArray(j.threads)) throw new Error('记忆整理返回格式不正确');
  const allowed=new Map(targets.map(x=>[x.id,x])), rows=[];
  for(const item of j.threads){
    const id=String(item&&item.id||''); if(!allowed.has(id)) continue;
    const text=String(item.summary||'').trim().slice(0,1500); if(!text) continue;
    rows.push({target:allowed.get(id),text}); allowed.delete(id);
  }
  if(rows.length!==targets.length) throw new Error('模型遗漏了一个或多个联系人备忘');
  const global=String(j.global||'').trim().slice(0,1200);
  if(!global) throw new Error('模型没有返回全局通讯摘要');
  return {rows,global};
}
async function summarizeMemo(w,manual,rebuild){
  if(memoBusy||(!manual&&!S.cfg.memoOn)||S.demo) return false;
  const cut=rebuild?0:num(get(S.store,'digestCut',0));
  const items=collectMemoItems(cut,w), targets=collectThreadMemoTargets(w,!!rebuild);
  if(!items.length&&!targets.length){
    if(!rebuild) await mutStore(st=>{ st.digestCut=w; st.digestTurns=0; });
    if(manual) toast('没有需要整理的新往来');
    return false;
  }
  memoBusy=true;
  try{
    const sysP=`你是手机通讯记忆整理器。把每个会话分别压缩为该会话自己的长期备忘，并另写一段供故事正文读取的全局通讯摘要。`
      + `每个联系人备忘只能使用该 id 对应区块中的既有备忘和消息，严禁把其他私聊或群聊的事实混入；`
      + `保留已经讲定的约定、关系变化、特殊称呼、未解决矛盾、重要偏好与有后续价值的具体事件，省略寒暄和重复话。`
      + `涉及跨日等待、迟回、错过时间、预约、截止时间、先后顺序或“昨天/今天/明天”语义时，必须保留消息记录中的绝对日期与时刻，不得只写成“最近”“后来”或“当天”。`
      + `只陈述记录中确实发生的事，不补写心理、动机或未来结果。每个联系人 summary 不超过 350 字，global 不超过 500 字。`;
    const blocks=targets.map(x=>[
      `【会话 id=${JSON.stringify(x.id)}；名称=${x.name}；类型=${x.type}；整理至 #${x.through}】`,
      x.previous?'既有备忘：'+x.previous:'既有备忘：（无或需从现存消息重建）',
      '本次消息：\n'+(x.lines.join('\n')||'（没有新增消息；请依据现存消息重建）')
    ].join('\n')).join('\n\n');
    const userP=[
      blocks||'【联系人会话】（无）',
      '【全局摘要素材】\n'+(items.map(x=>x.t).join('\n')||'（无新增公开素材）'),
      `输出 JSON：{"global":"全局通讯摘要","threads":[{"id":"必须逐字沿用输入 id","summary":"该会话专属备忘"}]}。`
        + `threads 只列输入中出现的会话；不能改写 id，不能合并不同会话。`+JSON_ONLY
    ].join('\n\n');
    const raw=await llm([{role:'system',content:sysP},{role:'user',content:userP}]);
    const result=parseMemoResult(raw,targets), td=nowTD();
    await mutStore(st=>{
      st.contactMemos=obj(st.contactMemos)?st.contactMemos:Object.create(null);
      st.memoDirty=obj(st.memoDirty)?st.memoDirty:Object.create(null);
      for(const row of result.rows){
        st.contactMemos[row.target.id]={text:row.text,through:row.target.through,d:td.d,t:td.t};
        delete st.memoDirty[row.target.id];
      }
      if(result.global){
        const segment={id:++st.seq,t:td.t,d:td.d,from:cut+1,to:w,turns:rebuild?0:(st.digestTurns||0),text:result.global};
        st.memoLog=rebuild?[segment]:(Array.isArray(st.memoLog)?st.memoLog.concat(segment):[segment]);
        st.digestMemo='';
      }
      st.digestCut=w; st.digestTurns=0;
    });
    toast(rebuild?'联系人备忘已按现存消息重建':'各联系人的新增往来已分别整理');
    if(!manual) await pushNote('memo','记忆整理完成','各会话已更新自己的长期备忘');
    return true;
  }catch(e){
    console.warn('[WN] memo',e);
    toast('记忆整理失败：'+(e&&e.message||'API错误')+'——原备忘与消息未受影响');
    return false;
  }finally{ memoBusy=false; }
}

async function refreshCurrentViewNow(){

  } : null;
  const input=view==='thread' ? current.querySelector('[data-wn-thread-input]') : null;
  const draft=input ? {

  } : null;

  if(currentId==='scr-home') renderHome();

  else if(view==='contact' && key!==undefined && characterOf(key)) WN.contact(key,false);

  else if(view==='thread' && key!==undefined && threadOf(key)) renderThread(key,false);
  else if(currentId==='scr-album') await renderAlbum(false);
  else if(view==='folder' && key!==undefined) await WN.folder(key,false);
  else if(currentId==='scr-journal') renderJournal(false);
  else if(currentId==='scr-schedule') renderSchedule(false);
  else if(currentId==='scr-campus') renderCampus(false);
  else if(currentId==='scr-help') renderGuide(false);
  else if(currentId==='scr-settings') renderSettings(false);
  else if((view==='contact' || view==='thread' || view==='folder') && S.stack.length>1){
    WN.back();
    await refreshCurrentViewNow();
    return;
  } else return;

  const targetId=S.stack[S.stack.length-1];
  requestAnimationFrame(()=>{
    if(S.stack[S.stack.length-1]!==targetId) return;
    const fresh=$id(targetId); if(!fresh) return;
    const nextScroll=fresh.querySelector(view==='thread'?'.bubs':'.body');
    if(scroll && nextScroll){
      nextScroll.scrollTop=scroll.atBottom
        ? nextScroll.scrollHeight
        : Math.min(scroll.top,Math.max(0,nextScroll.scrollHeight-nextScroll.clientHeight));
    }
    if(draft){
      const nextInput=fresh.querySelector('[data-wn-thread-input]');
      if(nextInput){
        nextInput.value=draft.value;
        if(draft.focused && !nextInput.disabled){
          nextInput.focus();
          try{ nextInput.setSelectionRange(draft.start,draft.end); }catch(_){}
        }
      }
    }
  });
}
