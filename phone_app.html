<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WN Phone</title>
<style>
  :root{
    color-scheme: dark;
    --font-ui:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif;
    --surface:#1a1a19; --screen:#131312; --card:#1f1f1e; --card2:#242423;
    --ink:#f4f2ec; --ink2:#cecbc0; --muted:#9b988f;
    --hair:#2a2a28; --ring:rgba(255,255,255,.10);
    --fav:#d55181; --int:#9085e9; --trust:#4a9f78; --attr:#d88952; --lime:#3fae5a;
    --axis-affect:#d65c84; --axis-trust:#5794ba; --axis-close:#d69a49; --axis-attract:#a9577c;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --bub-in:#262624; --bub-out:#33523d; --bub-out-ink:#e9f3ec;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.22);
    --press:rgba(255,255,255,.05);
  }
  :root[data-wn-theme="light"]{
    color-scheme: light;
    --surface:#fcfcfb; --screen:#f2f1ed; --card:#ffffff; --card2:#f7f6f3;
    --ink:#191917; --ink2:#4e4c48; --muted:#74716a;
    --hair:#e6e4dd; --ring:rgba(11,11,11,.10);
    --fav:#d8608e; --int:#6a5cc4; --trust:#31845f; --attr:#bd6c39; --lime:#2e9e4c;
    --axis-affect:#c95379; --axis-trust:#3f789f; --axis-close:#bf7832; --axis-attract:#914565;
    --good:#0ca30c; --warn:#c98a00; --crit:#d03b3b;
    --bub-in:#ffffff; --bub-out:#d9efe0; --bub-out-ink:#1c3a27;
    --shadow:0 1px 2px rgba(30,28,20,.05),0 5px 16px rgba(30,28,20,.06);
    --press:rgba(0,0,0,.045);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
  body{background:var(--screen);font:400 13.5px/1.62 var(--font-ui);
    color:var(--ink);overflow:hidden;display:flex;flex-direction:column;overflow-wrap:break-word;
    text-rendering:optimizeLegibility}
  .num{font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

  /* 系统条 */
  #sys{display:flex;align-items:center;gap:8px;padding:8px 16px 6px;font-size:11.5px;position:relative;
    color:var(--ink2);flex:none}
  #sys .clk{font-size:14.5px;font-weight:650;color:var(--ink);max-width:52%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #sys>svg{width:13px;height:13px;opacity:.55}
  #sys>svg:first-of-type{margin-left:auto}
  #sys-edit{position:absolute;right:58px;top:3px;width:28px;height:28px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--ink2);visibility:hidden}
  #sys-edit.available{visibility:visible}
  #sys-edit svg{width:14px;height:14px;opacity:.58;stroke-width:1.8}
  #sys-edit.on{color:var(--lime);background:var(--press)}
  #sys-edit.on svg{opacity:1}

  /* 屏栈 */
  #stack{flex:1;position:relative;overflow:hidden}
  .scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--screen);
    transform:translateX(100%);transition:transform .18s ease-out;overflow:hidden}
  .scr.on{transform:none}
  .scr.under{transform:translateX(-18%)}
  @media (prefers-reduced-motion: reduce){ .scr{transition:none} }
  #scr-home{transform:none}
  .apphead{display:flex;align-items:center;gap:8px;padding:10px 12px;flex:none;background:var(--surface);
    box-shadow:inset 0 -1px var(--hair)}
  .apphead .back{min-width:40px;min-height:36px;font-size:17px;color:var(--ink2)}
  .apphead .t{font-weight:700;font-size:16px;flex:0 1 auto;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .apphead .sub{font-size:11px;color:var(--muted);margin-left:2px;white-space:nowrap;flex:none}
  .apphead .act{margin-left:auto;min-height:36px;min-width:40px;font-size:13px;color:var(--ink2)}
  .thread-head .act+.act{margin-left:0}
  .thread-head .danger-act{color:var(--crit)}
  .body{flex:1;overflow-y:auto;overscroll-behavior:contain}

  /* home 条 */
  #homebar{flex:none;display:flex;justify-content:center;padding:4px 0 6px}
  #homebar button{width:150px;height:36px;display:flex;align-items:center;justify-content:center}
  #homebar i{display:block;width:80px;height:4px;border-radius:2px;background:var(--muted);opacity:.45}

  /* ── 主屏 ── */
  .widget{margin:12px 14px 4px;padding:18px 18px 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
  .widget .big{font-size:44px;font-weight:350;letter-spacing:0;line-height:1.08}
  .widget .big.small{font-size:27px;font-weight:450;line-height:1.35}
  .widget .sub{color:var(--ink2);font-size:13px;margin-top:6px;letter-spacing:0}
  .widget .sub2{color:var(--muted);font-size:12px;margin-top:2px;letter-spacing:0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 0;padding:10px 10px}
  .appic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;
    border-radius:16px;position:relative;min-height:74px}
  .appic:active{background:var(--press)}
  .appic .ic{width:50px;height:50px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center}
  .appic svg{width:23px;height:23px}
  .appic:nth-child(1) svg{stroke:var(--ink2)}
  .appic:nth-child(2) svg{stroke:var(--lime)}
  .appic:nth-child(3) svg{stroke:var(--fav)}
  .appic:nth-child(4) svg{stroke:var(--warn)}
  .appic:nth-child(5) svg{stroke:var(--int)}
  .appic:nth-child(6) svg{stroke:var(--ink2)}
  .appic:nth-child(7) svg{stroke:var(--trust)}
  .appic:nth-child(8) svg{stroke:var(--warn)}
  .appic:nth-child(9) svg{stroke:var(--muted)}
  .appic .nm{font-size:11.5px;color:var(--ink2);font-weight:500}
  .bdg{position:absolute;top:4px;right:17%;min-width:16px;height:16px;border-radius:8px;
    background:var(--crit);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}

  /* ── 列表通用 ── */
  .li{display:flex;align-items:center;gap:11px;padding:11px 16px;position:relative;
    min-height:60px;width:100%;text-align:left}
  .li:active{background:var(--press)}
  .li::after{content:'';position:absolute;left:71px;right:0;bottom:0;height:1px;background:var(--hair)}
  .li:last-child::after{display:none}
  .ava{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none;overflow:hidden}
  .ava img{width:100%;height:100%;object-fit:cover;display:block}
  .ava-xl{width:72px;height:72px;font-size:26px}
  .avatar-setting-preview{width:44px;height:44px;border-radius:50%;flex:none;display:block}
  .avatar-setting-preview .ava{box-shadow:var(--shadow);outline:1px solid var(--hair)}
  .li .mid{flex:1;min-width:0}
  .li .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:2px}
  .li .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .li .meta{text-align:right;font-size:11px;color:var(--muted);flex:none}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
  .chip{font-size:10.5px;padding:2.5px 10px;border-radius:999px;color:var(--ink2);background:var(--press);
    white-space:nowrap;display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  .chip.acc{color:var(--fav);background:color-mix(in srgb,var(--fav) 10%,transparent)}
  .ub{display:inline-block;min-width:16px;height:16px;border-radius:8px;background:var(--lime);
    color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
  .sect{padding:12px 16px 4px;font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--muted)}

  /* ── 说明书 ── */
  .guide-hero{margin:12px 12px 9px;padding:17px 16px 15px;border-radius:18px;
    background:linear-gradient(145deg,color-mix(in srgb,var(--fav) 16%,var(--card)) 0,var(--card) 52%,color-mix(in srgb,var(--int) 11%,var(--card)) 100%);
    box-shadow:var(--shadow),inset 0 0 0 1px var(--ring)}
  .guide-hero .eyebrow{display:block;color:var(--fav);font-size:9.5px;font-weight:750;letter-spacing:.12em}
  .guide-hero h2{margin:4px 0 4px;font-size:18px;line-height:1.35;letter-spacing:0}
  .guide-hero p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.65}
  .guide-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}
  .guide-quick span{min-width:0;padding:8px 6px;border-radius:11px;background:color-mix(in srgb,var(--screen) 62%,transparent);
    color:var(--ink2);font-size:10.5px;line-height:1.35;text-align:center;box-shadow:inset 0 0 0 1px var(--ring)}
  .guide-quick b{display:block;margin-bottom:2px;color:var(--ink);font-size:13px}
  .guide-tip{margin:0 12px 10px;padding:10px 12px 10px 15px;border-radius:13px;position:relative;
    background:color-mix(in srgb,var(--lime) 8%,var(--card));color:var(--ink2);font-size:11.5px;line-height:1.6}
  .guide-tip::before{content:'';position:absolute;left:6px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--lime)}
  .guide-tip b{color:var(--ink);font-weight:700}
  .guide-list{display:grid;gap:8px;padding:0 12px 18px}
  .guide-sec{border-radius:14px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
  .guide-sec>summary{display:flex;align-items:center;min-height:50px;padding:0 13px;cursor:pointer;list-style:none;
    color:var(--ink);font-size:13.5px;font-weight:700}
  .guide-sec>summary::-webkit-details-marker{display:none}
  .guide-sec>summary::after{content:'›';margin-left:auto;color:var(--muted);font-size:19px;font-weight:400;
    transform:rotate(0);transition:transform .16s ease}
  .guide-sec[open]>summary::after{transform:rotate(90deg)}
  .guide-copy{padding:0 13px 14px;color:var(--ink2);font-size:12.5px;line-height:1.7;
    border-top:1px solid color-mix(in srgb,var(--hair) 72%,transparent)}
  .guide-copy::before{content:'';display:block;height:10px}
  .guide-copy p{margin:0 0 8px}
  .guide-copy p:last-child{margin-bottom:0}
  .guide-copy b{color:var(--ink);font-weight:650}

  /* ── 通讯录详情 ── */
  .hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 14px 12px}
  .role-avatar-button{width:72px;height:72px;border-radius:50%;position:relative;display:block;flex:none}
  .role-avatar-button>.ava{pointer-events:none}
  .role-avatar-edit-dot{position:absolute;right:-2px;bottom:-2px;width:25px;height:25px;border-radius:50%;
    display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 88%,var(--fav));color:var(--ink2);
    box-shadow:0 3px 10px rgba(0,0,0,.26),inset 0 0 0 1px var(--ring);font-size:12px;font-weight:750}
  .role-avatar-button[data-custom-avatar="true"] .role-avatar-edit-dot{background:var(--fav);color:#fff}
  .role-avatar-button:focus-visible{outline:2px solid var(--fav);outline-offset:4px}
  .hero .hnm{font-size:18px;font-weight:700;display:flex;align-items:center;gap:7px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .card1{border-radius:16px;margin:6px 14px 10px;background:var(--card);box-shadow:var(--shadow);padding:13px 14px}
  .ct{font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--muted);margin-bottom:8px}
  .relation-card{padding:4px 6px;overflow:hidden}
  .meter{--axis:var(--fav);position:relative;display:grid;grid-template-columns:58px minmax(72px,1fr) 108px;
    gap:8px;align-items:center;margin:0;padding:10px 8px 10px 12px;overflow:hidden;
    border-bottom:1px solid var(--hair);background:linear-gradient(90deg,color-mix(in srgb,var(--axis) 7%,transparent),transparent 72%)}
  .meter:last-child{border-bottom:0}
  .meter::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--axis)}
  .axis-affect{--axis:var(--axis-affect)} .axis-trust{--axis:var(--axis-trust)}
  .axis-close{--axis:var(--axis-close)} .axis-attract{--axis:var(--axis-attract)}
  .meter .lab{font-size:11.5px;font-weight:650;color:var(--ink);white-space:nowrap}
  .track{position:relative;height:8px;border-radius:4px;overflow:hidden;
    background:color-mix(in srgb,var(--axis) 12%,var(--press));box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
  .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;max-width:100%;
    background:linear-gradient(90deg,color-mix(in srgb,var(--axis) 76%,white),var(--axis));
    box-shadow:inset 0 1px rgba(255,255,255,.22);transition:width .28s ease}
  .meter .val{display:grid;grid-template-columns:3ch minmax(0,1fr);column-gap:7px;align-items:baseline;
    min-width:0;white-space:nowrap;overflow:hidden}
  .meter .val b{color:var(--axis);font-size:13.5px;font-weight:750;text-align:right}
  .meter .stage{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11.5px;text-align:left}
  @media (max-width:339px){
    .meter{grid-template-columns:1fr 108px;grid-template-areas:"lab val" "track track";row-gap:7px}
    .meter .lab{grid-area:lab}.meter .track{grid-area:track}.meter .val{grid-area:val}
  }
  @media (prefers-reduced-motion:reduce){.fill{transition:none}}
  .kv{font-size:13px;color:var(--ink2)} .kv em{font-style:normal;color:var(--muted);margin-right:4px;font-size:11.5px}
  .rows{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:6px}
  .kvrows{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px;color:var(--ink2)}
  .kvrows em{font-style:normal;color:var(--muted);margin-right:5px;font-size:11.5px}
  .kvlist{display:grid;gap:5px}
  .kvlist>div{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:baseline}
  .kvlist em{font-style:normal;color:var(--muted);font-size:11.5px}
  .kvlist span{font-size:13px;color:var(--ink2)}
  .mono{margin:10px 0 0;padding:8px 12px;border-left:2px solid var(--fav);font-style:italic;
    color:var(--ink2);font-size:13px;background:color-mix(in srgb,var(--fav) 5%,transparent);
    border-radius:0 10px 10px 0}
  .mono::before{content:"独白";font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0;display:block;margin-bottom:2px}
  .bond{margin-top:7px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
  .tl{margin-top:2px;padding-left:14px;position:relative}
  .tl::before{content:'';position:absolute;left:3px;top:8px;bottom:8px;width:1.5px;background:var(--hair)}
  .tl div{position:relative;font-size:12.5px;line-height:1.6;color:var(--ink2);padding:4px 0}
  .tl div::before{content:'';position:absolute;left:-13.5px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--muted)}
  .tl b{color:var(--ink);font-weight:650;font-size:11.5px;margin-right:7px}
  .cbtn{display:flex;gap:8px;margin:2px 14px 14px}
  .cbtn button{flex:1;min-height:44px;border-radius:13px;font-size:12.5px;color:var(--ink2);
    background:var(--card);box-shadow:var(--shadow)}
  .cbtn button.pri{background:var(--lime);color:#fff}
  .cbtn button[disabled]{opacity:.5;cursor:default}

  /* ── LIME 线程 ── */
  .bubs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 12px;
    display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
  .bubs>*{flex-shrink:0}
  .brow{display:flex;gap:8px;max-width:82%}
  .brow.in{align-self:flex-start}
  .brow.out{align-self:flex-end;flex-direction:row-reverse}
  .brow.cont{margin-top:-6px}
  .bava{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
    align-self:flex-start;overflow:hidden}
  .bava img{width:100%;height:100%;object-fit:cover;display:block}
  .brow.cont .bava{visibility:hidden}
  .bcol{display:flex;flex-direction:column;gap:2px;min-width:0}
  .out .bcol{align-items:flex-end}
  .bfrom{font-size:11px;color:var(--muted);margin:0 4px}
  .bub{padding:8px 13px;border-radius:17px;font-size:13.5px;line-height:1.58;word-break:break-word;white-space:pre-wrap;
    box-shadow:var(--shadow)}
  .in .bub{background:var(--bub-in);border-bottom-left-radius:5px}
  .in.cont .bub{border-top-left-radius:8px}
  .out .bub{background:var(--bub-out);color:var(--bub-out-ink);border-bottom-right-radius:5px}
  .out.cont .bub{border-top-right-radius:8px}
  .bt{display:block;min-height:15px;font-size:10.5px;line-height:15px;color:var(--muted);padding:0 4px}
  .sysnote{align-self:center;font-size:11px;color:var(--muted);background:var(--press);
    border-radius:999px;padding:3px 12px;letter-spacing:0;text-align:center;max-width:88%}
  .typing{align-self:flex-start;margin-left:48px;background:var(--bub-in);border-radius:17px;
    border-bottom-left-radius:5px;box-shadow:var(--shadow);padding:11px 14px;display:flex;gap:4px}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:wn-tp 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes wn-tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-2px)}}
  @media (prefers-reduced-motion: reduce){ .typing i{animation:none} }
  .compose{display:flex;gap:8px;padding:10px 12px;flex:none;background:var(--surface);align-items:center}
  .compose-quote{display:none;align-items:center;gap:8px;padding:7px 12px 0;background:var(--surface);color:var(--ink2)}
  .compose-quote.on{display:flex}
  .compose-quote .quote-mini{flex:1;min-width:0;border-left:2px solid var(--fav);padding:5px 9px;background:var(--card2);
    border-radius:4px 9px 9px 4px;font-size:11.5px;line-height:1.45;overflow:hidden}
  .compose-quote .quote-mini b{display:block;color:var(--ink);font-size:11px;margin-bottom:2px}
  .compose-quote button{width:28px;height:28px;color:var(--muted);font-size:16px}
  .compose input{flex:1;min-height:40px;border:0;border-radius:999px;background:var(--card2);
    color:var(--ink);padding:0 16px;font:13.5px var(--font-ui);min-width:0;outline:none;
    box-shadow:inset 0 0 0 1px var(--hair)}
  .compose .snd{width:40px;height:40px;border-radius:50%;background:var(--lime);flex:none;
    display:flex;align-items:center;justify-content:center}
  .compose .snd svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
  .compose button[disabled]{opacity:.5}
  .failed{color:var(--crit);font-size:11px;cursor:pointer}
  .chat-swipe.swipe-row{align-self:flex-start;margin:0;max-width:82%;min-width:116px;
    border-radius:17px;box-shadow:none;background:var(--screen);isolation:isolate}
  .chat-swipe.out{align-self:flex-end}
  .chat-swipe.cont{margin-top:-6px}
  .chat-swipe.cont .bava{visibility:hidden}
  .chat-swipe .brow{position:relative;z-index:1;max-width:none;width:100%;padding:0;
    border-radius:inherit;background:var(--screen);transform:translateX(0);transition:transform .18s ease-out;will-change:transform}
  .chat-swipe.dragging .brow{transition:none}
  .chat-swipe.open .brow{transform:translateX(76px)}
  .chat-swipe .swipe-delete{inset:1px auto 1px 0;border-radius:15px 0 0 15px;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .08s linear}
  .chat-swipe.dragging .swipe-delete,.chat-swipe.open .swipe-delete{
    opacity:1;visibility:visible;pointer-events:auto}
  .thread-head .ava{width:48px;height:48px;font-size:17px}
  .chat-swipe.has-photo{width:min(252px,82%);max-width:82%;margin-top:0}
  .chat-swipe.has-photo.in{width:min(294px,92%);max-width:92%}
  .chat-swipe.has-photo .brow{width:100%}
  .chat-swipe.has-photo .bcol{flex:1;max-width:100%}

  #gsheet textarea{width:100%;min-height:64px;margin-top:8px;border:0;

    resize:none;outline:none;box-shadow:inset 0 0 0 1px var(--hair)}

  #gsheet .row{display:flex;gap:8px;margin-top:10px}

  .mecard .mrow b{font-size:16px}
  .mecard .msub{font-size:12px;color:var(--muted);margin-top:2px}

  .mini2 b{display:block;height:3px;border-radius:2px;background:var(--press);overflow:hidden}
  .mini2 i{display:block;height:100%;border-radius:2px}

  .fold{margin:0 0 10px}

  .fold[open] summary::before{transform:rotate(90deg)}
  .fold summary .c{font-size:11px}
  /* ── 日程 ── */
  .sched-calendar{margin:10px 10px 8px;padding:11px 9px 10px;border-radius:18px;
    background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,var(--int) 8%) 0,var(--card) 52%);
    box-shadow:var(--shadow),inset 0 0 0 1px var(--ring);overflow:hidden}
  .sched-cal-head{display:flex;align-items:center;gap:7px;padding:0 1px 9px}
  .sched-cal-head .nav{width:36px;height:36px;flex:none;border-radius:50%;font-size:19px;color:var(--ink2);
    background:color-mix(in srgb,var(--card2) 82%,transparent);box-shadow:inset 0 0 0 1px var(--ring)}
  .sched-cal-head .nav:active,.sched-cal-foot button:active{background:var(--press)}
  .sched-cal-head .mid{flex:1;min-width:0;text-align:center;display:grid;gap:2px}
  .sched-cal-head .month{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:0}
  .sched-cal-head .context{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sched-weekdays,.sched-days,.sched-events{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .sched-weekdays{padding:0 2px 6px;text-align:center;font-size:10px;letter-spacing:0;color:var(--muted)}
  .sched-weekdays span:first-child{color:color-mix(in srgb,var(--crit) 78%,var(--ink))}
  .sched-weekdays span:last-child{color:color-mix(in srgb,var(--trust) 76%,var(--ink))}
  .sched-grid{overflow:hidden;border-radius:13px;background:var(--card2);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hair) 85%,transparent)}
  .sched-week{position:relative;height:80px;border-bottom:1px solid color-mix(in srgb,var(--hair) 72%,transparent)}
  .sched-week:last-child{border-bottom:0}
  .sched-days{height:100%}
  .sched-day{height:100%;min-width:0;padding:2px 4px 0;text-align:left;color:var(--ink2);
    display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
    background:color-mix(in srgb,var(--card) 62%,transparent);
    border-right:1px solid color-mix(in srgb,var(--hair) 55%,transparent)}
  .sched-day:last-child{border-right:0}
  .sched-day:active{background:var(--press)}
  .sched-day.outside{opacity:.28}
  .sched-day.sunday{background:color-mix(in srgb,var(--crit) 5%,color-mix(in srgb,var(--card) 62%,transparent))}
  .sched-day.saturday{background:color-mix(in srgb,var(--trust) 5%,color-mix(in srgb,var(--card) 62%,transparent))}
  .sched-day.selected{background:color-mix(in srgb,var(--int) 13%,var(--card))}
  .sched-day .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;
    border-radius:7px;font-size:11.5px;font-weight:700;line-height:20px;font-variant-numeric:tabular-nums}
  .sched-day.sunday .n,.sched-day.holiday .n{color:color-mix(in srgb,var(--crit) 82%,var(--ink))}
  .sched-day.saturday .n{color:color-mix(in srgb,var(--trust) 80%,var(--ink))}
  .sched-day.current .n{background:linear-gradient(180deg,color-mix(in srgb,var(--int) 96%,#fff) 0,var(--int) 100%);
    color:#fff;box-shadow:0 1px 5px rgba(0,0,0,.32)}
  .sched-day .hd{display:block;margin:0 1px;font-size:8px;line-height:9px;font-weight:600;letter-spacing:0;
    color:color-mix(in srgb,var(--crit) 62%,var(--ink2));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sched-events{position:absolute;left:0;right:0;top:33px;grid-auto-rows:15px;gap:3px 0;pointer-events:none}
  .sched-event{z-index:2;height:15px;margin:0 2px;padding:0 5px;border-radius:5px;display:flex;align-items:center;justify-content:flex-start;text-align:left;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:15px;font-weight:600;
    letter-spacing:0;--tone:var(--int);color:color-mix(in srgb,var(--tone) 55%,var(--ink));
    background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 30%,var(--card2)) 0,color-mix(in srgb,var(--tone) 18%,var(--card2)) 100%);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tone) 30%,transparent)}
  .sched-event.t0{--tone:var(--int)} .sched-event.t1{--tone:var(--fav)} .sched-event.t2{--tone:var(--trust)}
  .sched-event.t3{--tone:var(--attr)} .sched-event.t4{--tone:var(--lime)}
  .sched-event.multi{justify-content:center;text-align:center}
  .sched-event.soon{--tone:var(--warn)}
  .sched-event.today,.sched-event.overdue{--tone:var(--crit)}
  .sched-event.done{--tone:var(--muted);color:var(--muted);box-shadow:none;
    background:color-mix(in srgb,var(--muted) 14%,var(--card2))}
  .sched-event.cont-left{margin-left:0;border-radius:0 5px 5px 0}
  .sched-event.cont-right{margin-right:0;border-radius:5px 0 0 5px}
  .sched-event.cont-left.cont-right{border-radius:0}
  .sched-week-more{position:absolute;right:4px;bottom:3px;font-size:8.5px;color:var(--muted)}
  .sched-cal-foot{display:flex;align-items:center;gap:8px;padding:10px 2px 0;color:var(--muted);font-size:9.5px}
  .sched-cal-foot button{min-height:30px;padding:0 10px;border-radius:9px;font-size:10px;
    color:color-mix(in srgb,var(--int) 78%,var(--ink2));background:color-mix(in srgb,var(--int) 10%,transparent);
    box-shadow:inset 0 0 0 1px var(--ring)}
  .sched-cal-foot span{margin-left:auto;text-align:right}
  .sched-add{min-height:34px;padding:0 11px;border-radius:10px;background:color-mix(in srgb,var(--fav) 12%,var(--card));
    color:var(--fav);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fav) 24%,var(--hair));font-size:11.5px;font-weight:700;white-space:nowrap}
  .sched-invalid{margin:12px 14px 8px;padding:13px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
  .sched-invalid b{display:block;margin-bottom:3px}
  .sched-invalid span{font-size:11px;color:var(--muted)}
  .sched-detail-head{margin:11px 14px 3px;display:flex;align-items:center;gap:8px}
  .sched-detail-head .date{font-weight:700;color:var(--ink)}
  .sched-detail-head .note{font-size:10px;color:var(--muted)}
  .sched-detail-head .count{margin-left:auto;padding:2px 7px;border-radius:999px;background:var(--card2);font-size:10px;color:var(--muted)}
  .sched-holiday{margin:4px 14px 0;padding:7px 11px;border-radius:11px;font-size:11.5px;
    color:color-mix(in srgb,var(--crit) 66%,var(--ink));background:color-mix(in srgb,var(--crit) 9%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--crit) 22%,transparent)}
  .sched-section{padding:10px 16px 3px;color:var(--muted);font-size:11.5px;font-weight:650}
  .sched-item{margin:7px 14px;padding:12px 14px 12px 18px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);position:relative}
  .sched-item::before{content:'';position:absolute;left:8px;top:13px;bottom:13px;width:3px;border-radius:2px;background:var(--muted)}
  .sched-item.ongoing::before{background:var(--int)} .sched-item.today::before{background:var(--crit)} .sched-item.soon::before{background:var(--warn)}
  .sched-item.done::before{background:var(--good)} .sched-item.overdue::before{background:var(--crit)}
  .sched-item .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .sched-item .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
  .sched-item .dl{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .sched-item.today .dl,.sched-item.overdue .dl{color:var(--crit);font-weight:650}
  .sched-item .bd,.sched-item .who{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.58}
  .sched-item .who{color:var(--muted);font-size:11.5px}
  .sched-item .who em{font-style:normal;color:var(--muted);font-size:11px;margin-right:5px}
  .sched-item .actions{display:none;justify-content:flex-end;margin-top:9px}
  body.wn-edit-mode .sched-item .actions{display:flex}
  @media(max-width:340px){
    .sched-calendar{margin-left:8px;margin-right:8px;padding-left:6px;padding-right:6px}
    .sched-week{height:78px}
    .sched-day{padding-left:3px;padding-right:3px}
    .sched-event{font-size:8.5px;padding-left:3px;padding-right:3px}
  }
  /* ── 图片选择与引用操作 ── */
  #ipsheet,#qsheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:68}
  #ipsheet.on,#qsheet.on{display:flex}
  #ipsheet .pane,#qsheet .pane{width:100%;max-height:min(78%,560px);overflow-y:auto;background:var(--surface);
    border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3);padding:16px 14px 14px}
  #ipsheet .head,#qsheet .head{display:flex;align-items:center;gap:8px}
  #ipsheet .head b,#qsheet .head b{font-size:14px;flex:1}
  #ipsheet .head button,#qsheet .head button{width:36px;height:36px;color:var(--muted);font-size:18px}
  .ip-actions{display:flex;gap:8px;margin-top:10px}
  .ip-actions button{flex:1;min-height:40px;border-radius:11px;background:var(--card);color:var(--ink2);box-shadow:var(--shadow);font-size:12.5px}
  .ip-actions .pri{background:var(--lime);color:#fff}
  .ip-hint{margin-top:8px;color:var(--muted);font-size:11px}
  .ip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px}
  .ip-item{position:relative;border-radius:11px;background:var(--card);overflow:hidden;box-shadow:var(--shadow);text-align:left}
  .ip-item img{width:100%;aspect-ratio:1;display:block;object-fit:cover}
  .ip-item .cap{display:block;padding:6px 7px;font-size:10.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ip-item.on{outline:2px solid var(--lime);outline-offset:-2px}
  .ip-item.on::after{content:'✓';position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;
    display:grid;place-items:center;background:var(--lime);color:#fff;font-size:13px;font-weight:700}
  #qsheet .qpreview{margin-top:10px;padding:8px 10px;border-left:2px solid var(--fav);background:var(--card2);
    border-radius:4px 10px 10px 4px;color:var(--ink2);font-size:12px;line-height:1.55}
  #qsheet .qpreview b{display:block;color:var(--ink);font-size:11px;margin-bottom:2px}
  #qsheet .qactions{display:flex;gap:8px;margin-top:12px}
  #qsheet .qactions button{flex:1;min-height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:13px;color:var(--ink2)}
  #qsheet .qactions .go{background:var(--fav);color:#fff}

  /* ── 手账：注册表驱动的作品独立进度 ── */
  .jhead .arc{font:700 17px/1.5 var(--font-ui)}
  .jhead .jmeta{margin-top:5px}
  .jhead .pat2{margin-top:7px;font-size:13px;color:var(--ink2)}
  .journal-lines{display:grid;gap:10px;margin-top:10px}
  .journal-line{position:relative;overflow:hidden}
  .journal-line::after{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--wn-work-accent,var(--fav));opacity:.82}
  .journal-line.is-disabled{opacity:.66;background:color-mix(in srgb,var(--panel) 82%,var(--hair) 18%)}
  .journal-line.is-disabled::after{background:var(--muted)}
  .journal-line-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;padding-left:4px}
  .journal-line-head .work{font:700 14px/1.4 var(--font-ui);color:var(--ink)}
  .journal-line-head .arc{margin-top:2px;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:right}
  .journal-off{font-size:11px;color:var(--muted);letter-spacing:.04em}
  .journal-disabled-copy{padding:3px 4px 2px;font-size:12px;line-height:1.55;color:var(--muted)}
  .m4b{position:relative;padding-left:14px}
  .m4b::before{content:'';position:absolute;left:3px;top:10px;bottom:10px;width:1.5px;background:var(--hair)}

  .m4b>div.cur::before{background:var(--fav)}
  .m4b em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:0;margin-bottom:2px}
  .m4b span{font-size:13px;line-height:1.55;color:var(--ink2)}
  .m4b .cur span{color:var(--ink);font-weight:600}

  /* ── LIME：动态流 ── */
  .mcomp{display:flex;align-items:center;gap:10px;margin:12px 14px 2px;padding:12px 14px;
    border-radius:16px;background:var(--card);box-shadow:var(--shadow);width:calc(100% - 28px);text-align:left}
  .mcomp .mph{color:var(--muted)}
  .mcomp .mpen{margin-left:auto;color:var(--muted);opacity:.7;font-size:13px}
  .mavx{width:34px;height:34px;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--hair);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;overflow:hidden}
  .mavx img{width:100%;height:100%;object-fit:cover;display:block}
  .mom{margin:10px 14px;padding:13px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
  .mom .mh{display:flex;align-items:center;gap:9px}
  .mom .mh b{font-size:14px}
  .mom .mt{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
  .mom .mtx{margin-top:7px;font-size:13.5px;line-height:1.58;white-space:pre-wrap}
  .mcs{margin-top:9px;padding:8px 11px;border-radius:10px;background:var(--card2);
    display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .mc{font-size:12.5px;line-height:1.55;color:var(--ink2);text-align:left;display:flex;align-items:flex-start;gap:6px;width:100%}

  .mc b{color:var(--ink);font-weight:600;flex:none}
  .mc .mtx2{flex:1;min-width:0}
  .mc.mut{color:var(--muted)}
  .moment-swipe.swipe-row{margin:10px 14px;border-radius:16px;box-shadow:var(--shadow)}
  .moment-swipe .mom{position:relative;z-index:1;margin:0;min-height:72px;box-shadow:none;
    transform:translateX(0);transition:transform .18s ease-out;will-change:transform}
  .moment-swipe.dragging .mom{transition:none}
  .moment-swipe.open .mom{transform:translateX(76px)}
  .mom-media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:9px;
    overflow:hidden;border-radius:10px}
  .mom-media.c1{grid-template-columns:1fr}.mom-media.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mom-img{display:block;position:relative;aspect-ratio:1;background:var(--card2);overflow:hidden;min-width:0}

  .mom-img img{width:100%;height:100%;display:block;object-fit:cover}
  .mom-img .photo-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:10px;background:var(--press)}

    padding:0 12px;font:13.5px var(--font-ui);outline:none;box-shadow:inset 0 0 0 1px var(--hair)}
  .gmems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

    outline:none;box-shadow:inset 0 0 0 1px var(--hair)}

    outline:none;box-shadow:inset 0 0 0 1px var(--hair)}
  #msheet .row{display:flex;gap:8px;margin-top:10px}
  #msheet .row button{flex:1;min-height:42px;border-radius:12px;font-size:13px;color:var(--ink2);
    background:var(--card);box-shadow:var(--shadow)}
  #msheet .row .go{background:var(--lime);color:#fff}
  #msheet .note{font-size:11px;color:var(--muted);margin-top:6px}
  .mpickbar{display:flex;align-items:center;gap:8px;margin-top:9px}
  .mpick{min-height:38px;padding:0 12px;border-radius:10px;background:var(--card);
    box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
  .mpick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
  .mpick[disabled]{opacity:.5}.mcount{margin-left:auto;color:var(--muted);font-size:11px}
  .mpreview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:8px}
  .mpreview:empty{display:none}
  .mprev{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--card2)}
  .mprev img{width:100%;height:100%;object-fit:cover;display:block}
  .mprev button{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;
    background:rgba(10,10,10,.72);color:#fff;font-size:15px;line-height:24px}

  /* ── 广场下拉刷新 ── */
  #campus-body{position:relative;isolation:isolate}
  .pull-ind{--pull-angle:0deg;--pull-scale:.82;position:relative;z-index:5;width:100%;height:50px;margin-top:-50px;
    display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);opacity:0;transform:translateY(0);
    transition:transform .18s cubic-bezier(.2,.75,.25,1),opacity .12s ease,margin-top .18s ease,margin-bottom .18s cubic-bezier(.2,.75,.25,1);
    pointer-events:none;will-change:transform,opacity}
  .pull-orb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);
    box-shadow:0 2px 10px rgba(0,0,0,.16),inset 0 0 0 1px var(--ring);
    transform:scale(var(--pull-scale)) rotate(var(--pull-angle));transition:transform .12s ease,color .16s,background .16s,box-shadow .16s}
  .pull-arrow{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .pull-spinner{display:none;width:14px;height:14px;border:1.8px solid color-mix(in srgb,currentColor 24%,transparent);
    border-top-color:currentColor;border-radius:50%}
  .pull-label{font-size:13px;font-weight:650;line-height:1;color:currentColor;opacity:.92}
  .pull-ind.ready{color:var(--fav)}
  .pull-ind.ready .pull-orb{background:color-mix(in srgb,var(--fav) 10%,var(--card));
    box-shadow:0 3px 12px color-mix(in srgb,var(--fav) 18%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--fav) 28%,transparent)}
  .pull-ind.busy{margin-top:0;opacity:1;transform:none;color:var(--fav)}
  .pull-ind.busy .pull-orb{transform:none}
  .pull-ind.busy .pull-arrow{display:none}
  .pull-ind.busy .pull-spinner{display:block;animation:campus-pull-spin .72s linear infinite}
  @keyframes campus-pull-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .pull-ind,.pull-orb{transition:none}
    .pull-ind.busy .pull-spinner{animation-duration:1.4s}
  }

  /* ── 世界书控制器 ── */
  .wb-tools{padding:10px 14px 8px;background:var(--surface);display:grid;gap:8px}
  .wb-search{width:100%;min-height:40px;border:0;border-radius:11px;background:var(--card2);
    color:var(--ink);padding:0 12px;font:13.5px var(--font-ui);outline:none;box-shadow:inset 0 0 0 1px var(--hair)}
  .wb-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:10px;background:var(--card2)}
  .wb-seg button{min-height:36px;border-radius:8px;color:var(--muted);font-size:12px}
  .wb-seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .wb-work-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wb-work{min-width:0;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair)}
  .wb-work-copy{flex:1;min-width:0}.wb-work-copy b{display:block;font-size:12.5px}.wb-work-copy span{display:block;margin-top:2px;font-size:10.5px;color:var(--muted)}
  .wb-cat,.wb-entry{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 14px;
    border-bottom:1px solid var(--hair)}
  .wb-cat .go,.wb-entry .go{flex:1;min-width:0;text-align:left;min-height:44px}
  .wb-cat .nm,.wb-entry .nm{font-weight:650;font-size:13.5px;display:block;overflow-wrap:anywhere}
  .wb-cat .sub,.wb-entry .sub{font-size:11px;color:var(--muted);display:block;margin-top:3px}
  .wb-count{font-size:11px;color:var(--muted);white-space:nowrap}
  .wb-group{padding:2px 0 12px}
  .wb-group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 14px 5px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .wb-group-h .num{font-weight:600;white-space:nowrap}
  .wb-switch{width:42px;height:24px;border-radius:13px;background:var(--press);position:relative;flex:none;
    box-shadow:inset 0 0 0 1px var(--hair)}
  .wb-switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.15s}
  .wb-switch.on{background:var(--lime);box-shadow:none}.wb-switch.on::after{left:21px}
  .wb-switch[disabled]{opacity:.38;cursor:default}
  .wb-lock{font-size:10.5px;color:var(--warn);white-space:nowrap}
  .wb-detail{padding:14px;display:grid;gap:10px}
  .wb-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}
  .wb-content{margin:0;padding:12px;border-radius:10px;background:var(--card);color:var(--ink2);
    white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.72 var(--font-ui);box-shadow:var(--shadow)}
  .wb-reload{min-height:38px;padding:0 10px;border-radius:9px;background:var(--card2);color:var(--ink2);
    display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:650;
    box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
  .wb-reload span[aria-hidden]{font-size:16px;line-height:1}
  .wb-reload[disabled]{opacity:.55;cursor:default}
  #dsheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:75}
  #dsheet.on{display:flex}
  #dsheet .pane{width:100%;background:var(--surface);border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.3);padding:16px 14px 14px}
  #dsheet .pane b{font-size:14px}
  #dsheet .note{font-size:12px;color:var(--ink2);line-height:1.65;margin-top:7px}
  #dsheet .row{display:flex;gap:8px;margin-top:12px}
  #dsheet .row button{flex:1;min-height:42px;border-radius:12px;font-size:13px;color:var(--ink2);
    background:var(--card);box-shadow:var(--shadow)}
  #dsheet .row .danger{background:var(--crit);color:#fff}

  /* 触屏端：输入控件 ≥16px，避免 iOS Safari 聚焦自动放大页面 */
  @media (pointer: coarse){
    .compose input, .srow input[type=text], .srow input[type=password],
    .apibox select, #gsheet textarea, #msheet textarea, .memota, .ginp,
    .wb-search, #vedit input, #vedit select, #vedit textarea,
    #pactsheet input, #pactsheet select, #pactsheet textarea { font-size:16px }
  }

function roleNameCandidates(name,extraAliases){

  else if(obj(S.avaAlias)) maps.push(S.avaAlias);

  const add=value=>{ const key=String(value||'').trim(); if(key&&!seen.has(key)){seen.add(key);out.push(key);queue.push(key);} };
  while(queue.length){
    const current=queue.shift();

    });
  }

}

function bondTl(txt){
  const parts=String(txt||'').split(/[；;]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<2) return `<div class="bond num">${esc(String(txt||''))}</div>`;
  return `<div class="tl num">${parts.map(p=>{
    const m=p.match(/^(\S+)\s+([\s\S]+)$/);
    return `<div>${m?`<b>${esc(m[1])}</b>${esc(m[2])}`:esc(p)}</div>`;
  }).join('')}</div>`;
}

function pickWall(){
  const inp=$id('wallpick');
  inp.onchange=()=>{
    const f=inp.files && inp.files[0]; inp.value=''; if(!f) return;
    const img=new Image();
    img.onload=()=>{
      /* 目标分辨率随设备像素密度走：清晰优先，最长边封顶 2048 */
      const dpr=Math.min(window.devicePixelRatio||1, 3);
      const need=Math.max(1200, Math.round(Math.max(screen.width,screen.height)*dpr));
      const target=Math.min(Math.max(img.width,img.height), Math.min(need, 2048));
      const k=Math.min(1, target/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      const cx=cv.getContext('2d');
      cx.imageSmoothingQuality='high';
      cx.drawImage(img,0,0,cv.width,cv.height);
      let url=''; try{ url=cv.toDataURL('image/webp',.9); }catch(_){ }
      if(!/^data:image\/webp/.test(url)){ try{ url=cv.toDataURL('image/jpeg',.9); }catch(_){ } }
      try{ localStorage.setItem(WALL_KEY,url); toast('壁纸已更换'); }
      catch(e){ toast('图片太大，存不下——换张小的'); }
      applyWall();
    };
    img.onerror=()=>toast('读不了这张图');
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}

function emptyStore(){ return { v:1, seq:0,
  line:{ threads:Object.create(null) }, forum:{ posts:[], lastRead:0 }, media:{ news:[], lastRead:0 }, seeds:[], smsSeen:Object.create(null), moments:[],
  momRead:0, notes:[], noteSeq:0,

  albumUnlocked:Object.create(null), schedule:{seen:Object.create(null)} }; }
const GROUP_PREFIX='g_';
function groupThreadId(name){ return GROUP_PREFIX+String(name==null?'':name); }
function threadTable(st){ return get(st||S.store,'line.threads',{}); }
function threadOf(id,st){ const ts=threadTable(st); return own(ts,id)?ts[id]:null; }
function characterOf(name){

}
function roleVariableKey(name){

function mergeThreads(left,right){
  const out=left;
  const seen=new Set();
  const msgs=[];
  for(const m of [...(left.msgs||[]),...(right.msgs||[])]){
    if(!obj(m)) continue;
    const sig=[m.seq,m.dir,m.from,m.text,m.t,m.d,m.sys,m.hash].map(x=>String(x??'')).join('\u001f');
    if(seen.has(sig)) continue;
    seen.add(sig); msgs.push(m);
  }
  msgs.sort((a,b)=>num(a.seq)-num(b.seq));
  out.msgs=msgs;
  out.members=[...new Set([...(left.members||[]),...(right.members||[])].map(String))];
  out.lastRead=Math.max(num(left.lastRead),num(right.lastRead));
  return out;
}
function canonicalDmIdentity(th,id){
  if(!obj(th) || th.type==='group') return th;
  th.type='dm'; th.name=String(id); th.members=[String(id)];
  (th.msgs||[]).forEach(m=>{ if(obj(m)&&!m.sys&&m.dir!=='out') m.from=String(id); });
  return th;
}
function migrateRolePhoneData(st,oldName,newName){
  const before=String(oldName), after=String(newName), threads=threadTable(st);
  if(before===after) return;
  if(own(threads,before)){
    const moved=canonicalDmIdentity(threads[before],after);
    if(own(threads,after) && threads[after]!==moved){
      canonicalDmIdentity(threads[after],after);
      threads[after]=mergeThreads(threads[after],moved);
    }else threads[after]=moved;
    delete threads[before];
  }
  if(own(threads,after)) canonicalDmIdentity(threads[after],after);
  for(const th of Object.values(threads)){
    if(!obj(th)||th.type!=='group') continue;
    th.members=[...new Set((th.members||[]).map(name=>String(name)===before?after:String(name)))];
    (th.msgs||[]).forEach(m=>{ if(obj(m)&&m.from===before) m.from=after; });
  }
  st.contactMemos=obj(st.contactMemos)?st.contactMemos:Object.create(null);
  st.memoDirty=obj(st.memoDirty)?st.memoDirty:Object.create(null);
  const oldMemo=obj(st.contactMemos[before])?st.contactMemos[before]:null;
  const newMemo=obj(st.contactMemos[after])?st.contactMemos[after]:null;
  if(oldMemo){
    if(newMemo){
      const texts=[String(newMemo.text||'').trim(),String(oldMemo.text||'').trim()].filter(Boolean);
      const merged=[...new Set(texts)].join('\n').slice(-1500);
      st.contactMemos[after]={...newMemo,text:merged,through:Math.max(num(newMemo.through),num(oldMemo.through))};
    }else st.contactMemos[after]=oldMemo;
    st.memoDirty[after]=true;
    delete st.contactMemos[before];
  }
  if(st.memoDirty[before]===true){ st.memoDirty[after]=true; delete st.memoDirty[before]; }
  (st.moments||[]).forEach(m=>{
    if(m.who===before) m.who=after;
    (m.comments||[]).forEach(c=>{ if(c.from===before) c.from=after; });
  });
  (st.notes||[]).forEach(n=>{ if(n.key===before) n.key=after; });
}
function normalizeStore(raw){
  let before=''; try{ before=JSON.stringify(raw); }catch(_){}
  const st=(obj(raw)&&raw.v===1)?raw:emptyStore();
  st.v=1;
  st.line=obj(st.line)?st.line:{};
  const sourceThreads=obj(st.line.threads)?st.line.threads:{};
  const threads=Object.create(null);
  const threadIdMap=Object.create(null);
  for(const [sourceId,value] of Object.entries(sourceThreads)){
    if(!obj(value)) continue;
    const th={...value};
    th.type=th.type==='group'?'group':'dm';
    const fallbackName=th.type==='group'&&sourceId.startsWith(GROUP_PREFIX)
      ? sourceId.slice(GROUP_PREFIX.length) : sourceId;
    th.name=th.type==='group'?String(th.name||fallbackName):String(sourceId);
    th.members=Array.isArray(th.members)?th.members.map(String).filter(Boolean)
      :(th.type==='group'?[]:[sourceId]);
    th.msgs=Array.isArray(th.msgs)?th.msgs.filter(obj):[];
    th.msgs.forEach(m=>{
      if(m.batchId!=null) m.batchId=String(m.batchId).slice(0,90);
      if(m.replyBatchId!=null) m.replyBatchId=String(m.replyBatchId).slice(0,90);
      if(m.replyToSeq!=null) m.replyToSeq=Math.max(0,Math.floor(num(m.replyToSeq)));
      if(m.mediaId!=null) m.mediaId=String(m.mediaId).slice(0,100);
      if(m.kind!=='image' && m.kind!=='album') delete m.kind;
      if(m.kind==='image' && !m.mediaId) delete m.kind;
      if(m.kind==='album'){
        if(!/^https:\/\//.test(String(m.albumSrc||m.src||''))) delete m.kind;
        else { m.albumSrc=String(m.albumSrc||m.src).slice(0,2000); m.albumTitle=String(m.albumTitle||m.title||'').slice(0,120); delete m.src; delete m.title; }
      }
      if(m.quote!=null){
        if(!obj(m.quote)) delete m.quote;
        else m.quote={seq:Math.max(0,Math.floor(num(m.quote.seq))),from:String(m.quote.from||'').slice(0,40),
          text:String(m.quote.text||'').slice(0,180),kind:m.quote.kind==='image'||m.quote.kind==='album'?m.quote.kind:'text'};
      }
    });
    if(th.type!=='group') canonicalDmIdentity(th,sourceId);
    th.pendingBatchId=String(th.pendingBatchId||'').slice(0,90);
    if(!th.pendingBatchId || !th.msgs.some(m=>m.dir==='out'&&m.batchId===th.pendingBatchId)
      || th.msgs.some(m=>m.replyBatchId===th.pendingBatchId)) delete th.pendingBatchId;
    const incoming=th.msgs.filter(m=>m.dir!=='out').length;
    th.lastRead=clamp(Math.floor(num(th.lastRead)),0,incoming);
    const targetId=th.type==='group'?groupThreadId(th.name):sourceId;
    threadIdMap[sourceId]=targetId;
    threads[targetId]=own(threads,targetId)?mergeThreads(threads[targetId],th):th;
  }
  st.line.threads=threads;
  st.forum=obj(st.forum)?st.forum:{};
  st.forum.posts=Array.isArray(st.forum.posts)?st.forum.posts.filter(obj):[];
  st.forum.posts.forEach(p=>{ p.board=normalizeStoredCampusBoard(p.board); });
  st.forum.lastRead=clamp(Math.floor(num(st.forum.lastRead)),0,st.forum.posts.length);
  st.media=obj(st.media)?st.media:{};
  st.media.news=Array.isArray(st.media.news)?st.media.news.filter(obj):[];
  st.media.lastRead=clamp(Math.floor(num(st.media.lastRead)),0,st.media.news.length);
  st.seeds=Array.isArray(st.seeds)?st.seeds.filter(obj):[];
  st.smsSeen=Object.assign(Object.create(null),obj(st.smsSeen)?st.smsSeen:{});
  st.moments=Array.isArray(st.moments)?st.moments.filter(obj):[];
  st.moments.forEach(m=>{
    const images=[];
    for(const image of (Array.isArray(m.images)?m.images:[]).slice(0,9)){
      if(!obj(image)) continue;
      if(image.kind==='local' && image.mediaId){
        images.push({kind:'local',mediaId:String(image.mediaId).slice(0,100),
          width:Math.max(0,Math.floor(num(image.width))),height:Math.max(0,Math.floor(num(image.height))),
          mime:String(image.mime||'').slice(0,80)});
      }else if(image.kind==='album' && /^https:\/\//.test(String(image.src||''))){
        images.push({kind:'album',src:String(image.src).slice(0,2000),title:String(image.title||'').slice(0,120)});
      }
    }
    m.images=images;
    m.comments=Array.isArray(m.comments)?m.comments.filter(obj):[];
    m.commentFailed=m.commentFailed===true;
  });
  st.notes=Array.isArray(st.notes)?st.notes.filter(obj).slice(-12):[];
  st.noteSeq=Math.max(0,Math.floor(num(st.noteSeq)));
  st.notes.forEach(n=>{ st.noteSeq=Math.max(st.noteSeq,Math.floor(num(n.id))); });
  st.memoLog=Array.isArray(st.memoLog)?st.memoLog.filter(obj):[];
  const contactMemos=Object.create(null);
  for(const [sourceId,value] of Object.entries(obj(st.contactMemos)?st.contactMemos:{})){
    if(!obj(value)) continue;
    value.text=String(value.text||'').slice(0,1500);
    value.through=Math.max(0,Math.floor(num(value.through)));
    value.d=String(value.d||'').slice(0,40); value.t=String(value.t||'').slice(0,40);
    const id=threadIdMap[sourceId]||sourceId;
    if(!contactMemos[id]||value.through>=contactMemos[id].through) contactMemos[id]=value;
  }
  st.contactMemos=contactMemos;
  const memoDirty=Object.create(null);
  for(const [sourceId,value] of Object.entries(obj(st.memoDirty)?st.memoDirty:{})){
    if(value===true) memoDirty[threadIdMap[sourceId]||sourceId]=true;
  }
  st.memoDirty=memoDirty;
  st.digestOff=st.digestOff===true;
  st.digestMemo=String(st.digestMemo||'');
  st.digestCut=Math.max(0,Math.floor(num(st.digestCut)));
  st.digestTurns=Math.max(0,Math.floor(num(st.digestTurns)));
  st.prevTurnSeq=Math.max(0,Math.floor(num(st.prevTurnSeq)));
  const momTotal=st.moments.reduce((a,m)=>a+(Array.isArray(m.comments)?m.comments.length:0),0);
  st.momRead=clamp(Math.floor(num(st.momRead)),0,momTotal);
  const albumUnlocked=Object.create(null);
  for(const [id,value] of Object.entries(obj(st.albumUnlocked)?st.albumUnlocked:{})){
    if(value===true && /^[a-z][a-z0-9-]{0,119}$/.test(id)) albumUnlocked[id]=true;
  }
  const albumUnlockIds=Object.keys(albumUnlocked);
  if(albumUnlockIds.length>2000){
    for(const id of albumUnlockIds.slice(0,albumUnlockIds.length-2000)) delete albumUnlocked[id];
  }
  st.albumUnlocked=albumUnlocked;
  st.schedule=obj(st.schedule)?st.schedule:{seen:Object.create(null)};
  st.schedule.seen=Object.assign(Object.create(null),obj(st.schedule.seen)?st.schedule.seen:{});
  const scheduleSeenKeys=Object.keys(st.schedule.seen);
  if(scheduleSeenKeys.length>120){ for(const key of scheduleSeenKeys.slice(0,scheduleSeenKeys.length-120)) delete st.schedule.seen[key]; }
  let maxSeq=Math.max(0,Math.floor(num(st.seq)));
  Object.values(threads).forEach(th=>(th.msgs||[]).forEach(m=>{ maxSeq=Math.max(maxSeq,num(m.seq)); }));
  st.moments.forEach(m=>{ maxSeq=Math.max(maxSeq,num(m.id)); });
  st.memoLog.forEach(m=>{ maxSeq=Math.max(maxSeq,num(m.id)); });
  st.forum.posts.forEach(p=>{ maxSeq=Math.max(maxSeq,num(p.id)); });
  st.media.news.forEach(n=>{ maxSeq=Math.max(maxSeq,num(n.id)); });
  const seenCampus=new Set();
  [...st.forum.posts,...st.media.news].forEach(item=>{
    let id=Math.floor(num(item.id));
    if(id<=0 || seenCampus.has(id)) id=++maxSeq;
    item.id=id; seenCampus.add(id);
  });
  st.seq=Math.floor(maxSeq);
  let after=''; try{ after=JSON.stringify(st); }catch(_){}
  return {store:st,changed:before!==after};
}

function focusedThreadScroller(){

function settleFocusedThread(){
  const box=focusedThreadScroller();
  if(!box) return false;
  box.scrollTop=box.scrollHeight;

function scheduleFocusedThreadSettle(){

  const deadline=String($id('pact-deadline').value||'').trim();
  const status=String($id('pact-status').value||'');
  const error=$id('pact-error'); error.textContent='';
  if(!name){ error.textContent='请填写约定名称'; return; }
  if(!content){ error.textContent='请写明约定内容'; return; }
  if(/[.\/\[\]~"'\\\x00-\x1F\x7F]/u.test(name)||['__proto__','prototype','constructor'].includes(name)){
    error.textContent='约定名称含有不允许的字符'; return;
  }
  const pacts=get(S.stat,'世界.约定',{});
  if(obj(pacts)&&own(pacts,name)){ error.textContent='已经存在同名约定，请换一个名称'; return; }
  if(!['进行中','达成','破弃','悬置'].includes(status)){ error.textContent='请选择有效状态'; return; }
  PROMISE_STATE.busy=true; $id('pact-save').disabled=true;
  try{
    const next=await S.B.insertStatPromise(name,{内容:content,相关者:related,期限:deadline,状态:status});
    if(obj(next)) S.stat=next; else await refreshStat();
    PROMISE_STATE.busy=false; WN.closePromiseSheet(false); renderSchedule(false); renderSys();
    toast('已新增约定 '+name);
  }catch(err){
    PROMISE_STATE.busy=false; $id('pact-save').disabled=false;
    error.textContent=String(err&&err.message||err||'新增失败').slice(0,120);
  }
};
async function applyStatRemoval(path,label,opener,note){
  if(!S.editMode) return;
  if(!S.B.removeStatPath){ toast('当前手机桥不支持变量删除'); return; }
  if(!await askDelete(note,opener)) return;
  try{
    const next=await S.B.removeStatPath(path);
    if(obj(next)) S.stat=next; else await refreshStat();
    await WN.refreshCurrentView(); renderSys();
    toast('已删除 '+label);
  }catch(err){ toast('删除失败：'+String(err&&err.message||err||'写入失败').slice(0,100)); }
}

function ensureScr(id, build){
  let s = $id(id);
  if(!s){ s = document.createElement('div'); s.className='scr'; s.id=id;
    $id('stack').appendChild(s); }
  build && build(s);
  return s;
}
WN.go = function(id){
  const target = $id(id); if(!target) return;
  /* 路由跳转可能由通知重复触发：复用已有屏，禁止同一 DOM 同时处于 on/under。 */
  const existing = S.stack.indexOf(id);
  if(existing>=0){
    const retired = S.stack.splice(existing+1);
    for(const rid of new Set(retired)){
      if(rid===id) continue;
      const old=$id(rid); if(!old) continue;
      old.classList.remove('on','under');
      setTimeout(()=>{ if(old.id!=='scr-home'&&!S.stack.includes(old.id)) old.remove(); },220);
    }
    target.classList.remove('under'); target.classList.add('on'); syncEditMode();
    return;
  }
  const cur = $id(S.stack[S.stack.length-1]);
  cur && cur.classList.add('under'), cur && cur.classList.remove('on');
  target.classList.remove('under');
  S.stack.push(id);
  requestAnimationFrame(()=>{ target.classList.add('on'); syncEditMode(); });
};
WN.back = function(){
  if(S.stack.length<=1) return;
  const cur = $id(S.stack.pop());
  cur && cur.classList.remove('on','under');
  const prev = $id(S.stack[S.stack.length-1]);
  if(prev){ prev.classList.remove('under'); prev.classList.add('on');
    if(prev.id==='scr-home') prev.classList.remove('on'); /* home 无需 on 态 */ }
  /* v0.16.0：退回时补一次重绘——否则主屏 App 角标、LIME 未读数、广场小圆点
     都停在进子页之前的旧值，看完了也消不掉 */
  if(S.stack.length===1 && S.stack[0]==='scr-home') renderHome();
  else if(prev){
    if(prev.id==='scr-lime' && $id('lime-body')) paintLime();
    else if(prev.id==='scr-campus' && $id('campus-body')) paintCampus();
  }
  cur && setTimeout(()=>{ if(cur.id!=='scr-home' && !S.stack.includes(cur.id)) cur.remove(); }, 220);
  syncEditMode();
};
WN.home = function(){
  if($id('ipsheet').classList.contains('on')) WN.closeImagePicker();
  if($id('qsheet').classList.contains('on')) WN.closeChatOps();
  while(S.stack.length>1){ const id=S.stack.pop(), s=$id(id);
    if(s){ s.classList.remove('on','under');
      /* 复活守卫：220ms 内被 ensureScr 重新入栈的屏不销毁（快速点按不再白屏） */
      setTimeout(()=>{ if(!S.stack.includes(id)) s.remove(); },220); } }
  const h=$id('scr-home'); h.classList.remove('under');
  renderHome();
};

function syncEditMode(){
  const active=$id(S.stack[S.stack.length-1]);
  const targets=active?[...active.querySelectorAll('[data-wn-edit]')]:[];
  const available=targets.length>0, btn=$id('sys-edit');
  document.body.classList.toggle('wn-edit-mode',S.editMode);
  btn.classList.toggle('available',available);
  btn.classList.toggle('on',S.editMode && available);
  btn.setAttribute('aria-pressed',String(S.editMode && available));
  btn.setAttribute('aria-label',S.editMode?'退出变量编辑模式':'进入变量编辑模式');
  btn.title=S.editMode?'完成编辑':'编辑变量';
  document.querySelectorAll('[data-wn-edit]').forEach(el=>{
    el.removeAttribute('tabindex'); el.removeAttribute('role'); el.removeAttribute('aria-label');
  });
  if(S.editMode) targets.forEach(el=>{
    el.tabIndex=0; el.setAttribute('role','button');
    el.setAttribute('aria-label','编辑'+String(el.dataset.wnEditLabel||'变量'));
  });
}
WN.toggleEditMode=function(){

};

/* ---------- 未读统计 ---------- */
function unreadOf(th){ return Math.max(0, (th.msgs||[]).filter(m=>m.dir!=='out').length - (th.lastRead||0)); }
function unreadLime(){ if(!S.store) return 0;
  return Object.values(get(S.store,'line.threads',{})).reduce((a,t)=>a+unreadOf(t),0); }
function unreadForum(){ if(!S.store || !S.store.forum) return 0;
  const f=S.store.forum; return Math.max(0,(f.posts||[]).length-(f.lastRead||0)); }
function unreadMedia(){ if(!S.store || !S.store.media) return 0;
  const m=S.store.media; return Math.max(0,(m.news||[]).length-(m.lastRead||0)); }
function unreadCampus(){ return unreadForum()+unreadMedia(); }
/* 动态未读：已到达评论总数减已看水位（自发的动态本体不计） */
function momentSignal(){ if(!S.store) return 0;
  return get(S.store,'moments',[]).reduce((a,m)=>a+((m&&m.comments&&m.comments.length)||0),0); }
function unreadMoments(){ if(!S.store) return 0;
  return Math.max(0, momentSignal()-Math.floor(num(S.store.momRead))); }
function unreadLimeAll(){ return unreadLime()+unreadMoments(); }

function availableCampusBoards(){
  const world=S.stat&&S.stat.世界||{};
  const currentPlaces=[world.地点,world.具体地点,
    ...charList().filter(([,character])=>character&&character.在场===true)
      .flatMap(([,character])=>[character.地点,character.具体地点])]
    .map(value=>String(value||'').trim()).filter(Boolean);
  const seen=new Set(), boards=[];
  enabledWorkKeys().forEach(work=>{
    const hit=phoneWorkMeta(work), meta=hit&&hit.meta, forums=meta&&Array.isArray(meta.forums)?meta.forums:[];
    forums.forEach(item=>{
      const name=String(item&&item.name||'').trim(); if(!name||seen.has(name)) return;
      const locations=(Array.isArray(item.locations)?item.locations:[]).map(place=>String(place||'').trim()).filter(Boolean);
       const near=locations.some(place=>currentPlaces.some(current=>phonePlaceNear(current,place)));
      seen.add(name); boards.push({...item,work,name,near});
    });
  });
  boards.sort((a,b)=>Number(b.near)-Number(a.near));
  return boards.length?boards:[{id:'tokyo',name:'东京生活区匿名闲聊板',locations:[],work:'通用',near:true}];
}

  }).map(String).filter(Boolean);
}

WN.pickMomentImages=function(){
  if(S.momentImageBusy||S.momentPostBusy) return;
  if(!S.B.putMedia||!S.B.getMedia){ toast('当前手机桥不支持图片发布'); return; }
  const inp=$id('momentpick');
  inp.onchange=async()=>{
    const files=Array.from(inp.files||[]); inp.value=''; if(!files.length) return;
    if(S.momentDraft.length+files.length>9){ toast('一条动态最多选择 9 张图片'); return; }
    const epoch=momentDraftEpoch, added=[];
    S.momentImageBusy=true; paintMomentDraft();
    try{
      for(const file of files){
        const image=await compressChatImage(file);
        added.push({...image,url:URL.createObjectURL(image.blob)});
      }
      if(epoch!==momentDraftEpoch){ for(const image of added) URL.revokeObjectURL(image.url); return; }
      S.momentDraft.push(...added);
    }catch(e){
      for(const image of added){ try{ URL.revokeObjectURL(image.url); }catch(_){} }
      toast('图片处理失败：'+String(e&&e.message||e));
    }finally{ S.momentImageBusy=false; paintMomentDraft(); }
  };
  inp.click();
};

WN.momReplies=async function(mid){

    const participantSources=workParticipantsLine(promptNames);
    const sysP=sharedWorldPrompt(promptNames)
      +(participantSources?`参与角色来源：${participantSources}。`:'')
      +`你正在生成 LIME 动态（类朋友圈）的评论区。`
      + `评论是随手敲的：短、口语、可以只有几个字或一个颜文字，不要写成完整句子的小作文；`
      + `谁评、评什么由性格、与发帖人的关系阶段、四项关系信号、近期事件、心情与正在做的事共同决定，不按单一数值套固定反应；`

      + `允许彼此接话（后一条踩前一条），不要人人轮流客气回一句；`
      + `此刻与 ${meN} 同场的人可以一边当面吐槽一边在手机上评。`+NO_SPOIL;
    const userP=[ctxBlock({}),
      `【${poster} 的动态】${mom.text}`,
      `【发布于】${mom.d||''} ${mom.t||''}`,
      momentImages(mom).length?`【动态图片】共 ${momentImages(mom).length} 张；评论只能依据图片中实际可见的信息，不要编造画面外细节。`:'',
      '【可评论的好友及其现状】\n'+(friends||'（暂无）'),
      '输出 JSON 数组，元素为 {"from":"角色名","text":"评论"}；from 必须逐字复制可评论好友列表中的角色键，不得改成全名、昵称或别名。0-3 条，每条 ≤30 字；没人想评就输出 []。'+JSON_ONLY

function clearReplyWindow(id,batchId){
  const pending=S.replyTimers.get(id); if(!pending || (batchId && pending.batchId!==batchId)) return;
  clearTimeout(pending.timer); S.replyTimers.delete(id);
}
function replyInput(id){
  const input=$id('in-'+keyToken(id));
  return input && !input.disabled ? input : null;
}
function makeReplyPending(batchId,now){
  const at=Number(now)||Date.now();
  return {batchId,timer:null,startedAt:at,hardDeadline:at+REPLY_BATCH_MAX_MS,
    baseDeadline:at+REPLY_WINDOW_MS,intentAt:0,intentDeadline:0,composing:false};
}
function replyDeadline(p,now){
  const at=Number(now)||Date.now();
  return Math.min(Number(p.hardDeadline)||at,
    Math.max(Number(p.baseDeadline)||at,Number(p.intentDeadline)||0));
}
function scheduleReplyWindow(id,p){
  if(!p || !p.batchId || S.busyThreads.has(id)) return;
  clearTimeout(p.timer);
  const delay=Math.max(0,replyDeadline(p)-Date.now());
  p.timer=setTimeout(()=>fireReplyWindow(id,p.batchId),delay);
  S.replyTimers.set(id,p);
}
function fireReplyWindow(id,batchId){
  const p=S.replyTimers.get(id); if(!p || p.batchId!==batchId) return;
  p.timer=null;
  if(S.busyThreads.has(id)) return;
  const now=Date.now(), input=replyInput(id);
  const focused=!!(input && document.activeElement===input);
  const hasDraft=!!(input && String(input.value||'').trim());
  const recentIntent=Number(p.intentAt)>0 && now-Number(p.intentAt)<REPLY_INPUT_GRACE_MS;
  const hard=Number(p.hardDeadline)||now;
  if(now<hard && (p.composing||(focused&&(hasDraft||recentIntent)))){
    p.intentDeadline=Math.min(hard,now+REPLY_INPUT_GRACE_MS);
    scheduleReplyWindow(id,p); return;
  }
  if(!focused&&!p.composing){ p.intentAt=0; p.intentDeadline=0; }
  const deadline=replyDeadline(p,now);
  if(now<deadline){ scheduleReplyWindow(id,p); return; }
  S.replyTimers.delete(id);
  genReply(id,batchId).catch(e=>console.warn('[WN] reply fail',e));
}
function armReplyWindow(id,batchId,options={}){
  if(!batchId || S.busyThreads.has(id)) return;
  const now=Date.now(), old=S.replyTimers.get(id);
  if(old && old.hardDeadline && now>=old.hardDeadline){ clearReplyWindow(id); }
  const current=S.replyTimers.get(id);
  if(current && current.batchId===batchId){
    clearTimeout(current.timer);
    current.baseDeadline=Math.min(current.hardDeadline,now+REPLY_WINDOW_MS);
    if(options.sent){ current.intentAt=0; current.intentDeadline=0; current.composing=false; }
    scheduleReplyWindow(id,current); return;
  }
  const pending=makeReplyPending(batchId,now);
  scheduleReplyWindow(id,pending);
}
function noteReplyIntent(id,kind){
  const p=S.replyTimers.get(id); if(!p) return;
  const now=Date.now();
  if(kind==='focusout'){
    p.composing=false;
    p.intentAt=0;
    p.intentDeadline=0;
    scheduleReplyWindow(id,p);
    return;
  }
  const input=replyInput(id);
  if(!input || document.activeElement!==input) return;
  if(kind==='compositionstart'||kind==='compositionupdate') p.composing=true;
  if(kind==='compositionend') p.composing=false;
  p.intentAt=now;
  p.intentDeadline=Math.min(Number(p.hardDeadline)||now+REPLY_INPUT_GRACE_MS,now+REPLY_INPUT_GRACE_MS);
  scheduleReplyWindow(id,p);
}
function batchForSend(id){

  if(pending) clearReplyWindow(id);
  const th=threadOf(id); if(th&&th.pendingBatchId) return th.pendingBatchId;

function incomingReadAfterRemoval(th,remove){
  const incoming=(th.msgs||[]).filter(m=>m.dir!=='out');
  const read=new Set(incoming.slice(0,clamp(Math.floor(num(th.lastRead)),0,incoming.length)));
  th.msgs=(th.msgs||[]).filter((m,i)=>!remove(m,i));

function batchForMessage(th,seq){

  if(!target || target.dir!=='out') return null;

  const ms=th.msgs||[], start=ms.indexOf(target), next=ms.findIndex((m,i)=>i>start&&m.dir==='out');
  incomingReadAfterRemoval(th,(m,i)=>{ const hit=i>start&&(next<0||i<next)&&m.dir!=='out'; if(hit) removed.push(num(m.seq)); return hit; });

WN.deleteChat=async function(id,seq,opener){

  closeSwipe();
  const linked=target.dir==='out'&&hasBatchReplies(th,target);
  const note=linked?'这条玩家消息及其对应的整批回复都会删除，不会自动重新生成。':'这条消息将从聊天记录和后续模型上下文中删除。';
  if(!await askDelete(note,opener)) return;
  const mediaIds=[]; const pending=S.replyTimers.get(id); let shouldRearm=false, rearmBatch='';
  try{
    await mutStore(st=>{
      const t2=threadOf(id,st), hit=t2&&(t2.msgs||[]).find(m=>Number(m.seq)===Number(seq)); if(!t2||!hit) return;
      const removeSeq=new Set([Number(hit.seq)]);

function pickJSON(text){
  const s = stripThink(text);
  const m = s.match(/\[[\s\S]*\]|\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(_){} }
  /* 被 max_tokens 截断时 JSON 尾部残缺（缺右括号/字符串未闭合），
     直接丢弃会让整轮内容全空。这里逐层补齐闭合再试，能救回已完整的前 N 条。
     注意：尾部没有任何右括号时，上面的贪婪正则匹配不到，必须从第一个开括号起兜底，
     否则截断内容会被整轮丢弃。 */
  const i = s.search(/[\[{]/);
  if(i<0) return null;
  const rest = s.slice(i);
  /* m.index 比第一个开括号靠后，说明正则退化到了内层对象（如顶层数组被截断），
     此时先拿完整尾巴救，否则只能救回单个元素的碎片。 */
  const a = (m && m.index===i) ? m[0] : rest;
  const b = (m && m.index===i) ? rest : (m ? m[0] : null);
  return salvageJSON(a) || (b ? salvageJSON(b) : null);

     也能救回外层对象已经完整的那些字段。 */
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(esc){ esc=false; continue; }
    if(ch==='\\'){ if(inStr) esc=true; continue; }
    if(ch==='"'){ inStr=!inStr; continue; }
    if(inStr) continue;
    if(ch==='{'||ch==='[') stack.push(ch==='{'?'}':']');
    else if(ch==='}'||ch===']'){
      if(stack.pop()!==ch) break;              /* 结构已错乱，停止收集 */
      if(stack.length) cuts.push({end:i+1, tail:stack.slice().reverse().join(''), depth:stack.length});
    }
    else if(ch===','&&stack.length){
      /* 逗号处也是安全边界：切掉逗号本身再补闭合 */
      cuts.push({end:i, tail:stack.slice().reverse().join(''), depth:stack.length});
    }
  }
  /* 先试最外层（depth 小）的切点：越靠外层，救回的完整元素越多。
     同层内取最靠后的切点。 */
  const order=cuts.slice().sort((a,b)=> a.depth-b.depth || b.end-a.end);
  let tried=0;
  for(const c of order){
    if(++tried>64) break;
    try{ return JSON.parse(s.slice(0,c.end)+c.tail); }catch(_){}
  }
  return null;
}
/* 推理模型常把 JSON 包在 <think>/```json 围栏里；先剥壳再解析，
   否则围栏残片会被当成正文贴进气泡。 */
function stripThink(text){
  let s=String(text==null?'':text);
  s=s.replace(/<(think|thinking|reasoning)[\s\S]*?<\/\1>/gi,'');
  s=s.replace(/<(think|thinking|reasoning)>[\s\S]*$/i,'');
  s=s.replace(/```[a-zA-Z]*/g,'').replace(/```/g,'');
  return s.trim();
}
/* 解析彻底失败时不再把原始 JSON 文本当消息贴出来。 */
function looksLikeRawJSON(text){
  const s=stripThink(text);
  if(!s) return true;
  return /^[\[{]/.test(s) || /"(from|text)"\s*:/.test(s);
}
function chatPromptText(m){
  if(m&&m.kind==='image') return '[图片]';
  if(m&&m.kind==='album') return '[相册图片'+(m.albumTitle?'：'+String(m.albumTitle).slice(0,80):'')+']';
  return String(m&&m.text||'').trim()||'[空消息]';
}

function normalizeChatReplies(value,th,id,allowedMembers){
  if(!Array.isArray(value)) return null;

/* ---------- 相册 ---------- */
const ALBUM_REMOTE_BASE='https://birdimage.kdns.fr/PicGo/watanare/';
const ALBUM_MANIFEST_URL=ALBUM_REMOTE_BASE+'manifest.json';
const ALBUM_CACHE_KEY='wn:album-manifest:v2';
const ALBUM_TIMEOUT_MS=5000, ALBUM_MAX_ITEMS=500;
const ALBUM_INFO={source:'none',revision:'',error:'',loading:false,checkedAt:0};
let ALBUM=null, ALBUM_LOAD=null, ALBUM_REFRESH=null, VIEW={list:[],i:0};
function albumErrorText(error){
  return String(error&&error.message||error||'相册清单读取失败').replace(/\s+/g,' ').trim().slice(0,180);
}
function albumHttpsUrl(value,base='',restrictBase=''){
  const text=String(value||'').trim(); if(!text) return '';
  let url;
  try{ url=base ? new URL(text,base) : new URL(text); }catch(_){ return ''; }
  if(url.protocol!=='https:' || url.username || url.password) return '';
  if(restrictBase){
    let root; try{ root=new URL(restrictBase); }catch(_){ return ''; }
    if(url.origin!==root.origin || !url.pathname.startsWith(root.pathname)) return '';
  }
  url.hash=''; return url.href;
}
function safeAlbumKey(value){
  const key=String(value||'').trim();
  return !!key && key.length<=80 && !['__proto__','prototype','constructor'].includes(key);
}
function albumManifestCandidates(name,aliases){
  if(typeof roleNameCandidates==='function') return roleNameCandidates(name,aliases);
  const raw=String(name||'').trim(),out=raw?[raw]:[];
  if(!obj(aliases)||!raw) return out;
  if(own(aliases,raw)&&String(aliases[raw]||'').trim()) out.push(String(aliases[raw]).trim());
  Object.entries(aliases).forEach(([alias,target])=>{if(String(target||'').trim()===raw)out.push(String(alias).trim());});
  return [...new Set(out)];
}
function normalizeAlbumManifest(raw,{remote=false}={}){
  if(!obj(raw)) throw new Error('相册清单不是对象');
  const revision=typeof raw.revision==='string'?raw.revision.trim():'';
  if(remote && (raw.schema!==2 || !/^\d{4}-\d{2}-\d{2}-\d{2}$/.test(revision)))
    throw new Error('远端相册清单版本无效');
  const base=raw.base ? albumHttpsUrl(raw.base):'';
  if(remote && base!==ALBUM_REMOTE_BASE) throw new Error('远端相册根地址不匹配');
  if(!obj(raw.头像)) throw new Error('相册清单缺少头像表');
  const restrict=remote?ALBUM_REMOTE_BASE:'';
  const normalized={base,头像:{},头像别名:{}};
  if(remote){ normalized.schema=2; normalized.revision=revision; }
  for(const [name,srcValue] of Object.entries(raw.头像)){
    if(!safeAlbumKey(name)){ if(remote) throw new Error('远端头像角色名无效'); else continue; }
    const src=albumHttpsUrl(srcValue,base,restrict);
    if(!src){ if(remote) throw new Error('远端头像链接无效：'+name); else continue; }
    normalized.头像[name]=src;
  }
  if(raw.头像别名!=null&&!obj(raw.头像别名)) throw new Error('相册头像别名表无效');
  for(const [alias,targetValue] of Object.entries(obj(raw.头像别名)?raw.头像别名:{})){
    const target=String(targetValue||'').trim();
    if(!safeAlbumKey(alias)||!safeAlbumKey(target)||alias===target||!own(normalized.头像,target)){
      if(remote) throw new Error('远端头像别名无效：'+alias); else continue;
    }
    normalized.头像别名[alias]=target;
  }
  let total=0;
  for(const [name,value] of Object.entries(raw)){
    if(['schema','revision','base','头像','头像别名','manifest'].includes(name) || !Array.isArray(value)) continue;
    if(!safeAlbumKey(name)){ if(remote) throw new Error('远端相册分册名无效'); else continue; }
    if(value.length>ALBUM_MAX_ITEMS) throw new Error('单个相册分册图片过多');
    const items=[];
    for(const item of value){
      if(!obj(item)){ if(remote) throw new Error('远端相册条目无效'); else continue; }
      const src=albumHttpsUrl(item.src,base,restrict);
      if(!src){ if(remote) throw new Error('远端相册图片链接无效：'+name); else continue; }
      const next={src,title:typeof item.title==='string'?item.title.slice(0,120):'',
        hint:typeof item.hint==='string'?item.hint.slice(0,240):''};
      const itemId=typeof item.id==='string'?item.id.trim():'';
      if(itemId && /^[a-z][a-z0-9-]{0,119}$/.test(itemId)) next.id=itemId;
      else if(remote) throw new Error('远端相册图片 ID 无效：'+name);
      if(own(item,'unlock')){
        if(!obj(item.unlock)){ if(remote) throw new Error('远端相册解锁条件无效'); else continue; }
        next.unlock=item.unlock;
      }
      items.push(next); total++;
      if(total>ALBUM_MAX_ITEMS) throw new Error('相册图片总数过多');
    }
    normalized[name]=items;
  }
  if(remote){
    const avatarNames=Object.keys(normalized.头像);
    if(!avatarNames.length || !Array.isArray(normalized.剧情)) throw new Error('远端相册缺少必要分册');
    for(const [name,value] of Object.entries(normalized)){
      if(name!=='剧情'&&Array.isArray(value)&&!albumManifestCandidates(name,normalized.头像别名).some(candidate=>own(normalized.头像,candidate)))
        throw new Error('远端相册分册缺少同名头像：'+name);
    }
  }
  return normalized;
}
async function fetchRemoteAlbum(){
  const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),ALBUM_TIMEOUT_MS);
  try{
    const response=await fetch(ALBUM_MANIFEST_URL,{method:'GET',mode:'cors',cache:'no-store',credentials:'omit',
      redirect:'error',referrerPolicy:'no-referrer',headers:{Accept:'application/json'},signal:controller.signal});
    if(!response.ok) throw new Error('图床返回 '+response.status);
    const text=await response.text();
    let parsed; try{ parsed=JSON.parse(text); }catch(_){ throw new Error('远端相册清单不是有效 JSON'); }
    return normalizeAlbumManifest(parsed,{remote:true});
  }catch(error){
    if(error&&error.name==='AbortError') throw new Error('图床连接超时');
    throw error;
  }finally{ clearTimeout(timer); }
}
function readCachedAlbum(){
  try{
    const stored=JSON.parse(localStorage.getItem(ALBUM_CACHE_KEY)||'null');
    if(!obj(stored) || stored.url!==ALBUM_MANIFEST_URL) return null;
    return normalizeAlbumManifest(stored.manifest,{remote:true});
  }catch(_){ try{ localStorage.removeItem(ALBUM_CACHE_KEY); }catch(__){} return null; }
}
function writeCachedAlbum(manifest){
  try{ localStorage.setItem(ALBUM_CACHE_KEY,JSON.stringify({url:ALBUM_MANIFEST_URL,
    fetchedAt:Date.now(),manifest})); }catch(_){}
}

function albumConditionMatches(condition){
  if(!obj(condition) || typeof condition.path!=='string' || !condition.path.trim()) return false;
  const knownOps=['exists','gte','lte','eq','contains','monthIn'];
  if(Object.keys(condition).some(key=>key!=='path'&&!knownOps.includes(key))) return false;
  const ops=knownOps.filter(op=>own(condition,op)); if(ops.length!==1) return false;
  const op=ops[0], expected=condition[op], hit=albumReadPath(condition.path);
  if(op==='exists') return typeof expected==='boolean' && (expected?hit.found:!hit.found);
  if(!hit.found) return false;
  const actual=hit.value;
  if(op==='monthIn'){
    if(!Array.isArray(expected)||!expected.length||expected.some(value=>
      !Number.isInteger(value)||value<1||value>12)||new Set(expected).size!==expected.length) return false;
    const match=String(actual||'').match(/(?:^|\D)(\d{1,2})月/);
    return !!match && expected.includes(Number(match[1]));
  }
  if(op==='gte'||op==='lte'){
    const numeric=value=>typeof value==='number'||(typeof value==='string'&&value.trim())?Number(value):NaN;
    const left=numeric(actual), right=numeric(expected);
    if(!Number.isFinite(left)||!Number.isFinite(right)) return false;
    return op==='gte'?left>=right:left<=right;
  }
  const scalar=value=>value==null||['string','number','boolean'].includes(typeof value);
  if(!scalar(actual)||!scalar(expected)) return false;
  if(op==='eq') return String(actual)===String(expected);
  return String(actual==null?'':actual).includes(String(expected==null?'':expected));
}
function albumReadPath(path){
  const raw=String(path||'').trim(),direct=readPath(S.stat,raw);
  if(direct.found) return direct;
  const match=/^角色\.([^\.]+)\.(.+)$/u.exec(raw);
  if(!match||typeof roleVariableKey!=='function') return direct;
  const key=roleVariableKey(match[1]);
  return key&&key!==match[1]?readPath(S.stat,'角色.'+key+'.'+match[2]):direct;
}
function albumUnlockMatches(unlock,depth=0){
  if(!obj(unlock)||depth>6) return false;
  const modes=['all','any'].filter(mode=>own(unlock,mode));
  if(modes.length){
    if(modes.length!==1 || Object.keys(unlock).length!==1 || !Array.isArray(unlock[modes[0]]) || !unlock[modes[0]].length) return false;
    return modes[0]==='all'
      ? unlock.all.every(condition=>albumUnlockMatches(condition,depth+1))
      : unlock.any.some(condition=>albumUnlockMatches(condition,depth+1));
  }
  return albumConditionMatches(unlock);
}

function albumRoleAtMax(folder){

function albumUnlockLeaves(unlock,out=[]){

  if(modes.length===1 && Object.keys(unlock).length===1 && Array.isArray(unlock[modes[0]])){

function albumProgressText(item,folder){
  const labels={情感倾向:'情感',信任程度:'信任',亲密程度:'亲密',性吸引力:'吸引'};
  const parts=[];
  for(const condition of albumUnlockLeaves(item&&item.unlock)){
    if(!obj(condition)||typeof condition.path!=='string') continue;
     const hit=albumReadPath(condition.path), field=condition.path.split('.').pop();
    if(own(condition,'gte')&&own(labels,field)){
      const current=hit.found&&Number.isFinite(Number(hit.value))?Math.floor(Number(hit.value)):0;
      parts.push(labels[field]+' '+current+'/'+condition.gte);
    }else if(own(condition,'eq')&&field==='联系方式'&&condition.eq===true){
      parts.push(hit.found&&hit.value===true?'已交换联系方式':'尚未交换联系方式');

      parts.push('当前 '+current+'，需 '+condition.monthIn.join('、')+'月');

  return [...new Set(parts)].slice(0,4).join(' · ');

let ALBUM_UNLOCK_QUEUE=Promise.resolve();
function syncAlbumUnlocks(manifest){
  const run=async()=>{
    if(!obj(S.store)) return false;
    const man=manifest||await loadAlbum(), ids=[];
    for(const [folder,items] of Object.entries(man||{})){
      if(folder==='base'||folder==='头像'||!Array.isArray(items)) continue;
      for(const item of items){
        const id=albumItemId(item);
        if(!id||albumItemRemembered(item)) continue;
        if(albumRoleAtMax(folder)||cgConditionUnlocked(item)) ids.push(id);
      }
    }
    if(!ids.length) return false;
    try{
      await mutStore(st=>{
        st.albumUnlocked=obj(st.albumUnlocked)?st.albumUnlocked:Object.create(null);
        ids.forEach(id=>{ st.albumUnlocked[id]=true; });
      });
      return true;
    }catch(error){
      /* 写入失败时仍按实时条件显示，后续刷新会再次尝试永久保存。 */
      console.warn('[WN] album unlock persist',error);

    }

}
