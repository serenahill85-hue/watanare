/* ---------- 日程与约定提醒 ---------- */
function scheduleBuildParts(year,month,day){
  year=Number(year); month=Number(month); day=Number(day);
  if(!Number.isInteger(year)||year<1||!Number.isInteger(month)||month<1||month>12||!Number.isInteger(day)||day<1) return null;
  const d=new Date(Date.UTC(year,month-1,day));
  if(d.getUTCFullYear()!==year||d.getUTCMonth()!==month-1||d.getUTCDate()!==day) return null;
  return {year,month,day};
}
function scheduleDateTokenMatches(value){
  const text=String(value||'').trim(), out=[];
  const re=/(?:(\d{4})\s*(?:年|[\/.\-]))?\s*(\d{1,2})\s*(?:月|[\/.\-])\s*(\d{1,2})\s*日?/gu;
  let m;
  while((m=re.exec(text))){
    out.push({year:m[1]?Number(m[1]):0,month:Number(m[2]),day:Number(m[3]),explicitYear:!!m[1]});
    if(!m[0]) re.lastIndex++;
  }
  return out;
}
function scheduleDateParts(value){
  const token=scheduleDateTokenMatches(value).find(item=>item.explicitYear);
  return token?scheduleBuildParts(token.year,token.month,token.day):null;
}
function scheduleDateKey(parts){ return parts?`${parts.year}-${String(parts.month).padStart(2,'0')}-${String(parts.day).padStart(2,'0')}`:''; }
function schedulePartsFromKey(key){
  const m=String(key||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?scheduleBuildParts(Number(m[1]),Number(m[2]),Number(m[3])):null;
}
function scheduleDayIndex(parts){ return parts?Math.floor(Date.UTC(parts.year,parts.month-1,parts.day)/86400000):NaN; }
function scheduleShiftDays(parts,delta){
  if(!parts) return null;
  const d=new Date(Date.UTC(parts.year,parts.month-1,parts.day+Number(delta||0)));
  return scheduleBuildParts(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());
}
function scheduleDaysInMonth(year,month){ return new Date(Date.UTC(year,month,0)).getUTCDate(); }
function scheduleNowParts(){
  const world=S.stat.世界||{};
  return scheduleDateParts(world.日期||'');
}
function scheduleResolveToken(token,now,anchor,preferFuture=false){
  if(!token) return null;
  if(token.explicitYear) return scheduleBuildParts(token.year,token.month,token.day);
  const base=anchor||now; if(!base) return null;
  let result=scheduleBuildParts(base.year,token.month,token.day); if(!result) return null;
  if(anchor){
    if(scheduleDayIndex(result)<scheduleDayIndex(anchor)) result=scheduleBuildParts(base.year+1,token.month,token.day);
    return result;
  }
  if(now&&preferFuture&&scheduleDayIndex(result)<scheduleDayIndex(now)) result=scheduleBuildParts(base.year+1,token.month,token.day);
  return result;
}
function scheduleRangeParts(text,now,preferFuture=false){
  const sameMonth=String(text||'').match(/(?:(\d{4})\s*年\s*)?(\d{1,2})\s*月\s*(\d{1,2})\s*日?\s*(?:至|到|—|–|~|～|-)\s*(?:(\d{4})\s*年\s*)?(?:(\d{1,2})\s*月\s*)?(\d{1,2})\s*日?/u);
  if(sameMonth){
    const start=scheduleResolveToken({year:sameMonth[1]?Number(sameMonth[1]):0,month:Number(sameMonth[2]),day:Number(sameMonth[3]),explicitYear:!!sameMonth[1]},now,null,preferFuture);
    if(!start) return null;
    const endYear=sameMonth[4]?Number(sameMonth[4]):start.year;
    const endMonth=sameMonth[5]?Number(sameMonth[5]):start.month;
    let end=scheduleBuildParts(endYear,endMonth,Number(sameMonth[6]));
    if(!end) return null;
    if(!sameMonth[4] && scheduleDayIndex(end)<scheduleDayIndex(start)) end=scheduleBuildParts(start.year+1,endMonth,Number(sameMonth[6]));
    return end?{start,end}:null;
  }
  const tokens=scheduleDateTokenMatches(text); if(!tokens.length) return null;
  const start=scheduleResolveToken(tokens[0],now,null,preferFuture); if(!start) return null;
  let end=start;
  if(tokens.length>1) end=scheduleResolveToken(tokens[1],now,start);
  if(!end) return null;
  if(scheduleDayIndex(end)<scheduleDayIndex(start)) return {start:end,end:start};
  return {start,end};
}
function scheduleDeadline(deadline,status=''){
  const text=String(deadline||'').trim(); if(!text||/^(无|暂无|待定|未定)$/u.test(text)) return null;
  const now=scheduleNowParts(); let range=null;
  const relativeRange=text.match(/^(今天|今日|本日)\s*(?:至|到|—|–|~|～|-)\s*(明天|后天)$/u);
  if(relativeRange&&now){
    const offset=relativeRange[2]==='后天'?2:1;
    range={start:now,end:scheduleShiftDays(now,offset)};
  }else if(/^(今天|今日|本日)/u.test(text)&&now){ range={start:now,end:now};
  }else if(/^明天/u.test(text)&&now){ const d=scheduleShiftDays(now,1); range={start:d,end:d};
  }else if(/^后天/u.test(text)&&now){ const d=scheduleShiftDays(now,2); range={start:d,end:d};
  }else range=scheduleRangeParts(text,now,status==='进行中');
  if(!range||!range.start||!range.end) return null;
  const currentIndex=scheduleDayIndex(now), startIndex=scheduleDayIndex(range.start), endIndex=scheduleDayIndex(range.end);
  const diff=Number.isFinite(currentIndex)?endIndex-currentIndex:NaN;
  const time=(text.match(/(?:^|\s)(\d{1,2})\s*[:：]\s*(\d{2})/)||[]);
  const timeText=time.length?`${String(Number(time[1])).padStart(2,'0')}:${time[2]}`:'';
  return {parts:range.end,key:scheduleDateKey(range.end),start:range.start,end:range.end,
    startKey:scheduleDateKey(range.start),endKey:scheduleDateKey(range.end),startIndex,endIndex,diff,time:timeText,label:text};
}
function scheduleRows(){
  const pacts=get(S.stat,'世界.约定',{}); if(!obj(pacts)) return [];
  const now=scheduleNowParts(), nowIndex=scheduleDayIndex(now);
  return Object.entries(pacts).filter(([,p])=>obj(p)).map(([name,p])=>{
    const status=String(p.状态||'悬置'), due=scheduleDeadline(p.期限,status); let state='done';
    if(status==='进行中'){
      if(!due) state='open';
      else if(!Number.isFinite(due.diff)) state='future';
      else if(due.diff<0) state='overdue';
      else if(due.diff===0) state='today';
      else if(Number.isFinite(nowIndex)&&due.startIndex<=nowIndex&&nowIndex<due.endIndex) state='ongoing';
      else if(due.diff===1) state='soon';
      else state='future';
    }
    const label=state==='today'?'今天到期':state==='soon'?'明天到期':state==='overdue'?'已逾期':state==='ongoing'?'进行中':status;
    return {name,p,status,due,state,label};
  }).sort((a,b)=>{
    const order={ongoing:0,today:1,overdue:2,soon:3,future:4,open:5,done:6};
    const ad=a.due&&Number.isFinite(a.due.diff)?a.due.diff:9999, bd=b.due&&Number.isFinite(b.due.diff)?b.due.diff:9999;
    return (order[a.state]??9)-(order[b.state]??9)||ad-bd||a.name.localeCompare(b.name,'zh-CN');
  });
}
function scheduleRowsForDay(rows,key){
  const parts=schedulePartsFromKey(key), index=scheduleDayIndex(parts); if(!Number.isFinite(index)) return [];
  return rows.filter(row=>row.due&&row.due.startIndex<=index&&index<=row.due.endIndex);
}
const SCHEDULE_JP_HOLIDAY_CACHE=new Map();
function scheduleNthMonday(year,month,nth){
  const first=new Date(Date.UTC(year,month-1,1));
  return 1+((1-first.getUTCDay()+7)%7)+(nth-1)*7;

function scheduleEquinoxDay(year,spring){
  if(year<1980||year>2099) return 0;

  return Math.floor(base+0.242194*(year-1980)-Math.floor((year-1980)/4));

function scheduleJapanHolidays(year){
  year=Math.trunc(Number(year));
  if(SCHEDULE_JP_HOLIDAY_CACHE.has(year)) return SCHEDULE_JP_HOLIDAY_CACHE.get(year);
  const holidays=new Map();
  SCHEDULE_JP_HOLIDAY_CACHE.set(year,holidays);
  if(year<2000||year>2099) return holidays;
  const putParts=(parts,name)=>{ const key=scheduleDateKey(parts); if(key) holidays.set(key,name); };
  const put=(month,day,name)=>putParts(scheduleBuildParts(year,month,day),name);
  put(1,1,'元旦');
  put(1,scheduleNthMonday(year,1,2),'成人节');
  put(2,11,'建国纪念日');
  if(year>=2020) put(2,23,'天皇诞辰');
  else if(year<=2018) put(12,23,'天皇诞辰');

  if(year>=2007) put(5,4,'绿之日');

  if(year===2020) put(7,23,'海之日');
  else if(year===2021) put(7,22,'海之日');

  if(year>=2016){
    if(year===2020) put(8,10,'山之日');
    else if(year===2021) put(8,8,'山之日');
    else put(8,11,'山之日');
  }
  put(9,year>=2003?scheduleNthMonday(year,9,3):15,'敬老节');
  put(9,scheduleEquinoxDay(year,false),'秋分日');
  if(year===2020) put(7,24,'体育节');
  else if(year===2021) put(7,23,'体育节');
  else put(10,scheduleNthMonday(year,10,2),'体育节');
  put(11,3,'文化节');
  put(11,23,'劳动感谢节');
  if(year===2019){
    put(5,1,'天皇即位日');
    put(10,22,'即位礼正殿之仪');
  }
  for(const key of [...holidays.keys()].sort()){
    const parts=schedulePartsFromKey(key), middle=scheduleShiftDays(parts,1), after=scheduleShiftDays(parts,2);
    if(!middle||!after||new Date(Date.UTC(middle.year,middle.month-1,middle.day)).getUTCDay()===0) continue;
    const middleKey=scheduleDateKey(middle), afterKey=scheduleDateKey(after);
    if(!holidays.has(middleKey)&&holidays.has(afterKey)) holidays.set(middleKey,'国民假日');
  }
  for(const key of [...holidays.keys()].sort()){
    const parts=schedulePartsFromKey(key);
    if(!parts||new Date(Date.UTC(parts.year,parts.month-1,parts.day)).getUTCDay()!==0) continue;
    let next=scheduleShiftDays(parts,1);
    while(next&&holidays.has(scheduleDateKey(next))) next=scheduleShiftDays(next,1);
    if(next) holidays.set(scheduleDateKey(next),'振替休日');
  }

}
function scheduleHolidayName(parts){

function scheduleEventTone(name){

function scheduleMonthCells(year,month){

  const weeks=Math.ceil((offset+scheduleDaysInMonth(year,month))/7);
  return Array.from({length:weeks*7},(_,i)=>{ const d=new Date(base.getTime()+i*86400000); return scheduleBuildParts(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); });
}
function scheduleWeekHtml(cells,weekIndex,rows,todayKey,selectedKey){
  const week=cells.slice(weekIndex*7,weekIndex*7+7), weekStart=scheduleDayIndex(week[0]), weekEnd=scheduleDayIndex(week[6]);
  const dayHtml=week.map((parts,col)=>{
    const key=scheduleDateKey(parts), outside=parts.month!==SCHEDULE_VIEW.month, holiday=scheduleHolidayName(parts);
    const dayRows=scheduleRowsForDay(rows,key), classes=['sched-day'];
    if(outside) classes.push('outside'); if(col===0) classes.push('sunday'); if(col===6) classes.push('saturday');
    if(holiday) classes.push('holiday');
    if(key===todayKey) classes.push('current'); if(key===selectedKey) classes.push('selected');
    const names=dayRows.slice(0,3).map(row=>row.name).join('、');
    const aria=`${parts.year}年${parts.month}月${parts.day}日${holiday?'，'+holiday:''}${names?'，'+names:''}`;
    const holidayHtml=holiday?`<span class="hd" title="${esc(holiday)}">${esc(holiday)}</span>`:'';
    return `<button type="button" class="${classes.join(' ')}" aria-label="${esc(aria)}" onclick="WN.scheduleSelect('${key}')"><span class="n num">${parts.day}</span>${holidayHtml}</button>`;
  }).join('');
  const candidates=rows.filter(row=>row.due&&row.due.startIndex<=weekEnd&&row.due.endIndex>=weekStart)
    .map(row=>({row,start:Math.max(row.due.startIndex,weekStart),end:Math.min(row.due.endIndex,weekEnd)}))
    .sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start)||a.row.name.localeCompare(b.row.name,'zh-CN'));
  const laneEnds=[-Infinity,-Infinity], visible=[], hidden=[];
  for(const item of candidates){
    const lane=laneEnds.findIndex(end=>item.start>end);
    if(lane<0){ hidden.push(item); continue; }
    laneEnds[lane]=item.end; visible.push({...item,lane});
  }
  const eventHtml=visible.map(item=>{
    const row=item.row, left=item.start-weekStart+1, right=item.end-weekStart+2;
    const classes=['sched-event',scheduleEventTone(row.name),row.state];
    if(row.due.startIndex!==row.due.endIndex) classes.push('multi');
    if(row.due.startIndex<weekStart) classes.push('cont-left'); if(row.due.endIndex>weekEnd) classes.push('cont-right');
    return `<span class="${classes.join(' ')}" style="grid-column:${left}/${right};grid-row:${item.lane+1}" aria-hidden="true">${esc(row.name)}</span>`;
  }).join('');
  return `<section class="sched-week"><div class="sched-days">${dayHtml}</div><div class="sched-events">${eventHtml}</div>${hidden.length?`<span class="sched-week-more">+${hidden.length}</span>`:''}</section>`;
}

async function syncScheduleReminders(){

        if(own(st.schedule.seen,sig)) continue;
        st.schedule.seen[sig]=1; fresh.push(row);
      }
    });
    for(const row of fresh){
      const when=row.state==='overdue'?'已逾期':row.state==='today'?'今天到期':'明天到期';
      await pushNote('schedule',`${row.name} · ${when}`,String(row.p.内容||'').slice(0,70),{key:row.name});

  finally{ scheduleSyncBusy=false; }
}

    </span><span class="pull-label">${campusBusy?'正在刷新':'下拉刷新'}</span></div>`;

function setCampusPull(offset,ready){
  const el=$id('campus-pull'); if(!el||campusBusy) return;
  const y=clamp(Number(offset)||0,0,88);
  const progress=Math.min(1,y/62);
  el.style.transform=`translateY(${y}px)`; el.style.marginBottom=`${y}px`; el.style.opacity=String(Math.min(1,y/28));
  el.style.setProperty('--pull-angle',`${Math.round(progress*180)}deg`);
  el.style.setProperty('--pull-scale',String(.82+progress*.18));
  el.classList.toggle('ready',!!ready);
  const label=el.querySelector('.pull-label'); if(label) label.textContent=ready?'松开刷新':'下拉刷新';
}
function bindCampusPull(box){
  if(!box||box.dataset.wnPullBound) return;
  box.dataset.wnPullBound='1';
  let pull=null;
  box.addEventListener('touchstart',e=>{
    if(campusBusy||box.scrollTop>0||e.touches.length!==1){ pull=null; return; }
    const t=e.touches[0]; pull={x:t.clientX,y:t.clientY,mode:'pending',offset:0};
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!pull||e.touches.length!==1) return;
    const t=e.touches[0], dx=t.clientX-pull.x, dy=t.clientY-pull.y;
    if(pull.mode==='pending'){
      if(Math.hypot(dx,dy)<8) return;
      if(dy<=0||Math.abs(dx)>=Math.abs(dy)*.9){ pull=null; setCampusPull(0,false); return; }
      pull.mode='pull';
    }
    if(pull.mode!=='pull'||box.scrollTop>0) return;
    e.preventDefault();
    pull.offset=Math.min(88,Math.max(0,dy)*.55); setCampusPull(pull.offset,pull.offset>=62);
  },{passive:false});
  const finish=()=>{
    if(!pull) return;
    const ready=pull.mode==='pull'&&pull.offset>=62; pull=null; setCampusPull(0,false);
    if(ready) WN.pullRefreshCampus();
  };
  box.addEventListener('touchend',finish,{passive:true});
  box.addEventListener('touchcancel',finish,{passive:true});
}

/* ---------- 世界书控制器 ---------- */
const WB_SYSTEM_CATEGORY='通用与系统';
const WB_SUB_ORDER=['角色','剧情','家庭','地点','规则','世界观','未分类'];
function wbCategories(){
  const counts=new Map();
  for(const entry of (S.wb&&Array.isArray(S.wb.entries)?S.wb.entries:[])){
    const category=wbCategoryOf(entry);
    counts.set(category,(counts.get(category)||0)+1);
  }
  return [
    ...phoneWorldbookWorkEntries().map(([work])=>phoneWorkLabel(work)||work),
    WB_SYSTEM_CATEGORY,
  ].filter(category=>counts.has(category));
}
const WB_PROTECTED=new Set((Array.isArray(PHONE_WORK_CATALOG.worldbookPolicies)?PHONE_WORK_CATALOG.worldbookPolicies:[])
  .filter(policy=>policy&&policy.protected===true)
  .map(policy=>String(policy.comment||'').trim()).filter(Boolean));
const WB_DEFAULT_OFF_SUFFIXES=(Array.isArray(PHONE_WORK_CATALOG.defaultOffSuffixes)?PHONE_WORK_CATALOG.defaultOffSuffixes:[])
  .map(value=>String(value||'').trim()).filter(Boolean);
const WB_DEFAULT_OFF_SUFFIX_RE=new RegExp('[（(](?:'+WB_DEFAULT_OFF_SUFFIXES.map(value=>value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')[^）)]*[）)]\\s*$','u');
function wbRoleTokens(){
  const out=[];
  for(const [,meta] of phoneWorkEntries()){
    const aliases=meta&&meta.characterAliases;
    if(!obj(aliases)) continue;
    Object.entries(aliases).forEach(([canonical,values])=>{
      [canonical,...(Array.isArray(values)?values:[values])].forEach(value=>{
        const token=String(value||'').trim(); if(token.length>=2) out.push(token);
      });
    });
  }
  return [...new Set(out)].sort((a,b)=>b.length-a.length);
}
function wbCategoryOf(entry){
  const name=String(entry&&entry.name||'');
  for(const [work,meta] of phoneWorkEntries()){
    if(meta&&meta.worldbookPrefix&&name.includes(String(meta.worldbookPrefix))) return phoneWorkLabel(work)||work;
  }
  return WB_SYSTEM_CATEGORY;
}
function wbBaseName(entry){
  let name=String(entry&&entry.name||'').trim().replace(/^\[mvu_(?:plot|update)\]/,'');
  for(const prefix of [...phoneWorkEntries().map(([,meta])=>String(meta&&meta.worldbookPrefix||'')),String(PHONE_WORK_CATALOG.sharedWorldbookPrefix||'[RULE]')]){
    if(prefix&&name.startsWith(prefix)){name=name.slice(prefix.length);break;}
  }
  return name.replace(WB_DEFAULT_OFF_SUFFIX_RE,'').trim();
}
function wbSubCategoryOf(entry){
  const base=wbBaseName(entry);
  if(/^\[(?:剧情细纲|剧情年表|细纲使用说明)\]/.test(base)) return '剧情';
  if(/^\[人设\]|语料|^角色速览|角色经历/.test(base)) return '角色';
  if(/^家庭/.test(base)) return '家庭';
  if(/^(?:地点|地图)/.test(base)) return '地点';
  if(/^规则/.test(base)) return '规则';
  if(/世界观|故事基调|叙事|关系介入|百合破坏/.test(base)) return '世界观';
  if(wbRoleTokens().some(token=>base.includes(token))) return '角色';
  return '未分类';
}
function wbIsWorkCategory(category){
  return phoneWorldbookWorkEntries().some(([work])=>(phoneWorkLabel(work)||work)===category);
}
function wbDefaultOff(entry){return WB_DEFAULT_OFF_SUFFIX_RE.test(String(entry&&entry.name||'').trim());}
function wbProtected(entry){
  const full=String(entry&&entry.name||'').trim();
  return WB_PROTECTED.has(wbBaseName(entry))||WB_PROTECTED.has(full);
}
function wbStrategyLabel(entry){
  return ({constant:'常驻',selective:'关键词',vectorized:'向量'})[entry&&entry.strategy]||'条目';
}
function normalizeWorldbookState(data){
  const entries=[];
  for(const raw of (data&&Array.isArray(data.entries)?data.entries:[])){
    if(!obj(raw)||!Number.isFinite(Number(raw.uid))) continue;
    entries.push({uid:Number(raw.uid),name:String(raw.name||'未命名条目').slice(0,300),enabled:raw.enabled===true,
      content:String(raw.content||''),strategy:String(raw.strategy||''),keys:Array.isArray(raw.keys)?raw.keys.map(String).slice(0,80):[],
      probability:clamp(num(raw.probability),0,100)});
  }
  return {name:String(data&&data.name||''),entries};
}
function wbMatches(entry,category){
  const wb=S.wb;
  if(category&&wbCategoryOf(entry)!==category) return false;
  if(wb.filter==='enabled'&&!entry.enabled) return false;
  if(wb.filter==='disabled'&&entry.enabled) return false;
  const q=String(wb.query||'').trim().toLocaleLowerCase();
  if(!q) return true;
  return [entry.name,(entry.keys||[]).join(' '),entry.content].join('\n').toLocaleLowerCase().includes(q);
}
function wbToolsHtml(){
  const wb=S.wb;
  const workControl=(work,prefix,label)=>{const entries=wb.entries.filter(entry=>entry.name.includes(prefix)),base=entries.filter(entry=>!wbDefaultOff(entry)),on=base.filter(entry=>entry.enabled).length,all=base.length>0&&on===base.length,partial=on>0&&!all,independent=entries.length-base.length,busy=wb.loading||S.wbWorkBusy===work;return `<div class="wb-work"><span class="wb-work-copy"><b>${label}</b><span>${on} / ${base.length} 条基础条目开启${partial?' · 部分':''}${independent?' · '+independent+' 条独立控制':''}</span></span><button class="wb-switch ${all?'on':''}" ${busy||!base.length?'disabled':''} onclick="WN.wbWorkToggle('${work}',${all?'false':'true'},this)" role="switch" aria-checked="${all?'true':'false'}" aria-label="${all?'关闭':'开启'}${label}基础世界书"></button></div>`};
  const workControls=phoneWorldbookWorkEntries().map(([work,meta])=>workControl(phoneWorkId(work),String(meta&&meta.worldbookPrefix||''),phoneWorkLabel(work)||work)).join('');
  return `<div class="wb-tools"><input class="wb-search" type="search" value="${esc(wb.query)}" placeholder="搜索全部条目" aria-label="搜索全部世界书条目" oninput="WN.wbSearch(this.value)">
    <div class="wb-work-controls">${workControls}</div>
    <div class="wb-seg" aria-label="条目状态筛选">
      <button class="${wb.filter==='all'?'on':''}" onclick="WN.wbFilter('all')">全部</button>
      <button class="${wb.filter==='enabled'?'on':''}" onclick="WN.wbFilter('enabled')">已开启</button>
      <button class="${wb.filter==='disabled'?'on':''}" onclick="WN.wbFilter('disabled')">已关闭</button>
    </div></div>`;
}
function wbEntryRow(entry,showCategory){
  const category=wbCategoryOf(entry), locked=wbProtected(entry), busy=S.wbBusy.has(entry.uid);
  return `<div class="wb-entry">
    <button class="go" ${keyAttrs('wb-entry',String(entry.uid))}><span class="nm">${esc(entry.name)}</span>
      <span class="sub">${showCategory?esc(category)+' · ':''}${esc(wbStrategyLabel(entry))}${entry.keys.length?' · '+entry.keys.length+' 个关键词':''}</span></button>
    ${locked?'<span class="wb-lock">受保护</span>':`<button class="wb-switch ${entry.enabled?'on':''}" ${busy?'disabled':''}
      ${keyAttrs('wb-toggle',String(entry.uid))} data-wn-enable="${entry.enabled?'0':'1'}" role="switch" aria-checked="${entry.enabled?'true':'false'}"

function activeWorldbookCategory(){
  const active=$id(S.stack[S.stack.length-1]);
  if(!active||active.dataset.wnView!=='wb-category') return null;
  const category=keyFromToken(active.dataset.wnCategory); return category===undefined?null:category;
}
function paintWorldbookResults(category,root){
  const active=root||$id(S.stack[S.stack.length-1]);
  const box=active&&active.querySelector('[data-wb-results]'); if(!box) return;
  const wb=S.wb;
  if(wb.loading){ box.innerHTML='<div class="empty">正在读取当前角色的主世界书…</div>'; return; }
  if(wb.error){ box.innerHTML=`<div class="empty">${esc(wb.error)}<br><button class="refresh" onclick="WN.wbReload()">重新读取</button></div>`; return; }
  if(!wb.loaded){ box.innerHTML='<div class="empty">尚未读取世界书</div>'; return; }
  const searchMode=!!String(wb.query||'').trim()||wb.filter!=='all';
  if(!category&&!searchMode){
    const categories=wbCategories();
    box.innerHTML=categories.length?categories.map(name=>{
      const all=wb.entries.filter(entry=>wbCategoryOf(entry)===name);
      const enabled=all.filter(entry=>entry.enabled).length;
      return `<div class="wb-cat"><button class="go" ${keyAttrs('wb-category',name)}><span class="nm">${esc(name)}</span>
        <span class="sub">${enabled} 条开启</span></button><span class="wb-count num">${enabled} / ${all.length}</span></div>`;
    }).join(''):'<div class="empty">当前主世界书没有可浏览的分类</div>';
    return;
  }
  const scope=String(wb.query||'').trim()?null:category;
  const entries=wb.entries.filter(entry=>wbMatches(entry,scope));
  if(!entries.length){ box.innerHTML='<div class="empty">没有符合条件的条目</div>'; return; }
  if(scope&&wbIsWorkCategory(scope)){
    box.innerHTML=wbGroupedWorldbookRows(entries);
  }else{
    box.innerHTML=entries.map(entry=>wbEntryRow(entry,!scope)).join('');
  }
}
function wbGroupedWorldbookRows(entries){
  const groups=new Map(WB_SUB_ORDER.map(name=>[name,[]]));
  for(const entry of entries){
    const sub=wbSubCategoryOf(entry);
    const list=groups.get(sub);
    if(list) list.push(entry);
    else groups.set(sub,[entry]);
  }
  let html='';
  for(const [sub,list] of groups){
    if(!list.length) continue;
    const enabled=list.filter(entry=>entry.enabled).length;
    html+=`<div class="wb-group"><div class="wb-group-h"><span>${esc(sub)}</span><span class="num">${enabled} / ${list.length}</span></div>${list.map(entry=>wbEntryRow(entry,false)).join('')}</div>`;
  }

}

            data-wn-enable="${entry.enabled?'0':'1'}" role="switch" aria-checked="${entry.enabled?'true':'false'}"
            aria-label="${entry.enabled?'关闭':'开启'}${esc(entry.name)}"></button>`}</div>
      ${entry.keys.length?`<div class="wb-meta">关键词：${esc(entry.keys.join('、'))}</div>`:''}
      <pre class="wb-content">${esc(entry.content||'（空条目）')}</pre></div></div>`;
  });

};
WN.wbToggle=async function(uid,enable,opener){
  uid=Number(uid); const entry=S.wb.entries.find(item=>item.uid===uid);
  if(!entry||wbProtected(entry)||S.wbBusy.has(uid)) return;
  const want=enable===true;
  if(!want){
    const ok=await askConfirm('关闭世界书条目',`关闭「${entry.name}」后，所有使用主世界书「${S.wb.name}」的聊天都会受到影响。`,'关闭',opener);
    if(!ok) return;
  }
  if(!S.B||typeof S.B.setWorldbookEntryEnabled!=='function'){ toast('当前手机外壳不支持世界书写入'); return; }
  S.wbBusy.add(uid); paintWorldbookResults(activeWorldbookCategory());
  try{
    const data=normalizeWorldbookState(await S.B.setWorldbookEntryEnabled(uid,want));
    S.wb.name=data.name; S.wb.entries=data.entries; S.wb.loaded=true; S.wb.error='';
    toast(want?'条目已开启':'条目已关闭');
  }catch(e){ toast('世界书更新失败：'+String(e&&e.message||e||'写入错误')); }
  finally{
    S.wbBusy.delete(uid);
    const active=$id(S.stack[S.stack.length-1]);
    if(active&&active.dataset.wnView==='wb-detail'){
      const current=Number(active.dataset.wnUid); active.remove(); S.stack.pop(); WN.wbEntry(current);
    }else paintWorldbookResults(activeWorldbookCategory());
  }
};
WN.wbWorkToggle=async function(work,enable,opener){
  if(S.wbWorkBusy) return; const hit=phoneWorkMeta(work),label=hit&&(phoneWorkLabel(hit.name)||hit.name); if(!hit||!label||!phoneWorkHasPublishedContent(hit.meta)){toast(`${label||'该作品'}尚未发布世界书内容`);return;}
  const want=enable===true;
  if(!want){const ok=await askConfirm('关闭作品世界书',`将关闭「${label}」的全部世界书条目，所有使用主世界书「${S.wb.name}」的聊天都会受到影响。`,'全部关闭',opener);if(!ok)return;}
  if(!S.B||typeof S.B.setWorldbookWorkEnabled!=='function'){toast('当前手机外壳不支持作品世界书批量开关');return;}
  S.wbWorkBusy=work; const active=$id(S.stack[S.stack.length-1]); if(active&&active.dataset.wnView==='wb-home')buildWorldbookSurface(active,'世界书',null);
  try{const data=normalizeWorldbookState(await S.B.setWorldbookWorkEnabled(work,want));S.wb.name=data.name;S.wb.entries=data.entries;S.wb.loaded=true;S.wb.error='';toast(want?`${label}世界书已恢复默认开启条目`:`${label}世界书已全部关闭`);}
  catch(e){toast('作品世界书更新失败：'+String(e&&e.message||e||'写入错误'));}
  finally{S.wbWorkBusy='';const now=$id(S.stack[S.stack.length-1]);if(now&&now.dataset.wnView==='wb-home')buildWorldbookSurface(now,'世界书',null);else paintWorldbookResults(activeWorldbookCategory());}
};

          <p><b>我的头像</b>可从设备上传，上传后会同时显示在手机名片、动态和正文中的玩家对话旁；图片只保存在当前浏览器，点“恢复”即可改回名字占位。</p>

          <p><b>正文对话语言设置</b>默认中文；切到中日双语后，从下一次正文回复起，角色对话会同时生成日文与中文。旁白不受影响，固定开场白始终只保留中文。</p>

        </div></details>
      </div></div>`;

/* ---------- 设置 ---------- */
function remotePhoneNote(){
  const r=S.remote||{};
  if(!r.url) return '自动更新地址不可用，当前使用卡内界面';
  const ver=r.version||'当前版本';
  if(r.status==='checking') return '后台检查中…';
  if(r.status==='update-ready' && r.candidateVersion && r.candidateVersion!==r.version) return `发现远程 ${esc(r.candidateVersion)}，将在安全时应用`;
  if(r.source==='remote' && r.status==='ready') return `当前使用远程 ${esc(ver)}`;
  if(r.source==='cache') return `当前使用已验证缓存 ${esc(ver)}`;
  if(r.source==='embedded' && r.status==='ready') return `卡内界面 ${esc(ver)} 已是最新`;
  if(r.status==='error') return `检查失败，仍使用${r.source==='embedded'?'卡内':'当前'}界面`;
  if(r.status==='fallback') return `远程不可用，使用卡内 ${esc(ver)}`;
  return '等待后台检查';
}
function remotePhoneDetails(){
  const r=S.remote||{};
  if(!r.error) return '';
  return `；${esc(String(r.error).slice(0,90))}`;
}
async function syncRemotePhoneState(){
  try{ if(S.B && typeof S.B.getPhoneRemoteState==='function') S.remote=await S.B.getPhoneRemoteState(); }
  catch(_){ }
}
function paintRemotePhoneControls(){
  const note=$id('phone-remote-note'), button=$id('phone-remote-btn');
  if(note) note.innerHTML=remotePhoneNote()+remotePhoneDetails();
  if(button){
    const checking=S.remote&&S.remote.status==='checking';
    button.disabled=checking||!S.B||typeof S.B.checkPhoneRemote!=='function';
    button.setAttribute('aria-busy',checking?'true':'false');
    button.textContent=checking?'检查中':'手动检查';
  }
}
function normalizeDialogueLanguageState(data){
  const mode=data&&['zh','bilingual'].includes(data.mode)?data.mode:'';
  const entries=Array.isArray(data&&data.entries)?data.entries.filter(obj).map(entry=>({
    mode:String(entry.mode||''),uid:Number(entry.uid),name:String(entry.name||''),enabled:entry.enabled===true,
  })):[];
  return {mode,valid:data&&data.valid===true&&!!mode,loaded:true,loading:false,busy:false,error:'',
    name:String(data&&data.name||''),entries};
}
function dialogueLanguageNote(){
  const dl=S.dialogueLang;
  if(!S.B||typeof S.B.getDialogueLanguage!=='function'||typeof S.B.setDialogueLanguage!=='function')
    return '当前手机外壳不支持切换';
  if(dl.loading) return '正在读取当前主世界书…';
  if(dl.error) return dl.error;
  if(!dl.loaded) return '读取当前主世界书后显示';
  if(!dl.valid) return '正文对话格式状态异常，选择一种即可修复';
  return dl.mode==='bilingual'?'当前：中日双语对话':'当前：中文对话';
}
function paintDialogueLanguageControls(){
  const dl=S.dialogueLang, note=$id('dialogue-lang-note');
  if(note) note.textContent=dialogueLanguageNote();
  document.querySelectorAll('[data-dialogue-lang]').forEach(button=>{
    const mode=button.dataset.dialogueLang;
    button.classList.toggle('on',dl.valid&&dl.mode===mode);
    button.disabled=dl.loading||dl.busy||!S.B||typeof S.B.setDialogueLanguage!=='function';
    button.setAttribute('aria-pressed',String(dl.valid&&dl.mode===mode));
  });
}
async function syncDialogueLanguageState(force=false){
  const dl=S.dialogueLang;
  if(dl.loading||(!force&&dl.loaded)) return;
  if(!S.B||typeof S.B.getDialogueLanguage!=='function'){
    dl.loaded=true; dl.error='当前手机外壳不支持切换'; paintDialogueLanguageControls(); return;
  }
  dl.loading=true; dl.error=''; paintDialogueLanguageControls();
  try{ S.dialogueLang=normalizeDialogueLanguageState(await S.B.getDialogueLanguage()); }
  catch(e){ dl.loaded=true; dl.loading=false; dl.valid=false; dl.error='读取失败：'+String(e&&e.message||e||'未知错误').slice(0,100); }
  paintDialogueLanguageControls();
}

function enabledSmsRole(name){

function enabledSmsMembers(members){

async function moveSms(messageId){
  try{
    const r = await S.B.scanSms(messageId); /* 正常生成只读本轮楼层；无参数时扫描恢复窗口 */
    const list = Array.isArray(r) ? r : (r && r.sms) || [];
    const seeds = (!Array.isArray(r) && r && Array.isArray(r.seeds)) ? r.seeds : [];
    const groups = (!Array.isArray(r) && r && Array.isArray(r.groups)) ? r.groups : [];
    const win = (!Array.isArray(r) && r && r.window && Array.isArray(r.window.hashes)) ? r.window : null;
    /* 幽灵检测：已搬运、来源楼层仍在扫描窗口内、却不在当前时间线清单里 → 被 swipe/删楼撤回 */
    const isGhost = m => m && m.hash && typeof m.srcMid==='number'
      && win && m.srcMid>=win.from && m.srcMid<=win.to && win.hashes.indexOf(m.hash)<0;
    let hasGhost=false;
    if(win && S.store) Object.values(get(S.store,'line.threads',{})).some(th=>
      (th.msgs||[]).some(m=>{ if(isGhost(m)){ hasGhost=true; } return hasGhost; }));
    if(!list.length && !seeds.length && !groups.length && !hasGhost) return;
    const currentTD=nowTD();
    const {d}=currentTD;
    let added=0, purged=0;
    const arrivals=[];
    await mutStore(st=>{
      if(hasGhost) Object.entries(st.line.threads).forEach(([id,th])=>{
        const before=(th.msgs||[]).length;
        const removed=[];
        th.msgs=(th.msgs||[]).filter(m=>{
          if(isGhost(m)){ delete st.smsSeen[m.hash]; purged++; removed.push(num(m.seq)); return false; }
          return true;
        });
        if(th.msgs.length!==before){
          th.lastRead=Math.min(th.lastRead||0, th.msgs.filter(m=>m.dir!=='out').length);
          if(removed.length) invalidateContactMemo(st,id,Math.min(...removed));
        }
      });
      groups.forEach(g=>{                       /* <wn_group> 剧情内建群 */
        if(!g || !g.name || (g.hash && st.smsSeen[g.hash])) return;
        const members=enabledSmsMembers(g.members);
        if(!members.length) return;
        if(g.hash) st.smsSeen[g.hash]=1;
        const id=groupThreadId(g.name);
        if(!threadOf(id,st)){
          const th={type:'group',name:g.name,members:members.slice(0,8),msgs:[],lastRead:0};
          th.msgs.push({seq:++st.seq, sys:1, text:'你被拉进了群聊「'+g.name+'」', t:g.t||currentTD.t, d:g.d||d});
          st.line.threads[id]=th; added++;
        }
      });
      list.forEach(m=>{
        const from=enabledSmsRole(m&&m.from); if(!from) return;
        if(st.smsSeen[m.hash]) return;
        st.smsSeen[m.hash]=1;
        const th=threadOf(from,st)||(st.line.threads[from]={type:'dm',name:from,members:[from],msgs:[],lastRead:0});
        canonicalDmIdentity(th,from);
        /* 防回声：同线程近 20 条内已有同文来信则跳过 */
        if((th.msgs||[]).slice(-20).some(x=>x.dir!=='out' && !x.sys && x.text===m.text)) return;
        th.msgs.push({seq:++st.seq, dir:'in', from, text:m.text, t:m.t||currentTD.t, d:m.d||d,
          srcMid:(typeof m.srcMid==='number'?m.srcMid:undefined), hash:m.hash}); added++;
        arrivals.push({from, text:String(m.text||'')});
      });
      seeds.forEach(sd=>{
        if(sd && sd.hash && st.smsSeen[sd.hash]) return;
        if(sd && sd.hash) st.smsSeen[sd.hash]=1;
        st.seeds.push({话题:String(sd.话题||sd.topic||'').slice(0,40)});
      });
    });
    if(added||purged){ refreshBadges(); const cur=$id(S.stack[S.stack.length-1]);
      if(cur && cur.dataset.wnView==='thread'){
        const id=keyFromToken(cur.dataset.wnKey); if(id!==undefined) paintBubs(id);
      } }
    /* 剧情里发过来的新消息：不在该会话页面时提醒一次 */
    const byWho=new Map();
    arrivals.forEach(a=>{ const cur=byWho.get(a.from)||{n:0,last:''};
      byWho.set(a.from,{n:cur.n+1,last:a.text}); });
    for(const [who,info] of byWho){
      if(viewingThread(who)) continue;
      await pushNote('lime', who+' 发来'+(info.n>1?info.n+' 条消息':'消息'),
        info.last.slice(0,60), {key:who});
    }
  }catch(e){ console.warn('[WN] moveSms', e); }
}
let lastAutoTurn=-1;
function pickWeighted(list, n){
  const pool=list.slice(); const out=[];
  while(pool.length && out.length<n){
    const tot=pool.reduce((a,x)=>a+x.w,0);
    let r=Math.random()*tot, idx=0;
    for(let i=0;i<pool.length;i++){ r-=pool[i].w; if(r<=0){ idx=i; break; } }
    out.push(pool[idx].v); pool.splice(idx,1);
  }
  return out;
}
async function autoIncoming(turnId){
  if(!S.cfg.autoMsg || S.demo) return;
  if(turnId===lastAutoTurn) return;
  lastAutoTurn=turnId;
  if(Math.random()>0.3) return;                       /* 本轮手机安静 */
  const cands = charList().filter(([n,c])=>c && !c.在场 && c.联系方式);
  if(cands.length){
    const r=Math.random();
    const n = r<0.6?1 : r<0.9?2 : 3;                  /* 60% 一人、30% 两人、10% 三人 */
    const picks=pickWeighted(cands.map(([name,c])=>({v:name, w:Math.max(1,(num(c.情感倾向)+num(c.信任程度))/2+20)})), Math.min(n,cands.length));
    for(const name of picks){
      await mutStore(st=>{
        const th=threadOf(name,st)||(st.line.threads[name]={type:'dm',name,members:[name],msgs:[],lastRead:0});
        canonicalDmIdentity(th,name);
      });
      genReply(name,null,{proactive:true}).catch(()=>{}); /* genRaw 串行队列自会排队 */
    }
  }
  /* 角色发动态：额外 25% 机会，任一已交换联系方式者（在场也可发） */
  if(Math.random()<0.25){
    const all=charList().filter(([n,c])=>c && c.联系方式);
    if(all.length){
      const picks=pickWeighted(all.map(([n,c])=>({v:n, w:Math.max(1,(num(c.情感倾向)+num(c.信任程度))/2+20)})), 1);
      if(picks.length) autoCharMoment(picks[0]).catch(()=>{});
    }
  }
}

let memoBusy=false;
async function trackTurn(turnId){
  let watermark=null;
  await mutStore(st=>{
    if(turnId==null||st.lastTurn===turnId) return;
    st.lastTurn=turnId; st.digestTurns=(st.digestTurns||0)+1;
    const prev=st.prevTurnSeq||0; st.prevTurnSeq=st.seq;
    let rawLen=0;
    Object.values(st.line.threads||{}).forEach(th=>(th.msgs||[]).forEach(m=>{
      if(!m.sys&&(m.seq||0)>(st.digestCut||0)) rawLen+=chatPromptText(m).length+20; }));
    (st.moments||[]).forEach(mo=>{ if((mo.id||0)>(st.digestCut||0))
      rawLen+=String(mo.text||'').length+(mo.comments||[]).reduce((a,c)=>a+String(c.text||'').length,0)+20; });
    if((st.digestTurns>=20||rawLen>10000)&&prev>(st.digestCut||0)) watermark=prev;
  });
  if(watermark!=null) summarizeMemo(watermark,false,false).catch(()=>{});
}
function collectMemoItems(cut,w){
  const items=[];
  Object.entries(threadTable(S.store)).forEach(([id,th])=>{
    (th.msgs||[]).forEach(m=>{
      if(m.sys||(m.seq||0)<=cut||(m.seq||0)>w) return;
      const group=th.type==='group', who=m.dir==='out'?meName():(m.from||id);
      const to=group?('群「'+(th.name||id)+'」'):(m.dir==='out'?(th.name||id):meName());
      items.push({seq:m.seq,t:`[${m.d||''} ${m.t||''}] ${who}→${to}：${chatPromptText(m).slice(0,120)}`});
    });
  });
  (get(S.store,'moments',[])).forEach(mo=>{
    if((mo.id||0)<=cut||(mo.id||0)>w) return;
    items.push({seq:mo.id,t:`[${mo.d||''} ${mo.t||''}] ${mo.who||meName()} 发动态：${String(mo.text||'').slice(0,100)}${(mo.comments||[]).length?('（'+mo.comments.map(c=>c.from).join('、')+'有评论）'):''}`});
  });
  items.sort((a,b)=>a.seq-b.seq); return items;
}
function collectThreadMemoTargets(w,rebuild){
  const out=[];
  for(const [id,th] of Object.entries(threadTable(S.store))){
    const stored=obj(S.store.contactMemos)&&obj(S.store.contactMemos[id])?S.store.contactMemos[id]:null;
    const dirty=obj(S.store.memoDirty)&&S.store.memoDirty[id]===true;
    const from=(rebuild||dirty)?0:num(stored&&stored.through);
    const msgs=(th.msgs||[]).filter(m=>!m.sys&&num(m.seq)>from&&num(m.seq)<=w);
    if(!msgs.length&&!dirty) continue;
    const through=(th.msgs||[]).filter(m=>!m.sys&&num(m.seq)<=w).reduce((n,m)=>Math.max(n,num(m.seq)),0);
    if(!through) continue;
    out.push({id,name:String(th.name||id),type:th.type==='group'?'group':'dm',through,
      previous:(rebuild||dirty)?'':String(stored&&stored.text||'').trim(),
      lines:msgs.map(m=>`[${m.d||''} ${m.t||''}] ${m.dir==='out'?meName():(m.from||th.name||id)}：${chatPromptText(m).slice(0,140)}`)});
  }
  return out;
}
function parseMemoResult(raw,targets){
  const j=pickJSON(raw); if(!obj(j)||!Array.isArray(j.threads)) throw new Error('记忆整理返回格式不正确');
  const allowed=new Map(targets.map(x=>[x.id,x])), rows=[];
  for(const item of j.threads){
    const id=String(item&&item.id||''); if(!allowed.has(id)) continue;
    const text=String(item.summary||'').trim().slice(0,1500); if(!text) continue;
    rows.push({target:allowed.get(id),text}); allowed.delete(id);
  }
  if(rows.length!==targets.length) throw new Error('模型遗漏了一个或多个联系人备忘');
  const global=String(j.global||'').trim().slice(0,1200);
  if(!global) throw new Error('模型没有返回全局通讯摘要');
  return {rows,global};
}
async function summarizeMemo(w,manual,rebuild){
  if(memoBusy||(!manual&&!S.cfg.memoOn)||S.demo) return false;
  const cut=rebuild?0:num(get(S.store,'digestCut',0));
  const items=collectMemoItems(cut,w), targets=collectThreadMemoTargets(w,!!rebuild);
  if(!items.length&&!targets.length){
    if(!rebuild) await mutStore(st=>{ st.digestCut=w; st.digestTurns=0; });
    if(manual) toast('没有需要整理的新往来');
    return false;
  }
  memoBusy=true;
  try{
    const sysP=`你是手机通讯记忆整理器。把每个会话分别压缩为该会话自己的长期备忘，并另写一段供故事正文读取的全局通讯摘要。`
      + `每个联系人备忘只能使用该 id 对应区块中的既有备忘和消息，严禁把其他私聊或群聊的事实混入；`
      + `保留已经讲定的约定、关系变化、特殊称呼、未解决矛盾、重要偏好与有后续价值的具体事件，省略寒暄和重复话。`
      + `涉及跨日等待、迟回、错过时间、预约、截止时间、先后顺序或“昨天/今天/明天”语义时，必须保留消息记录中的绝对日期与时刻，不得只写成“最近”“后来”或“当天”。`
      + `只陈述记录中确实发生的事，不补写心理、动机或未来结果。每个联系人 summary 不超过 350 字，global 不超过 500 字。`;
    const blocks=targets.map(x=>[
      `【会话 id=${JSON.stringify(x.id)}；名称=${x.name}；类型=${x.type}；整理至 #${x.through}】`,
      x.previous?'既有备忘：'+x.previous:'既有备忘：（无或需从现存消息重建）',
      '本次消息：\n'+(x.lines.join('\n')||'（没有新增消息；请依据现存消息重建）')
    ].join('\n')).join('\n\n');
    const userP=[
      blocks||'【联系人会话】（无）',
      '【全局摘要素材】\n'+(items.map(x=>x.t).join('\n')||'（无新增公开素材）'),
      `输出 JSON：{"global":"全局通讯摘要","threads":[{"id":"必须逐字沿用输入 id","summary":"该会话专属备忘"}]}。`
        + `threads 只列输入中出现的会话；不能改写 id，不能合并不同会话。`+JSON_ONLY
    ].join('\n\n');
    const raw=await llm([{role:'system',content:sysP},{role:'user',content:userP}]);
    const result=parseMemoResult(raw,targets), td=nowTD();
    await mutStore(st=>{
      st.contactMemos=obj(st.contactMemos)?st.contactMemos:Object.create(null);
      st.memoDirty=obj(st.memoDirty)?st.memoDirty:Object.create(null);
      for(const row of result.rows){
        st.contactMemos[row.target.id]={text:row.text,through:row.target.through,d:td.d,t:td.t};
        delete st.memoDirty[row.target.id];
      }
      if(result.global){
        const segment={id:++st.seq,t:td.t,d:td.d,from:cut+1,to:w,turns:rebuild?0:(st.digestTurns||0),text:result.global};
        st.memoLog=rebuild?[segment]:(Array.isArray(st.memoLog)?st.memoLog.concat(segment):[segment]);
        st.digestMemo='';
      }
      st.digestCut=w; st.digestTurns=0;
    });
    toast(rebuild?'联系人备忘已按现存消息重建':'各联系人的新增往来已分别整理');
    if(!manual) await pushNote('memo','记忆整理完成','各会话已更新自己的长期备忘');
    return true;
  }catch(e){
    console.warn('[WN] memo',e);
    toast('记忆整理失败：'+(e&&e.message||'API错误')+'——原备忘与消息未受影响');
    return false;
  }finally{ memoBusy=false; }
}

async function refreshCurrentViewNow(){

  const scroll=scroller ? {

  } : null;
  const input=view==='thread' ? current.querySelector('[data-wn-thread-input]') : null;
  const draft=input ? {
    value:input.value,
    start:input.selectionStart,
    end:input.selectionEnd,
    focused:document.activeElement===input,
  } : null;

  if(currentId==='scr-home') renderHome();
  else if(currentId==='scr-contacts') renderContacts(false);
  else if(view==='contact' && key!==undefined && characterOf(key)) WN.contact(key,false);
  else if(currentId==='scr-lime') renderLime(false);
  else if(view==='thread' && key!==undefined && threadOf(key)) renderThread(key,false);
  else if(currentId==='scr-album') await renderAlbum(false);
  else if(view==='folder' && key!==undefined) await WN.folder(key,false);
  else if(currentId==='scr-journal') renderJournal(false);
  else if(currentId==='scr-schedule') renderSchedule(false);
  else if(currentId==='scr-campus') renderCampus(false);
  else if(currentId==='scr-help') renderGuide(false);
  else if(currentId==='scr-settings') renderSettings(false);
  else if((view==='contact' || view==='thread' || view==='folder') && S.stack.length>1){
    WN.back();
    await refreshCurrentViewNow();
    return;
  } else return;

  const targetId=S.stack[S.stack.length-1];
  requestAnimationFrame(()=>{
    if(S.stack[S.stack.length-1]!==targetId) return;
    const fresh=$id(targetId); if(!fresh) return;
    const nextScroll=fresh.querySelector(view==='thread'?'.bubs':'.body');
    if(scroll && nextScroll){
      nextScroll.scrollTop=scroll.atBottom
        ? nextScroll.scrollHeight
        : Math.min(scroll.top,Math.max(0,nextScroll.scrollHeight-nextScroll.clientHeight));
    }
    if(draft){
      const nextInput=fresh.querySelector('[data-wn-thread-input]');
      if(nextInput){
        nextInput.value=draft.value;
        if(draft.focused && !nextInput.disabled){
          nextInput.focus();
          try{ nextInput.setSelectionRange(draft.start,draft.end); }catch(_){}
        }
      }
    }
  });
}
