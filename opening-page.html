<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>东京生活区 · 综漫开场设定预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #e5eef1;
      --paper: #f8faf9;
      --ink: #294156;
      --text: #425d70;
      --muted: #7a8f9d;
      --line: #cbd9df;
      --blue: #527f98;
      --blue-soft: #e2edf1;
      --rose: #b67582;
      --rose-soft: #f3e7e9;
      --shadow: 0 22px 60px rgba(43, 72, 89, .13);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.7;
      background:
        linear-gradient(135deg, rgba(255,255,255,.56), transparent 42%),
        var(--bg);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(115deg, transparent 0 49%, rgba(82,127,152,.08) 49.2% 49.5%, transparent 49.7%),
        linear-gradient(35deg, transparent 0 49%, rgba(255,255,255,.35) 49.2% 49.5%, transparent 49.7%);
      background-size: 28px 28px, 36px 36px;
      mix-blend-mode: multiply;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid rgba(183,123,135,.28); outline-offset: 3px; }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 24px auto;
    }

    .book {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(74,111,132,.18);
      border-radius: 6px;
      background:
        linear-gradient(90deg, rgba(82,127,152,.035), transparent 11%, transparent 89%, rgba(182,117,130,.035)),
        rgba(248,250,249,.96);
      box-shadow: var(--shadow);
    }

    .stage { position: relative; isolation: isolate; padding: 44px 52px 38px; }
    .stage::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 34px;
      bottom: 32px;
      left: 24px;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(82,127,152,.22) 18%, rgba(82,127,152,.22) 82%, transparent);
    }
    .page { display: none; min-height: 650px; animation: pageIn .32s ease both; }
    .page.active { display: block; }
    .page.back { animation-name: pageBack; }

    @keyframes pageIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pageBack {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    h1, h2, h3, p { margin-top: 0; }
    h1, h2 {
      color: var(--ink);
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-weight: 600;
      letter-spacing: .035em;
    }
    h1 { margin-bottom: 22px; font-size: clamp(42px, 6vw, 68px); line-height: 1.08; }
    h2 { position: relative; margin-bottom: 34px; font-size: clamp(30px, 4vw, 43px); line-height: 1.2; }
    h2::after {
      content: "";
      display: block;
      width: 54px;
      height: 2px;
      margin-top: 15px;
      background: linear-gradient(90deg, var(--rose), var(--blue));
    }
    h3 { margin-bottom: 8px; color: var(--ink); font-size: 17px; }
    p { margin-bottom: 0; }

    .cover-page { display: none; align-items: center; }
    .cover-page.active { display: grid; }
    .cover-layout {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(280px, .9fr) minmax(0, 1.1fr);
      gap: 52px;
      align-items: center;
    }
    .cover-image {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid rgba(74,111,132,.14);
      background: #d5e1e5;
      box-shadow: 10px 12px 0 rgba(82,127,152,.08), 0 18px 38px rgba(43,72,89,.18);
    }
    .cover-image img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .cover-copy { min-width: 0; display: flex; flex-direction: column; align-items: stretch; }
    .cover-copy > p { max-width: 520px; margin-bottom: 0; padding-left: 18px; color: #597183; font-size: 18px; border-left: 2px solid rgba(182,117,130,.62); }

    .btn {
      min-height: 44px;
      padding: 9px 19px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      letter-spacing: .03em;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--blue); background: rgba(226,237,241,.56); }
    .btn.primary { color: white; border-color: var(--blue); background: var(--blue); box-shadow: 5px 5px 0 rgba(82,127,152,.14); }
    .btn.primary:hover { background: #466f86; box-shadow: 3px 3px 0 rgba(82,127,152,.12); }
    .btn:disabled { cursor: default; opacity: .38; background: transparent; }
    .action-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 84px; }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px;
    }
    .work-item { min-width: 0; }
    .work-image {
      height: 245px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #d6e1e5;
    }
    .work-image img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .work-item.pending .work-image { filter: saturate(.25); opacity: .72; }
    .work-caption { padding: 13px 0 0; }
    .work-caption strong { display: block; color: var(--ink); font-size: 18px; }
    .work-caption span { color: var(--muted); font-size: 14px; }
    .release {
      margin-top: 38px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .release p { color: #5c7281; }
    .release p + p { margin-top: 12px; }
    .release a { color: var(--rose); word-break: break-all; }

    .form-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 21px;
      padding: 24px;
      border: 1px solid rgba(82,127,152,.18);
      background:
        linear-gradient(90deg, rgba(82,127,152,.045), transparent 30%, transparent 72%, rgba(182,117,130,.035)),
        rgba(255,255,255,.38);
      box-shadow: 0 14px 34px rgba(43,72,89,.055), inset 0 1px rgba(255,255,255,.76);
    }
    .form-grid::before {
      content: "";
      position: absolute;
      top: -1px;
      left: -1px;
      width: 128px;
      height: 2px;
      background: linear-gradient(90deg, var(--rose), var(--blue));
    }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .profile-name-field {
      padding-bottom: 21px;
      border-bottom: 1px solid rgba(82,127,152,.16);
    }
    .profile-copy-field {
      position: relative;
      padding-left: 16px;
    }
    .profile-copy-field::before {
      content: "";
      position: absolute;
      top: 35px;
      bottom: 0;
      left: 0;
      width: 2px;
      background: linear-gradient(180deg, rgba(82,127,152,.74), rgba(182,117,130,.34));
    }
    label { display: block; margin-bottom: 8px; color: var(--ink); font-size: 15px; font-weight: 650; letter-spacing: .015em; }
    input, select, textarea {
      width: 100%;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 2px;
      outline: none;
      background: rgba(255,255,255,.78);
      box-shadow: inset 0 1px rgba(255,255,255,.86);
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    input, select { min-height: 46px; padding: 9px 12px; }
    textarea { min-height: 112px; padding: 11px 12px; resize: vertical; }
    .profile-copy-field textarea { min-height: 126px; line-height: 1.65; }
    input::placeholder, textarea::placeholder { color: #83919a; opacity: 1; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      background: rgba(255,255,255,.96);
      box-shadow: 0 0 0 2px rgba(82,127,152,.1), inset 0 1px rgba(255,255,255,.9);
    }
    .storage-line {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      align-items: baseline;
      margin-top: 22px;
      padding: 14px 2px 0;
      border-top: 1px solid rgba(82,127,152,.14);
      color: var(--muted);
      font-size: 13px;
    }
    .storage-line code { color: #64879a; font-family: inherit; }

    .choice-list { border-top: 1px solid var(--line); }
    .mode-row {
      width: 100%;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 16px;
      padding: 24px 6px;
      text-align: left;
      color: var(--text);
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }
    .mode-row:hover { background: rgba(226,237,241,.38); }
    .mode-row.selected { background: rgba(226,237,241,.7); }
    .mode-mark { width: 15px; height: 15px; margin-top: 6px; border: 1px solid var(--blue); border-radius: 50%; }
    .mode-row.selected .mode-mark { border: 4px solid var(--blue); }
    .mode-row strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 19px; }

    .opening-list { border-top: 1px solid var(--line); }
    .opening-row {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 15px;
      align-items: start;
      padding: 16px 6px;
      text-align: left;
      color: var(--text);
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }
    .opening-row:hover { background: rgba(226,237,241,.36); }
    .opening-row.selected { background: rgba(226,237,241,.72); }
    .opening-number { color: var(--muted); font-variant-numeric: tabular-nums; }
    .opening-row strong { display: block; color: var(--ink); font-size: 16px; }
    .opening-row span { display: block; margin-top: 2px; color: #718694; font-size: 14px; }

    .free-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .free-grid .field.full { grid-column: 1 / -1; }
    .free-grid textarea { min-height: 230px; }

    .summary { margin: 0; border-top: 1px solid var(--line); }
    .summary-row {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr);
      gap: 18px;
      padding: 16px 2px;
      border-bottom: 1px solid var(--line);
    }
    .summary dt { color: var(--muted); }
    .summary dd { margin: 0; color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
    .preview-block { margin-top: 28px; padding: 20px 0 0; border-top: 1px solid var(--line); }
    .preview-block h3 { margin-bottom: 12px; }
    .preview-block pre {
      max-height: 260px;
      margin: 0;
      padding: 15px;
      overflow: auto;
      color: #4d6778;
      border-left: 3px solid var(--blue);
      background: #eef4f5;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .finish-row { margin-top: 26px; }

    .book-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 16px 52px 20px;
      border-top: 1px solid var(--line);
      background: rgba(248,250,249,.96);
    }
    .book-footer .back { justify-self: start; }
    .book-footer .next { justify-self: end; }
    .page-count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .book-footer[hidden] { display: none; }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: min(340px, calc(100vw - 40px));
      padding: 12px 15px;
      color: white;
      border-radius: 3px;
      background: rgba(41,65,86,.94);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 700px) {
      .shell { width: 100%; margin: 0; }
      .book { min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      .stage { padding: 30px 20px 26px; }
      .stage::before { display: none; }
      .page { min-height: calc(100dvh - 120px); }
      .cover-layout { grid-template-columns: 1fr; gap: 30px; }
      .cover-image { width: min(100%, 360px); margin: 0 auto; }
      .cover-copy > p { font-size: 16px; }
      .action-row { margin-top: 52px; justify-content: flex-end; }
      .work-grid, .form-grid, .free-grid { grid-template-columns: 1fr; }
      .form-grid { gap: 18px; padding: 20px 17px; }
      .profile-copy-field { padding-left: 12px; }
      .profile-copy-field textarea { min-height: 118px; }
      .field.full, .free-grid .field.full { grid-column: auto; }
      .work-image { height: 200px; }
      .summary-row { grid-template-columns: 1fr; gap: 3px; }
      .book-footer { position: sticky; bottom: 0; z-index: 3; padding: 13px 18px calc(14px + env(safe-area-inset-bottom)); }
      .book-footer .btn { min-width: 80px; padding-inline: 12px; }
    }

    /* 整体视觉方案：清透蓝灰设定册。只以留白、色块和层级塑造质感。 */
    :root {
      --bg: #e7f0f3;
      --paper: #fbfcfb;
      --ink: #263f53;
      --text: #496474;
      --muted: #7d919c;
      --line: #d4e0e4;
      --blue: #4e819b;
      --blue-soft: #e7f1f4;
      --rose: #b97986;
      --rose-soft: #f6eaec;
      --shadow: 0 26px 70px rgba(43,72,89,.14);
    }
    body {
      background:
        radial-gradient(circle at 10% 5%, rgba(255,255,255,.72), transparent 34%),
        radial-gradient(circle at 92% 88%, rgba(185,121,134,.08), transparent 28%),
        var(--bg);
    }
    body::before {
      opacity: .55;
      background-image:
        radial-gradient(circle at 18% 22%, rgba(78,129,155,.055), transparent 24%),
        radial-gradient(circle at 78% 14%, rgba(185,121,134,.045), transparent 22%);
      background-size: auto;
      mix-blend-mode: normal;
    }
    .shell { width: min(1020px, calc(100% - 32px)); margin: 28px auto; }
    .book {
      border-color: rgba(74,111,132,.16);
      border-radius: 12px;
      background:
        radial-gradient(circle at 96% 4%, rgba(185,121,134,.055), transparent 28%),
        linear-gradient(115deg, rgba(78,129,155,.045), transparent 24%, transparent 76%, rgba(255,255,255,.36)),
        rgba(251,252,251,.95);
      box-shadow: var(--shadow);
    }
    .stage { padding: 50px 58px 44px; }
    .stage::before,
    h2::after,
    .form-grid::before,
    .profile-copy-field::before { content: none; display: none; }
    h1, h2 { letter-spacing: .045em; }
    h2 { margin-bottom: 34px; }

    .cover-layout { gap: 64px; }
    .cover-image {
      border-radius: 9px;
      box-shadow: 10px 12px 0 rgba(82,127,152,.07), 0 22px 42px rgba(43,72,89,.17);
    }
    .cover-copy > p {
      max-width: 520px;
      padding: 15px 17px;
      border: 0;
      border-radius: 5px;
      background: rgba(231,241,244,.62);
    }
    .action-row { margin-top: 58px; }

    .btn {
      border-radius: 6px;
      background: rgba(255,255,255,.36);
    }
    .btn.primary {
      border-color: var(--blue);
      background: linear-gradient(135deg, #568ca5, #47758e);
      box-shadow: 5px 5px 0 rgba(82,127,152,.13);
    }
    .btn.primary:hover {
      background: linear-gradient(135deg, #4d8099, #3f697f);
      box-shadow: 3px 3px 0 rgba(82,127,152,.11);
    }

    .work-grid { gap: 24px; }
    .work-image {
      height: 258px;
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(43,72,89,.08);
    }
    .work-caption {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: baseline;
      padding: 14px 2px 0;
    }
    .work-caption strong { font-size: 19px; }
    .work-caption span { font-size: 13px; text-align: right; }
    .release {
      margin-top: 34px;
      padding: 17px 18px;
      border: 0;
      border-radius: 6px;
      background: rgba(231,241,244,.55);
    }

    .form-grid {
      gap: 20px;
      padding: 25px;
      border-color: rgba(82,127,152,.16);
      border-radius: 8px;
      background:
        radial-gradient(circle at 95% 5%, rgba(185,121,134,.045), transparent 24%),
        rgba(255,255,255,.42);
      box-shadow: 0 14px 34px rgba(43,72,89,.05), inset 0 1px rgba(255,255,255,.76);
    }
    .profile-name-field { padding-bottom: 5px; border: 0; }
    .profile-copy-field { padding-left: 0; }
    input, select, textarea {
      border-radius: 4px;
      background: rgba(255,255,255,.8);
      box-shadow: inset 0 1px rgba(255,255,255,.86), 0 2px 7px rgba(43,72,89,.025);
    }
    .storage-line { margin-top: 20px; padding: 0 2px; border: 0; }

    .choice-list { display: grid; gap: 12px; border: 0; }
    .mode-row {
      gap: 16px;
      padding: 21px 20px;
      border: 1px solid rgba(82,127,152,.15);
      border-radius: 8px;
      background: rgba(255,255,255,.36);
      box-shadow: 0 7px 18px rgba(43,72,89,.035);
      transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .mode-row:hover {
      transform: translateY(-1px);
      border-color: rgba(82,127,152,.3);
      background: rgba(231,241,244,.62);
      box-shadow: 0 10px 22px rgba(43,72,89,.06);
    }
    .mode-row.selected {
      border-color: rgba(82,127,152,.34);
      background: linear-gradient(100deg, rgba(231,241,244,.88), rgba(246,234,236,.54));
    }
    .mode-mark { width: 13px; height: 13px; margin-top: 5px; border-width: 2px; }
    .mode-row.selected .mode-mark { border-width: 4px; }
    .mode-row strong { margin-bottom: 4px; }

    .opening-list { display: grid; gap: 10px; border: 0; }
    .opening-row {
      gap: 16px;
      padding: 16px 18px;
      border: 1px solid rgba(82,127,152,.15);
      border-radius: 7px;
      background: rgba(255,255,255,.36);
      box-shadow: 0 6px 16px rgba(43,72,89,.03);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .opening-row:hover {
      transform: translateY(-1px);
      border-color: rgba(82,127,152,.3);
      background: rgba(231,241,244,.62);
    }
    .opening-row.selected {
      border-color: rgba(82,127,152,.34);
      background: linear-gradient(100deg, rgba(231,241,244,.88), rgba(246,234,236,.52));
    }
    .opening-number {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: var(--blue);
      border-radius: 6px;
      background: rgba(231,241,244,.84);
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 18px;
    }

    .free-grid {
      gap: 20px;
      padding: 23px;
      border: 1px solid rgba(82,127,152,.16);
      border-radius: 8px;
      background: rgba(255,255,255,.38);
      box-shadow: 0 12px 28px rgba(43,72,89,.045);
    }
    .free-grid textarea { min-height: 210px; }

    .summary { display: grid; gap: 9px; border: 0; }
    .summary-row {
      gap: 18px;
      padding: 15px 17px;
      border: 0;
      border-radius: 6px;
      background: rgba(231,241,244,.54);
    }
    .preview-block {
      margin-top: 24px;
      padding: 18px;
      border: 0;
      border-radius: 7px;
      background: rgba(255,255,255,.42);
    }
    .preview-block pre {
      padding: 15px 16px;
      border: 1px solid rgba(82,127,152,.14);
      border-radius: 4px;
      background: #eef4f5;
    }

    .book-footer {
      padding: 18px 52px 22px;
      border: 0;
      background: rgba(248,250,249,.88);
      box-shadow: 0 -12px 28px rgba(43,72,89,.045);
    }

    @media (max-width: 700px) {
      .shell { width: 100%; margin: 0; }
      .book { border-radius: 0; }
      .stage { padding: 30px 20px 26px; }
      .cover-layout { gap: 30px; }
      .action-row { margin-top: 46px; }
      .form-grid { gap: 18px; padding: 20px 17px; }
      .profile-copy-field { padding-left: 0; }
      .free-grid { padding: 18px; }
      .work-image { height: 200px; }
      .book-footer { padding: 13px 18px calc(14px + env(safe-area-inset-bottom)); }
    }

    /* Galgame 视觉层：七页流程不变，改为标题画面＋剧情选择面板。 */
    .book {
      isolation: isolate;
      min-height: 760px;
      background: #eaf2f5;
    }
    .book::before,
    .book::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .book::before {
      z-index: -2;
      background-image: url("https://birdimage.kdns.fr/PicGo/%E6%81%8B%E4%BA%BA%E4%B8%8D%E8%A1%8C%E9%BB%98%E8%AE%A4%E5%B1%95%E5%BC%80%E5%BA%95%E5%9B%BE.jpg");
      background-repeat: no-repeat;
      background-position: 32% center;
      background-size: cover;
      opacity: .34;
      filter: saturate(.78) contrast(.94) brightness(1.08);
      transform: scale(1.025);
      transition: opacity .35s ease, background-position .45s ease, filter .35s ease;
    }
    .book::after {
      z-index: -1;
      background:

            option.textContent = String(item.label || item.value || '');
            option.selected = option.value === chapter.value;
            chapterSelect.append(option);
          });
          chapterField.append(chapterLabel, chapterSelect);

          const eventField = document.createElement('div');
          eventField.className = 'field work-progress';
          eventField.dataset.workPanel = key;
          const eventLabel = document.createElement('label');
          eventLabel.htmlFor = `workEvent-${key}`;
          eventLabel.textContent = `${workName(key)}事件`;
          const eventSelect = document.createElement('select');
          eventSelect.id = `workEvent-${key}`;
          eventSelect.dataset.workEvent = key;
          (Array.isArray(chapter.events) ? chapter.events : []).forEach((eventName) => {
            const option = document.createElement('option');
            option.value = String(eventName);
            option.textContent = String(eventName);
            option.selected = option.value === state.progress[key].event;
            eventSelect.append(option);
          });
          eventField.append(eventLabel, eventSelect);
          host.append(chapterField, eventField);
        });
      }

      function syncWorkSelection() {
        const enabledKeys = enabledWorkKeys();
        document.querySelectorAll('[data-work]').forEach((node) => {
          const enabled = Boolean(state.works[node.dataset.work]);
          node.classList.toggle('selected', enabled);
          node.setAttribute('aria-pressed', String(enabled));
          const label = node.querySelector('.work-state');
          if (label) label.textContent = enabled ? '已启用' : '点击启用';
        });
        document.querySelectorAll('[data-work-panel]').forEach((node) => {
          node.hidden = !state.works[node.dataset.workPanel];
        });
        const cover = $('catalogCover');
        cover.style.setProperty('--cover-count', String(Math.max(1, enabledKeys.length)));
        cover.classList.toggle('multi', enabledKeys.length > 1);
        document.querySelectorAll('[data-cover-work]').forEach((node) => {
          node.classList.toggle('enabled', Boolean(state.works[node.dataset.coverWork]));
        });
        renderCoverTitle();

        const available = availableOpenings();
        const presetAvailable = available.length > 0;
        const presetMode = document.querySelector('.mode-row[data-mode="preset"]');
        if (presetMode) {
          presetMode.disabled = !presetAvailable;
          presetMode.setAttribute('aria-disabled', String(!presetAvailable));
          const description = presetMode.querySelector('[data-preset-description]');
          if (description) {
            description.textContent = presetAvailable
              ? '显示与当前作品启用方式匹配的正式开场。'
              : '当前作品组合使用自由开场。';
          }
        }
        if (!presetAvailable && state.mode === 'preset') state.mode = 'free';
        document.querySelectorAll('.mode-row[data-mode]').forEach((node) => {
          node.classList.toggle('selected', node.dataset.mode === state.mode);
        });
        if (!available.some((opening) => opening.id === state.openingId)) {
          state.openingId = available[0]?.id || '';
        }
        renderOpenings();
      }

      function renderOpenings() {
        const host = $('openingList');
        host.textContent = '';
        const available = availableOpenings();
        if (!available.length) {
          const empty = document.createElement('div');
          empty.className = 'opening-empty';
          empty.textContent = `“${workLabel()}”当前还没有可直接切换的预设开场，请返回选择自由开场。`;
          host.append(empty);
          return;
        }
        available.forEach((opening, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `opening-row${state.openingId === opening.id ? ' selected' : ''}`;
          button.dataset.opening = opening.id;
          button.dataset.swipe = String(opening.swipe);

          const number = document.createElement('span');
          number.className = 'opening-number';
          number.textContent = String(index + 1).padStart(2, '0');

          const copy = document.createElement('span');
          const title = document.createElement('strong');
          title.textContent = opening.title;
          const summary = document.createElement('span');
          summary.textContent = opening.summary;
          copy.append(title, summary);
          button.append(number, copy);
          host.append(button);
        });
      }
      function playerName() {
        return $('playerName').value.trim() || '当前玩家名';
      }

      function buildProfile() {
        const identity = $('playerIdentity').value.trim() || '（未填写）';
        const appearance = $('playerAppearance').value.trim() || '（未填写）';
        const personality = $('playerPersonality').value.trim() || '（未填写）';
        const boundary = $('playerBoundary').value.trim() || '（未填写）';
        return `<玩家档案>\n玩家名字/称呼：${playerName()}\n身份设定：${identity}\n第一印象/外在特征：${appearance}\n性格与习惯：${personality}\n目标或边界：${boundary}\n\n档案只作为玩家主动填写的角色设定参考。\n不要替玩家发言、行动或决定重大关系。\n玩家后续明确表达优先于档案。\n</玩家档案>`;
      }

      function buildOpening() {
        const detail = state.cutIn.trim() || '（未填写）';
        const lines = ['【开局设定】', `启用作品：${workLabel()}`];
        enabledWorkKeys().forEach((key) => {
          const progress = state.progress[key] || {};
          lines.push(`${workName(key)}进度：${progress.chapter || '（未指定）'}`);
          lines.push(`${workName(key)}事件：${progress.event || '（未指定）'}`);
        });
        lines.push(`切入剧情设定：${detail}`);
        return lines.join('\n');
      }

      function syncSummary() {
        const opening = selectedOpening();
        $('summaryPlayer').textContent = playerName();
        $('summaryWorks').textContent = workLabel();
        $('summaryMode').textContent = state.mode === 'preset' ? '预设开场' : '自由开场';
        $('summaryOpening').textContent = state.mode === 'preset'
          ? opening?.title || '暂无匹配的预设开场'
          : enabledWorkKeys().map((key) => {
              const chapter = currentChapter(key), progress = state.progress[key] || {};
              return `${workName(key)}：${chapter.label || progress.chapter || '未指定'}｜${progress.event || '未指定'}`;
            }).join('\n');
        $('profilePreview').textContent = buildProfile();
        $('openingPreviewBlock').hidden = state.mode !== 'free';
        $('openingPreview').textContent = buildOpening();
      }

      function nextPage(page) {
        if (page === 3) return state.mode === 'preset' ? 4 : 5;
        if (page === 4 || page === 5) return 6;
        return page + 1;
      }

      function previousPage(page) {
        if (page === 4 || page === 5) return 3;
        if (page === 6) return state.mode === 'preset' ? 4 : 5;
        return page - 1;
      }

      function showPage(next, direction = 1) {
        state.page = Math.max(0, Math.min(6, next));
        document.querySelector('.book').dataset.currentPage = String(state.page);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        window.scrollTo(0, 0);
        requestAnimationFrame(() => window.scrollTo(0, 0));

        pages.forEach((page) => {
          const active = Number(page.dataset.page) === state.page;
          page.classList.toggle('active', active);
          page.classList.toggle('back', active && direction < 0);
        });

        $('backBtn').disabled = state.page === 0;
        $('bookFooter').hidden = state.page === 0;
        $('nextBtn').hidden = state.page === 6;
        $('finishBtn').hidden = state.page !== 6;
        $('pageCount').textContent = `${state.page + 1} / 7`;
        syncSummary();
      }

      document.addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]');
        if (action) {
          if (action.dataset.action === 'next') {
            if (state.page === 4 && state.mode === 'preset' && !selectedOpening()) {
              toast('当前作品组合暂无预设开场，请返回选择自由开场。');
              return;
            }
            showPage(nextPage(state.page), 1);
          }
          if (action.dataset.action === 'back') showPage(previousPage(state.page), -1);
          if (action.dataset.action === 'finish') {
            if (state.mode === 'preset' && !selectedOpening()) {
              toast('当前作品组合暂无预设开场，请改用自由开场。');
              return;
            }
            toast('当前为界面预览，尚未写入角色卡。');
          }
          return;
        }

        const work = event.target.closest('[data-work]');
        if (work) {
          const key = work.dataset.work;
          if (state.works[key] && enabledWorkKeys().length === 1) {
            toast('至少保留一部作品。');
            return;
          }
          state.works[key] = !state.works[key];
          syncWorkSelection();
          syncSummary();
          return;
        }

        const mode = event.target.closest('.mode-row[data-mode]');
        if (mode) {
          state.mode = mode.dataset.mode;
          document.querySelectorAll('.mode-row[data-mode]').forEach((node) => node.classList.toggle('selected', node.dataset.mode === state.mode));
          syncSummary();
          return;
        }

        const opening = event.target.closest('[data-opening]');
        if (opening) {
          state.openingId = opening.dataset.opening;
          renderOpenings();
          syncSummary();
        }
      });

      $('workProgressGrid').addEventListener('change', (event) => {
        const chapterKey = event.target.dataset.workChapter;
        const eventKey = event.target.dataset.workEvent;
        if (chapterKey) {
          const progress = state.progress[chapterKey] || (state.progress[chapterKey] = {chapter:'',event:''});
          progress.chapter = event.target.value;
          const chapter = currentChapter(chapterKey);
          progress.event = String(chapter.events && chapter.events[0] || '');
          renderWorkProgress();
          syncWorkSelection();
        } else if (eventKey) {
          const progress = state.progress[eventKey] || (state.progress[eventKey] = {chapter:'',event:''});
          progress.event = event.target.value;
        }
        syncSummary();
      });

      $('cutInText').addEventListener('input', (event) => {
        state.cutIn = event.target.value;
        syncSummary();
      });

      ['playerName','playerIdentity','playerAppearance','playerPersonality','playerBoundary'].forEach((id) => {
        $(id).addEventListener('input', syncSummary);
      });

      renderWorkChoices();
      renderCoverPanels();
      renderWorkProgress();
      syncWorkSelection();
      syncSummary();
      showPage(0);
    })();
  </script>
</body>
</html>
